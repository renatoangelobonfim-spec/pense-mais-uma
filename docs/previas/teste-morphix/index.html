<section><h2>A rua acorda</h2><p>As três cenas de <i>Trabalhar menos</i>, na ordem da manhã.</p><figure class="cena"><img src="../../cursos/trabalhar-menos/cenas/mariana.webp" width="1280" height="720" loading="lazy" alt="Mariana ergue a porta azul da loja ao amanhecer."></figure><figure class="cena"><img src="../../cursos/trabalhar-menos/cenas/andre.webp" width="1280" height="720" loading="lazy" alt="André confere a escala no balcão, com a bolsa ao lado."></figure><figure class="cena"><img src="../../cursos/trabalhar-menos/cenas/joana.webp" width="1280" height="720" loading="lazy" alt="Joana abre o computador na janela de frente para a loja."></figure><a href="../../cursos/trabalhar-menos/jogar.html#seg">Abrir o capítulo ilustrado →</a></section></main>
<script>
const arquivos = [
  {src:'referencia.mp3', nome:'gravação atual do curso'},
  {src:'conversa.mp3', nome:'gravação do Morphix'}
];
if (Math.random() < .5) arquivos.reverse();
const players = [...document.querySelectorAll('#dupla audio')];
players.forEach((player,i) => {
  player.src = arquivos[i].src;
  player.addEventListener('play', () => players[1-i].pause());
});
document.getElementById('resposta').textContent = 'Versão A — ' + arquivos[0].nome + '. Versão B — ' + arquivos[1].nome + '.';
document.getElementById('dupla').hidden = false;
</script></body></html>
