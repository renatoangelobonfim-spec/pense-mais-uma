{tp:"f",k:"Não é só aqui",big:"2 a 3×",t:"Em cinco de seis países ricos pesquisados por economistas de Harvard, as pessoas achavam que havia de duas a três vezes mais imigrantes do que havia. [[ams_vox]]",p:"Os autores concluem que as histórias que circulam pesam mais na opinião sobre imigração do que os números. [[ams_nber]] Países com pouca imigração, como o Brasil, estão entre os que mais exageram. [[ipsos15]]"},
{tp:"c",id:"ven",cur:"Venezuelanos no Brasil",q:"Quantos venezuelanos vivem hoje no Brasil?",min:0,max:3000,step:10,un:"mil",real:680,realTxt:"680 mil",
 depois:"Estimativa do OBMigra para o início de 2026. Venezuelanos, haitianos, cubanos e angolanos são os grupos em destaque no relatório. [[abr_obm]] Nos primeiros 13 dias de 2026, a entrada por Pacaraima caiu pela metade em relação ao mesmo período de 2025. [[casa_ven]]"},
{tp:"f",k:"Boa Vista, 2016 → 2018",big:"14×",t:"Os atendimentos ambulatoriais a venezuelanos na capital de Roraima passaram de 3.445 em 2016 para 48.454 em 2018. [[folhabv_saude]]",p:"Em 2016, o secretário de Saúde disse que a superlotação, agravada pelo atendimento a estrangeiros, deixava o estado sem dinheiro para cobrir os atendimentos. [[folhabv_sec]] Em 2018, Roraima pediu no STF cerca de R$ 180 milhões à União para cobrir esses custos; em 2019, o processo foi suspenso. [[rr_comp]] [[migalhas]]"},
{tp:"c",id:"acolhida",cur:"Levados de Roraima",q:"Quantos venezuelanos o governo levou de Roraima para outras cidades do país?",min:0,max:500,step:5,un:"mil",real:157,realTxt:"mais de 157 mil",
 depois:"É a interiorização da Operação Acolhida, que leva, de forma voluntária, quem chega a Roraima para outros estados. [[acnur8]]"},
{tp:"v",k:"E os empregos em Roraima?",t:"Quatro estudos, respostas diferentes",itens:[
 ["Ipea","Encontrou queda de quase 10% no salário formal em Roraima depois da chegada dos venezuelanos. [[ipea_rr]]"],
 ["Universidade da Geórgia","Encontrou alta de cerca de 2% nos salários dos brasileiros em Roraima e quase nenhum emprego perdido; parte deles mudou de ocupação. [[santanna]]"],
 ["Ryu e Paudel","Encontraram queda na taxa de emprego e na participação no mercado de trabalho, sem efeito no salário por hora. [[ryu]]"],
 ["FGV, OBMigra e UFRR","Encontraram economia mais diversificada e o maior aumento de área plantada do país, mas também mais desemprego e pobreza. [[folhabv_fgv]] [[fgv_rr]]"]],
 nota:"Os estudos olham o mesmo estado e chegam a conclusões diferentes: o efeito depende do que se mede."},
{tp:"c",id:"formal",cur:"Imigrantes com carteira",q:"Quantos imigrantes trabalham com carteira assinada no Brasil?",min:0,max:2000,step:10,un:"mil",real:415,realTxt:"415 mil",
 depois:"Em 2025, foram 414,96 mil vínculos formais, 54% a mais que em 2023. [[abr_obm]] [[acritica]] Mais de 4 em cada 10 estão na indústria, sobretudo em frigoríficos do Sul. [[abr_obm]]"},
{tp:"c",id:"opiniao",cur:"Acham que tiram empregos",q:"De cada 100 brasileiros, quantos acham que imigrantes tiram empregos dos nativos?",min:0,max:100,step:1,un:"",real:32,realTxt:"32",
 depois:"Pesquisa Ipsos de 2025, com público mais urbano. 24% acham que a imigração deveria ser paralisada para deixar o país mais forte, contra 44% na média de 31 países. [[ipsos25]]"},
{tp:"c",id:"ext",cur:"Brasileiros no exterior",q:"E na direção contrária: quantos brasileiros vivem fora do Brasil?",min:0,max:20,step:0.1,un:"milhões",real:5.3,realTxt:"5,3 milhões",
 depois:"Recorde, segundo o Itamaraty; cerca de 4 em cada 10 vivem nos Estados Unidos. [[ext25]] É mais que o dobro dos imigrantes que vivem aqui. [[jb_1pct]]"},
{tp:"f",k:"O caminho de volta",big:"3.294",t:"Em 2025, os EUA deportaram ao menos 3.294 brasileiros, segundo a PF e o Ministério dos Direitos Humanos, o maior número da série, que começa em 2020. [[dep_pf]] O Itamaraty, em resposta à Câmara, contou 2.785. [[dep_mre]]",p:"No fim de 2025, o Itamaraty estimava 2,6 mil brasileiros presos lá por questões migratórias. [[dep_mre]]"},
{tp:"c",id:"crime",cur:"Prisões no Texas",q:"Imagine dois grupos do mesmo tamanho no Texas: nativos e imigrantes sem documentos. Para cada 100 nativos presos por crime violento, quantos imigrantes sem documentos são presos?",min:0,max:300,step:5,un:"",real:50,lt:true,lo:35,realTxt:"menos de 50",
 depois:"Estudo financiado em parte pelo Departamento de Justiça dos EUA: imigrantes sem documentos são presos a menos da metade da taxa dos nativos por crimes violentos (dados de 2012 a 2018; são prisões, não condenações). [[nij]]"},
{tp:"v",k:"Mas depende do país",t:"Crime e salário lá fora",itens:[
 ["Suécia","Nascidos no exterior têm 2,5 vezes mais chance de ser registrados como suspeitos de crime; descontando idade, sexo e condições de vida, a diferença cai para 1,8 vez. [[bra21]] O mesmo órgão diz que, na tendência geral do crime, a migração pesa pouco perto de outros fatores. [[bra26]]"],
 ["EUA, salários","As Academias Nacionais concluíram que, em 10 anos ou mais, o efeito nos salários dos nativos em geral é muito pequeno, e que perdem mais os menos escolarizados. [[nas16]] O economista George Borjas, de Harvard, enfatiza o prejuízo para os trabalhadores pouco qualificados. [[borjas]]"]],
 nota:"Um número de um país não se transfere automaticamente para outro."}
];

const VOTO=[
 {t:"Acolher e espalhar pelo país",s:"ampliar a interiorização, como a Operação Acolhida",pro:"Quem defende cita os mais de 157 mil venezuelanos levados para outras cidades, a alta de cerca de 2% nos salários dos brasileiros em Roraima e o PIB do estado crescendo mais que a média dos outros estados em 2016–2017. [[acnur8]] [[santanna]] [[fgv_rr]]",con:"Quem critica cita o estudo do Ipea, com queda de quase 10% no salário formal em Roraima, e o aumento do desemprego e da pobreza no estado. [[ipea_rr]] [[fgv_rr]]"},
 {t:"Mais controle na fronteira",s:"limitar a entrada até os estados darem conta",pro:"Quem defende lembra que os atendimentos a venezuelanos em Boa Vista se multiplicaram por 14 e que, em 2018, Roraima pediu compensação à União no STF. [[folhabv_saude]] [[rr_comp]]",con:"Quem critica cita o estudo da Universidade da Geórgia, que achou perda desprezível de empregos para brasileiros em Roraima, e Tomás Guzmán, da Casa Venezuela, para quem quem deixou a Venezuela saiu por falta de opção. [[santanna]] [[casa_ven]]"},
 {t:"Escolher por qualificação",s:"atrair quem o mercado de trabalho precisa",pro:"Quem defende cita as Academias Nacionais dos EUA: imigrantes qualificados podem trazer ganhos, e quem perde mais são os trabalhadores pouco qualificados. [[nas16]] [[borjas]]",con:"Quem critica lembra que boa parte de quem chega ao Brasil foge de crise e não escolhe a vaga: segundo Tomás Guzmán, da Casa Venezuela, quem deixou a Venezuela saiu por falta de opção. [[casa_ven]]"}
];

const KEY="pmu-imigracao";let S={i:0,g:{},vote:null,fb:{}};try{const o=JSON.parse(localStorage.getItem(KEY)||"null");if(o)S={...S,...o,fb:{...(o.fb||{})},g:{...(o.g||{})}}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const N={},ORD=[];const num=k=>{if(FONTES[k]&&!(k in N)){ORD.push(k);N[k]=ORD.length}};
const scan=o=>JSON.stringify(o).replace(/\[\[([a-z0-9_]+)\]\]/g,(m,k)=>num(k));
STORIES.forEach(scan);scan(["[[ams_vox]]"]);scan(VOTO);
const sup=k=>FONTES[k]?`<sup><button type="button" class="fn" data-f="${k}" aria-label="Fonte ${N[k]}: ${esc(FONTES[k].s)}">${N[k]}</button></sup>`:"";
const tx=h=>esc(h).replace(/\s*\[\[([a-z0-9_]+)\]\]/g,(m,k)=>sup(k));
const fmt=(v,st)=>st<1?String(v.toFixed(1)).replace(".",","):Math.round(v).toLocaleString("pt-BR");
const CH=STORIES.filter(s=>s.tp==="c");
const pos=(s,v)=>Math.max(0,Math.min(100,(v-s.min)/(s.max-s.min)*100));
const err=s=>{const g=S.g[s.id];if(g==null)return null;const d=s.lt?(g>s.real?g-s.real:(s.lo!=null&&g<s.lo?s.lo-g:0)):Math.abs(g-s.real);return d/(s.max-s.min)};
const verdict=s=>{const g=S.g[s.id],e=err(s);if(s.lt?e===0:e<=.05)return"Na mosca.";if(g>s.real)return"Você chutou acima.";return"Você chutou abaixo."};

/* telas */
const SCR=[];
SCR.push({t:"cov",h:()=>`<div class="kk">Pense Mais Uma · adivinhe antes de ver</div>
 <h1>Imigrantes: tiram empregos ou <em>fazem o país crescer?</em></h1>
 <p class="p">Antes de cada número, você chuta. Depois vê o real e, quando houver, o chute médio dos brasileiros.</p>
 <div class="chips"><span>${CH.length} chutes</span><span>cerca de 10 minutos</span><span>sem nota</span></div>
 <p class="p m">Toque no lado direito da tela para avançar e no esquerdo para voltar. O número pequeno ao lado de um dado abre a fonte. Dados atualizados em novembro de 2026.</p>
 <button class="go" data-go="1">Começar</button>${S.i>1?`<button class="go ghost" data-go="${S.i}">Continuar de onde parei</button>`:""}<div class="tapn"></div>`});
STORIES.forEach((s,i)=>SCR.push({t:s.tp,s,h:()=>s.tp==="c"?chute(s):s.tp==="f"?fato(s):vozes(s)}));
SCR.push({t:"map",h:mapa,scroll:true});
SCR.push({t:"voto",h:voto,scroll:true});
SCR.push({t:"fim",h:fim,scroll:true});
const nav=(last)=>`<div class="tapn"><button class="pv" data-nav="-1">‹ voltar</button>${last?"":`<button class="nx" data-nav="1">toque para continuar ›</button>`}</div>`;

function chute(s){const g=S.g[s.id],done=g!=null,v=done?g:Math.round((s.min+(s.max-s.min)*.25)/s.step)*s.step;
 return `<div class="cw ${done?"rev":""}" id="cw-${s.id}"><div class="kk">Chute ${CH.indexOf(s)+1} de ${CH.length}</div><h2 class="q">${esc(s.q)}</h2>
 <div class="guess"><span id="gv-${s.id}">${fmt(v,s.step)}</span>${s.un?`<small>${esc(s.un)}</small>`:""}</div>
 <div class="trk"><div class="ln"></div>${s.lt?`<div class="band" style="left:0;width:${pos(s,s.real)}%"></div>`:""}
  <div class="mk you" id="mk-${s.id}" style="left:${pos(s,v)}%"><b>VOCÊ</b></div>
  ${s.avg!=null?`<div class="mk avg dn" style="left:${pos(s,s.avg)}%"><b>MÉDIA</b></div>`:""}
  <div class="mk real ${s.avg!=null?"":"dn"}" style="left:${pos(s,s.real)}%"><b>REAL</b></div>
  <input type="range" id="rg-${s.id}" min="${s.min}" max="${s.max}" step="${s.step}" value="${v}" aria-label="Seu chute: ${esc(s.q)}">
 </div>
 <div class="scale"><span>${fmt(s.min,s.step)}</span><span>${fmt(s.max,s.step)}${s.un?" "+esc(s.un):""}</span></div>
 <button class="lock" data-lock="${s.id}">Cravar meu chute</button>
 <div class="res" aria-live="polite"><div class="real"><small>REAL</small>${esc(s.realTxt)}${s.un&&!/mil|milh/.test(s.realTxt)?" "+esc(s.un):""}</div>
  ${done?`<div class="verd">${verdict(s)}</div>`:""}
  ${s.avg!=null?`<p class="p m">Chute médio: ${esc(s.avgTxt)} (${esc(s.avgNote)}).</p>`:""}
  <p class="p">${tx(s.depois)}</p>
  <div class="leg"><span style="--c:var(--ink)">Seu chute</span>${s.avg!=null?`<span style="--c:var(--vi)">Chute médio</span>`:""}<span style="--c:var(--or)">Real</span></div></div>
 </div>${nav()}`}
function fato(s){return `<div class="kk">${esc(s.k)}</div><div class="big">${esc(s.big)}</div><p class="q" style="font-size:22px">${tx(s.t)}</p><p class="p m">${tx(s.p)}</p>${nav()}`}
function vozes(s){const C=["var(--vi)","var(--or)","var(--ink)"];return `<div class="kk">${esc(s.k)}</div><h2 class="q">${esc(s.t)}</h2>
 ${s.itens.map((x,j)=>`<div class="voz" style="--c:${C[j%3]}"><h4>${esc(x[0])}</h4><p>${tx(x[1])}</p></div>`).join("")}<p class="nt">${esc(s.nota)}</p>${nav()}`}
function mapa(){const rows=CH.map(s=>({s,e:err(s)})),ok=rows.filter(r=>r.e!=null);
 const w=ok.slice().sort((a,b)=>b.e-a.e)[0];const over=ok.filter(r=>S.g[r.s.id]>r.s.real).length;
 return `<div class="kk">Fim dos chutes</div><h2 class="q">Seu mapa de impressões</h2>
 ${w?`<div class="worst">Onde você mais errou<b>${esc(w.s.cur)}</b>Você chutou ${fmt(S.g[w.s.id],w.s.step)}${w.s.un?" "+esc(w.s.un):""}; o real é ${esc(w.s.realTxt)}${w.s.un&&!/mil|milh/.test(w.s.realTxt)?" "+esc(w.s.un):""}.${over>ok.length/2?` Você exagerou em ${over} de ${ok.length} chutes. Não é só você: em cinco de seis países ricos pesquisados, as pessoas achavam que havia de duas a três vezes mais imigrantes do que havia. ${sup("ams_vox")}`:""}</div>`:`<p class="p m">Você pulou os chutes. Volte e arraste a bolinha para ver seu mapa.</p>`}
 ${rows.map(({s,e})=>{const g=S.g[s.id];return `<div class="row"><h5>${esc(s.cur)}<span>${g==null?"sem chute":`você ${fmt(g,s.step)} · real ${esc(s.realTxt)}`}</span></h5>
  <div class="mini">${s.lt?`<u style="left:0;width:${pos(s,s.real)}%"></u>`:`<i class="r" style="left:${pos(s,s.real)}%"></i>`}${g!=null?`<i class="y" style="left:${pos(s,g)}%"></i>`:""}</div></div>`}).join("")}
 <div class="leg"><span style="--c:var(--ink)">Seu chute</span><span style="--c:var(--or)">Real</span></div>${nav()}`}
function voto(){return `<div class="kk">E você?</div><h2 class="q">Se a política de imigração fosse sua, por onde começaria?</h2>
 <p class="p m">Não existe resposta certa e não vale nota. Escolha para ver o que dizem os dois lados.</p>
 ${VOTO.map((o,k)=>`<button class="vt ${S.vote===k?"on":""}" data-k="${k}" aria-pressed="${S.vote===k}"><b>${esc(o.t)}</b><small>${esc(o.s)}</small></button>`).join("")}
 <div id="vcd">${S.vote!=null?vcard(S.vote):""}</div>${nav()}`}
const vcard=v=>{const o=VOTO[v];return `<div class="cd"><i>A favor</i>${tx(o.pro)}<i class="c">Contra</i>${tx(o.con)}</div>`};
function fim(){return `<div class="kk">Antes de ir</div><h2 class="q">Quer se aprofundar?</h2>
 <section class="box"><p><b>A Estranha Morte da Europa</b>, de Douglas Murray (edição portuguesa): argumenta que a imigração em massa ameaça a identidade e a cultura europeias.</p>
 <p><b>Como Funciona Realmente a Migração</b>, de Hein de Haas (edição portuguesa): argumenta que muitos medos sobre imigração não batem com os dados.</p>
 <p><a href="https://www.youtube.com/results?search_query=imigra%C3%A7%C3%A3o+venezuelanos+Roraima+document%C3%A1rio" target="_blank" rel="noopener">Venezuelanos em Roraima (busca no YouTube)</a><br><a href="https://www.youtube.com/results?search_query=imigra%C3%A7%C3%A3o+empregos+sal%C3%A1rios+debate" target="_blank" rel="noopener">Imigração, empregos e salários: debates (busca no YouTube)</a></p></section>
 <section class="box" id="avaliar"><h3>Avalie o curso</h3><p>Que nota você dá?</p><div class="rate">${[1,2,3,4,5].map(x=>`<button data-n="${x}" class="${S.fb.nota===x?"on":""}" aria-label="Nota ${x}">${x}</button>`).join("")}</div>
 <p>O que você aprendeu que não sabia?</p><textarea id="apr" rows="2">${esc(S.fb.apr||"")}</textarea>
 <p>Sentiu que o curso favoreceu algum lado?</p><select id="lado"><option value="">Escolha</option>${["Não","Sim, a favor de mais imigração","Sim, a favor de menos imigração","Não sei"].map(o=>`<option ${S.fb.lado===o?"selected":""}>${o}</option>`).join("")}</select>
 <p>Comentário</p><textarea id="com" rows="2">${esc(S.fb.com||"")}</textarea>
 <p>Que tema você quer que vire curso?</p><textarea id="tema" rows="2">${esc(S.fb.tema||"")}</textarea>
 <button class="go" id="env">${S.fb.sent?"Avaliação enviada ✓":"Enviar avaliação"}</button></section>
 <section class="box"><h3>Fontes</h3><ol class="fontes">${ORD.map(k=>{const f=FONTES[k];return `<li>${esc(f.t)}${f.u?` · <a href="${f.u}" target="_blank" rel="noopener">abrir</a>`:""}</li>`}).join("")}</ol>
 <button class="go ghost" data-go="0">Voltar ao início</button></section>${nav(true)}`}

const app=document.getElementById("app");
function render(){const n=SCR.length;S.i=Math.max(0,Math.min(n-1,S.i));save();const sc=SCR[S.i];
 app.innerHTML=`<section class="scr cur ${sc.scroll?"scroll":""} ${sc.t==="cov"?"cov":""}" data-t="${sc.t}">${sc.h()}</section>`;
 document.getElementById("segs").innerHTML=SCR.slice(1).map((_,j)=>`<i class="${j<S.i?"on":""}"></i>`).join("");
 document.getElementById("lbl").textContent=S.i===0?"Pense Mais Uma":`${S.i} de ${n-1}`;
 wire()}
function go(d){const sc=SCR[S.i];if(d>0&&sc.t==="c"&&S.g[sc.s.id]==null){const b=app.querySelector(".lock");b&&b.focus();return}S.i+=d;render()}
function wire(){const sc=SCR[S.i];
 if(sc.t==="c"){const s=sc.s,rg=document.getElementById("rg-"+s.id);rg.oninput=()=>{const v=+rg.value;document.getElementById("gv-"+s.id).textContent=fmt(v,s.step);document.getElementById("mk-"+s.id).style.left=pos(s,v)+"%"}}
 app.querySelectorAll(".vt").forEach(b=>b.onclick=()=>{S.vote=+b.dataset.k;save();app.querySelectorAll(".vt").forEach(x=>{x.classList.toggle("on",x===b);x.setAttribute("aria-pressed",x===b)});document.getElementById("vcd").innerHTML=vcard(S.vote)});
 app.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{S.fb.nota=+b.dataset.n;save();app.querySelectorAll("[data-n]").forEach(x=>x.classList.toggle("on",x===b))});
 ["apr","com","tema"].forEach(k=>{const e=document.getElementById(k);if(e)e.oninput=()=>{S.fb[k]=e.value;save()}});
 const l=document.getElementById("lado");if(l)l.onchange=()=>{S.fb.lado=l.value;save()};
 const en=document.getElementById("env");if(en)en.onclick=()=>{S.fb.sent=true;try{const q=JSON.parse(localStorage.getItem("pmu-fila")||"[]");q.push({curso:"imigracao",quando:new Date().toISOString(),voto:S.vote,chutes:S.g,...S.fb});localStorage.setItem("pmu-fila",JSON.stringify(q))}catch(x){}save();en.textContent="Avaliação enviada ✓"}}
const pop=document.getElementById("fnpop");
document.addEventListener("click",e=>{const b=e.target.closest(".fn");
 if(b){e.preventDefault();e.stopPropagation();const f=FONTES[b.dataset.f];if(!f)return;document.getElementById("fnbody").innerHTML=`<b>Fonte ${N[b.dataset.f]}</b><br>${esc(f.t)}${f.u?`<br><a href="${f.u}" target="_blank" rel="noopener">Abrir a fonte ↗</a>`:""}`;pop.style.display="block";return}
 if(pop.style.display==="block"){if(e.target.closest("#fnpop .x")||!e.target.closest("#fnpop")){pop.style.display="none";e.stopPropagation();return}if(e.target.closest("#fnpop"))return}
 const lk=e.target.closest("[data-lock]");if(lk){const s=STORIES.find(x=>x.id===lk.dataset.lock);S.g[s.id]=+document.getElementById("rg-"+s.id).value;save();render();const cw=app.querySelector(".cw");if(cw){cw.classList.remove("rev");void cw.offsetWidth;requestAnimationFrame(()=>requestAnimationFrame(()=>cw.classList.add("rev")))}return}
 const gt=e.target.closest("[data-go]");if(gt){S.i=+gt.dataset.go;render();return}
 const nv=e.target.closest("[data-nav]");if(nv){go(+nv.dataset.nav);return}
 if(e.target.closest("button,a,input,textarea,select,label"))return;
 const sc=SCR[S.i];if(sc.scroll||sc.t==="cov")return;
 if(!e.target.closest("#stage"))return;
 const x=e.clientX/innerWidth;go(x<.3?-1:1)},true);
document.addEventListener("keydown",e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.key==="ArrowRight")go(1);if(e.key==="ArrowLeft")go(-1);if(e.key==="Escape")pop.style.display="none"});
const bar=document.getElementById("pmu-bar");if(bar){const fit=()=>{document.getElementById("stage").style.top=bar.offsetHeight+"px"};fit();addEventListener("resize",fit)}
render();
</script>
</body></html>
