const main = document.querySelector('#main');
const timeline = document.querySelector('#timeline');
const dialog = document.querySelector('#source');
const position = document.querySelector('#position');
const yearNav = document.querySelector('#years');
const feedback = {nota:'',aprendizado:'',imparcialidade:'',comentario:'',tema:''};
const openingCountries = ['mexico','chile','argentina','finlandia'];
const entry = new URLSearchParams(location.search).get('fase');
let phase = openingCountries.includes(entry) ? entry : 'cover';
let year = 0;
let part = 0;
let vote = null;
let activeCitation = null;
let saved = false;

const escapeHtml = value => String(value).replace(/[&<>"']/g, char =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[char]);
const button = (label, action, primary = false) =>
  `<button type="button" class="${primary ? 'primary' : 'ghost'}" data-go="${action}">${label}</button>`;
const ref = id => `<sup><button class="cite" type="button" data-source="${id}" aria-label="Abrir fonte ${id}">${id}</button></sup>`;
const claim = id => `<span data-claim="${id}">${escapeHtml(claims[id][0])}${claims[id][1].map(ref).join('')}</span>`;
const actions = (...buttons) => `<div class="actions">${buttons.join('')}</div>`;
function scene() {
  const key = phase === 'timeline' ? stops[year].year :
    ({debate:'future', sources:'books'}[phase] || phase);
  const [alt, data] = illustrations[key];
  return `<img class="phase-art" width="760" height="250" alt="Ilustração: ${escapeHtml(alt)}" src="data:image/webp;base64,${data}">`;
}
const heading = (context, title) => `<p class="context">${context}</p><h2 id="page-title" tabindex="-1">${title}</h2>${scene()}`;
const external = (url, label) => `<a href="${url}" target="_blank" rel="noopener noreferrer">${label}</a>`;

function start(index, focus = true) {
  year = index;
  part = 0;
  phase = 'timeline';
  render(focus);
}

function render(focus = true) {
  const stop = stops[year];
  timeline.value = year;
  timeline.setAttribute('aria-valuetext', stop.year + ' — ' + stop.title);
  [...yearNav.children].forEach((element, index) => {
    element.setAttribute('aria-current', String(phase === 'timeline' && year === index));
  });
  position.textContent = phase === 'timeline' ? stop.year + ' · ' + stop.subtitle : 'Arraste para explorar';
  document.querySelector('#route-label').textContent = (phase === 'cover' || openingCountries.includes(phase))
    ? 'Depois da abertura · Brasil' : 'Linha do tempo';
  let content;
  if (phase === 'cover') {
    content = `<span class="seal">Dados atualizados em novembro de 2026</span>
      <h1 id="page-title" tabindex="-1">Bolsa Família <em>Tira da pobreza ou acomoda?</em></h1>
      ${scene()}
      <p>O que muda na renda, na escola e no trabalho de quem recebe? A viagem começa no México, passa por Chile, Argentina e Finlândia e chega ao Brasil.</p>
      <p class="meta">Cerca de 15 minutos · 4 experiências internacionais e 8 paradas no Brasil · Cenas ilustradas com personagens fictícios</p>
      ${actions(button('Começar pelo México →','mexico',true))}`;
  } else if (openingCountries.includes(phase)) {
    const routes = openingCountries;
    const i = routes.indexOf(phase);
    const [place, question, rule, result] = intro[i];
    content = heading(place, question) + `<p>${claim(rule)}</p>
      <details class="research"><summary>${['O que mudou na escola?','As famílias conseguiram mais trabalho?','O que mudou no emprego com carteira?','O que a pesquisa encontrou sobre emprego?'][i]}</summary><p>${claim(result)}</p></details>` +
      actions(button(['← Capa','← México','← Chile','← Argentina'][i], routes[i-1] ?? 'cover'),
        button(['Seguir para o Chile →','Seguir para a Argentina →','Seguir para a Finlândia →','Brasil, 2003 →'][i], routes[i+1] ?? 'start', true));
  } else if (phase === 'timeline') {
    const advance = year === stops.length - 1 ? button('E você? →','future',true) : button(stops[year+1].year + ' →','next',true);
    const studyTitles = ['O que os estudos dizem','Outra medida','Como ler em conjunto'];
    content = part === 0
      ? heading(stop.year + ' · ' + stop.subtitle, stop.title) +
        `<p>${claim(stop.rule)}</p><div class="scope"><strong>Famílias e repasses</strong><span>${claim(stop.stats)}</span></div>` +
        actions(button('Ver a evidência →','next-part',true), year ? button('← ' + stops[year-1].year,'previous') : button('← Finlândia','finlandia'))
      : heading(stop.year + ' · ' + stop.subtitle, studyTitles[part-1]) +
        `<div class="study"><p>${claim(stop.studies[part-1])}</p></div>` +
        actions(button('← Voltar','previous-part'), part < stop.studies.length ? button('Continuar →','next-part',true) : advance);
  } else if (phase === 'future') {
    content = heading('A próxima parada', 'E você?') +
      '<p>Que mudança você colocaria na sua linha do tempo?</p>' +
      paths.map(([title], index) => `<button class="choice" type="button" data-vote="${index}" aria-pressed="${vote === index}">${title} →</button>`).join('') +
      actions(button('Quer se aprofundar?','books'),button('Avaliar o curso','form'));
  } else if (phase === 'debate') {
    const [title, forId, againstId] = paths[vote];
    content = heading('A sua linha do tempo', title) +
      `<div class="sides"><section><h3>A favor</h3><p>${claim(forId)}</p></section><section><h3>Contra</h3><p>${claim(againstId)}</p></section></div>` +
      actions(button('Outra escolha','future'), button('Continuar →','books',true));
  } else if (phase === 'books') {
    content = heading('Depois da linha do tempo','Quer se aprofundar?') +
      `<div class="study"><strong>Resultados e defesa do programa</strong><p>${claim(books[0])}</p></div>
       <div class="study"><strong>Leitura crítica (à forma da proteção social)</strong><p>${claim(books[1])}</p></div>
       <div class="actions">${external(youtube[0], 'Buscar Ipea no YouTube ↗')} ${external(youtube[1], 'Buscar auditorias no YouTube ↗')}</div>` +
      actions(button('Avaliar →','form',true),button('Fontes','sources'));
  } else if (phase === 'form') {
    content = formContent();
  } else {
    const offset = part * 4;
    content = heading('Referências · ' + (part+1) + ' de ' + Math.ceil(sources.length/4),'Fontes') +
      `<ol start="${offset+1}">${sources.slice(offset,offset+4).map(([name,,url]) => `<li>${external(url,escapeHtml(name))}</li>`).join('')}</ol>` +
      actions(part ? button('← Anteriores','previous-part') : button('← Leituras','books'),
        offset+4 < sources.length ? button('Mais fontes →','next-part',true) : button('Voltar à capa','cover'));
  }
  main.innerHTML = `<article class="page ${phase} ${phase === 'timeline' && part > 0 ? 'detail' : ''}" aria-labelledby="page-title">${content}</article>`;
  main.scrollTop = 0;
  if (focus) main.querySelector('#page-title').focus({preventScroll:true});
}

function formContent() {
  if (saved) return heading('Depois da linha do tempo','Avaliação salva') +
    '<p role="status">A avaliação ficou salva neste navegador.</p>' + actions(button('Consultar as fontes →','sources',true));
  const textField = (name, label, multiline = false) =>
    `<label class="field">${label}${multiline
      ? `<textarea rows="1" maxlength="2000" name="${name}">${escapeHtml(feedback[name])}</textarea>`
      : `<input type="text" maxlength="300" name="${name}" value="${escapeHtml(feedback[name])}">`}</label>`;
  const options = ['Não','Sim, a favor do programa','Sim, contra o programa','Não sei'];
  const first = `<fieldset><legend>Nota de 1 a 5</legend><div class="rating">${[1,2,3,4,5].map(n =>
    `<label><input type="radio" name="nota" value="${n}" required ${feedback.nota === String(n) ? 'checked' : ''}>${n}</label>`).join('')}</div></fieldset>
    ${textField('aprendizado','O que você aprendeu que não sabia?',true)}
    <label class="field">Sentiu que o curso favoreceu algum lado?<select name="imparcialidade" required><option value="">Escolha uma resposta</option>
    ${options.map(value => `<option ${feedback.imparcialidade === value ? 'selected' : ''}>${value}</option>`).join('')}</select></label>`;
  const second = `${textField('comentario','Comentário',true)}${textField('tema','Que tema você quer que vire curso?')}
    <p class="meta">A avaliação é salva somente neste navegador.</p>`;
  return heading('Depois da linha do tempo · ' + (part+1) + ' de 2','Avaliação do curso') +
    `<form id="feedback">${part === 0 ? first : second}
    <div class="actions">${part === 0 ? button('Fontes','sources') : button('← Voltar','previous-part')}
    <button class="primary" type="submit">${part === 0 ? 'Continuar →' : 'Enviar avaliação'}</button></div>
    <p class="status" id="save-status" role="status"></p></form>`;
}

yearNav.innerHTML = stops.map((stop, index) =>
  `<button class="year" type="button" data-year="${index}">${stop.year}</button>`).join('');
document.querySelector('#ticks').innerHTML = '<i></i>'.repeat(stops.length);
yearNav.addEventListener('click', event => {
  const target = event.target.closest('[data-year]');
  if (target) start(Number(target.dataset.year));
});
timeline.addEventListener('input', () => start(Number(timeline.value), false));
timeline.addEventListener('click', () => {
  if (phase !== 'timeline') start(Number(timeline.value), false);
});
document.querySelector('#home').addEventListener('click', () => navigate('cover'));
document.querySelector('#future').addEventListener('click', () => navigate('future'));

function navigate(action) {
  switch (action) {
    case 'start': start(0); return;
    case 'next': start(year+1); return;
    case 'previous': start(year-1); return;
    case 'next-part': part++; break;
    case 'previous-part': part--; break;
    default: phase = action; part = 0;
  }
  render();
}

main.addEventListener('click', event => {
  const element = event.target.closest('button');
  if (!element) return;
  if (element.dataset.source) {
    const [name, note, url] = sources[Number(element.dataset.source)-1];
    document.querySelector('#source-title').textContent = name;
    document.querySelector('#source-note').textContent = note;
    document.querySelector('#source-link').href = url;
    activeCitation = element;
    dialog.showModal();
  } else if (element.dataset.vote !== undefined) {
    vote = Number(element.dataset.vote);
    navigate('debate');
  } else if (element.dataset.go) {
    navigate(element.dataset.go);
  }
});
document.querySelector('#close-source').addEventListener('click', () => dialog.close());
dialog.addEventListener('click', event => {
  if (event.target === dialog) {
    const bounds = dialog.getBoundingClientRect();
    if (event.clientX < bounds.left || event.clientX > bounds.right ||
        event.clientY < bounds.top || event.clientY > bounds.bottom) dialog.close();
  }
});
dialog.addEventListener('close', () => activeCitation?.focus());
main.addEventListener('input', event => {
  if (event.target.name in feedback) feedback[event.target.name] = event.target.value;
});
main.addEventListener('submit', event => {
  if (event.target.id !== 'feedback') return;
  event.preventDefault();
  for (const [key, value] of new FormData(event.target)) feedback[key] = value;
  if (part === 0) {
    navigate('next-part');
    return;
  }
  try {
    const queue = JSON.parse(localStorage.getItem('pmu-fila') ?? '[]');
    if (!Array.isArray(queue)) throw new TypeError('Fila inválida');
    queue.push({
      curso:'bolsa-familia', quando:new Date().toISOString(),
      voto:vote === null ? null : paths[vote][0], ...feedback, nota:Number(feedback.nota)
    });
    localStorage.setItem('pmu-fila', JSON.stringify(queue));
    saved = true;
    render();
  } catch {
    document.querySelector('#save-status').textContent = 'A avaliação não pôde ser salva neste navegador. As respostas continuam no formulário.';
  }
});
render(false);
</script>
</body>
</html>
