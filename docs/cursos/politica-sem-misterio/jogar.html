<script>
/* =========================================================
   CONTEÚDO DO CURSO
   ========================================================= */
const MODULES = [
{
  id:'mapa', emoji:'🧭', title:'O mapa da política', sub:'De onde vêm esquerda e direita', badge:'🧭 Navegador',
  cards:[
    {t:'Tudo começou com cadeiras', h:`<p>Em 1789, na Revolução Francesa, os deputados discutiam quanto poder o rei deveria ter.</p>
      <p>Quem queria <b>manter</b> o poder do rei sentava à <b>direita</b> do presidente da Assembleia. Quem queria <b>mudanças</b> sentava à <b>esquerda</b>.</p>
      <p>O lugar virou apelido, e o apelido virou a forma como o mundo inteiro fala de política.</p>
      <div class="tip"><b>💡 Guarde isso</b>Na origem, "direita" significava preservar a ordem existente e "esquerda" significava transformá-la.</div>
      <p class="fl">Fontes: <button type="button" class="fn" data-f="history" aria-label="Ver fonte: History.com">🔎 History.com</button></p>`},
    {t:'A ideia por trás dos lados', h:`<p>O filósofo italiano Norberto Bobbio resumiu a diferença assim:</p>
      <ul><li>A <b>esquerda</b> se incomoda mais com a <b>desigualdade</b> e aceita mais ação do governo para reduzi-la.</li>
      <li>A <b>direita</b> tende a ver parte da desigualdade como natural, ou como o preço da liberdade, e desconfia de um governo que interfere demais.</li></ul>
      <div class="warn">É uma simplificação útil para começar, não uma regra absoluta.</div>
      <p class="fl">Fontes: <button type="button" class="fn" data-f="bobbio" aria-label="Ver fonte: Bobbio">🔎 Bobbio</button></p>`},
    {t:'Por que uma linha só não basta', h:`<p>Pense em duas pessoas:</p>
      <ul><li><b>Ana</b> quer impostos baixos e livre mercado, mas acha que adultos devem poder fazer o que quiserem da própria vida.</li>
      <li><b>Bruno</b> quer o Estado forte na economia e também quer o governo defendendo costumes tradicionais.</li></ul>
      <p>Onde você colocaria cada um numa linha que vai da esquerda à direita? Fica difícil.</p>
      <p>Por isso muitos estudiosos usam <b>dois eixos</b>.</p>
      <p class="fl">Fontes: <button type="button" class="fn" data-f="heywood" aria-label="Ver fonte: Heywood">🔎 Heywood</button></p>`},
    {t:'Os dois eixos', h:`<p><b>↔ Eixo econômico:</b> quanto o Estado deve mexer na economia. De um lado fica "mais Estado" (mais à esquerda), do outro "mais mercado" (mais à direita).</p>
      <p><b>↕ Eixo das liberdades:</b> quanto o governo deve controlar a vida das pessoas. Em cima fica "mais ordem e autoridade", embaixo "mais liberdade individual".</p>
      <p>👇 Toque em cada quadrante:</p>{{COMPASS}}
      <p class="fl">Fontes: <button type="button" class="fn" data-f="heywood" aria-label="Ver fonte: Heywood">🔎 Heywood</button></p>`},
    {t:'Mini-dicionário', h:`<ul>
      <li><b>Estado:</b> o conjunto de governo, leis, órgãos públicos e serviços. É diferente de "governo", que é quem está no comando agora.</li>
      <li><b>Mercado:</b> pessoas e empresas comprando, vendendo e competindo livremente.</li>
      <li><b>Privatizar:</b> vender uma empresa pública para donos privados. <b>Estatizar</b> é o contrário.</li>
      <li><b>Progressista:</b> quem quer mudar costumes e instituições para ampliar direitos.</li>
      <li><b>Conservador:</b> quem quer preservar costumes e instituições tradicionais.</li></ul>
      <p class="fl">Fontes: <button type="button" class="fn" data-f="heywood" aria-label="Ver fonte: Heywood">🔎 Heywood</button></p>`}
  ],
  quiz:[
    {q:'De onde vêm os termos "esquerda" e "direita"?', o:['Da posição dos deputados na Assembleia durante a Revolução Francesa','Dos partidos do Parlamento inglês no século XVII','Da Revolução Russa de 1917, entre bolcheviques e mencheviques','Da Guerra Fria, entre EUA e União Soviética'], a:0, e:'Foi em 1789, na França. A Revolução Russa e a Guerra Fria vieram muito depois e só herdaram os termos.'},
    {q:'Para Norberto Bobbio, o que mais diferencia a esquerda da direita?', o:['A atitude diante da desigualdade','A posição sobre religião','O tamanho do Estado em qualquer situação','A defesa ou não da democracia'], a:0, e:'Existem democratas e autoritários dos dois lados. O critério de Bobbio é o peso dado à igualdade.'},
    {q:'Ana quer impostos baixos, livre mercado e liberdade total para adultos decidirem a própria vida. Em qual quadrante ela fica?', o:['Mercado + liberdade','Mercado + ordem','Estado forte + liberdade','Bem no centro'], a:0, e:'Ela fica à direita na economia e embaixo, no lado da liberdade, nos costumes. É o perfil libertário.'},
    {q:'Qual destas propostas é do eixo das LIBERDADES, e não do econômico?', o:['O Estado deve proibir certos livros e filmes','O Estado deve ser dono da Petrobras','Os impostos sobre grandes empresas devem subir','O governo deve controlar o preço da gasolina'], a:0, e:'Censura é sobre liberdade individual. As outras três tratam de dinheiro e propriedade.'}
  ],
  flash:{title:'Que eixo é esse?', ch:['💰 Econômico','🗽 Liberdades'], items:[

  ]}
},
{
  id:'eco', emoji:'💰', title:'Economia de bolso', sub:'Inflação, juros, impostos e dívida', badge:'💰 Economista de Bolso',
  cards:[
    {t:'Por que falar de economia?', h:`<p>Boa parte das brigas políticas é sobre dinheiro: quem paga imposto, quanto o governo gasta e quem recebe ajuda.</p>
      <p>Com <b>4 conceitos</b> (inflação, juros, impostos e dívida) você entende a maior parte dessas discussões. As próximas fases vão usar muito essas ideias.</p>
      <p class="fl">Fontes: <button type="button" class="fn" data-f="heywood" aria-label="Ver fonte: Heywood">🔎 Heywood</button></p>`},
    {t:'Inflação', h:`<p>É quando os preços sobem <b>no geral</b> e o mesmo dinheiro compra menos coisas.</p>
      <p>No Brasil, a medida oficial é o <b>IPCA</b>, calculado pelo IBGE.</p>
      <p>Existe uma <b>meta</b>: desde 2025 ela é de <b>3% ao ano</b>, com tolerância de 1,5 ponto para cima ou para baixo, ou seja, entre 1,5% e 4,5%.</p>
      <div class="tip"><b>💡 Por que importa</b>A inflação pesa mais para quem é pobre, porque quem tem pouco dinheiro não consegue se proteger aplicando no banco.</div>
      <p class="fl">Fontes: <button type="button" class="fn" data-f="meta" aria-label="Ver fonte: CNN Brasil">🔎 CNN Brasil</button></p>`},
    {t:'Juros e Selic', h:`<p>A <b>Selic</b> é a taxa básica de juros do país. Quem decide é o <b>Copom</b>, do Banco Central, a cada cerca de 45 dias.</p>
      <ul><li><b>Juros altos:</b> o crédito fica caro, as pessoas compram menos e a inflação cai. Mas a economia esfria e a dívida do governo fica mais cara.</li>
      <li><b>Juros baixos:</b> o efeito contrário.</li></ul>
      <p>Em novembro de 2026, a Selic estava em <b>13,75% ao ano</b>, segundo o Copom. <button type="button" class="fn" data-f="copom" aria-label="Ver fonte: Copom, 4/nov/2026">🔎 Copom, 4/nov/2026</button> Antes, ficou em 15% de junho de 2025 a março de 2026.</p>
      <div class="warn">Desde 2021 o Banco Central tem autonomia: o presidente da República não pode demitir o presidente do BC quando quiser.</div>
      <p class="fl">Fontes: <button type="button" class="fn" data-f="copom" aria-label="Ver fonte: Copom, 4/nov/2026">🔎 Copom, 4/nov/2026</button> <button type="button" class="fn" data-f="selic15" aria-label="Ver fonte: Exame">🔎 Exame</button></p>`},
    {t:'Impostos', h:`<p>Existem dois grandes tipos:</p>
      <ul><li><b>Sobre a renda</b>, como o Imposto de Renda: quem ganha mais paga uma porcentagem maior.</li>
      <li><b>Sobre o consumo</b>, embutidos no preço do arroz, da luz e do celular: todo mundo paga a mesma porcentagem.</li></ul>
      <p>No Brasil, os impostos sobre consumo pesam muito. Como quem é pobre gasta quase tudo o que ganha, proporcionalmente paga mais. Economistas chamam isso de sistema <b>regressivo</b>.</p>
      <p>Mudanças recentes: desde janeiro de 2026, quem ganha até R$ 5 mil por mês não paga Imposto de Renda. Além disso, uma reforma está trocando vários impostos sobre consumo por um modelo mais simples, em transição até 2033.</p>
      <p class="fl">Fontes: <button type="button" class="fn" data-f="lei15270" aria-label="Ver fonte: Lei 15.270/2025">🔎 Lei 15.270/2025</button></p>`},
    {t:'Gasto público e dívida', h:`<p>Quando o governo gasta mais do que arrecada, ele tem <b>déficit</b> e precisa pegar dinheiro emprestado. A soma dessas dívidas é a <b>dívida pública</b>.</p>
      <div class="side"><b>⬅️ Visão mais à esquerda</b>Gasto público em saúde, educação e obras gera emprego e protege os pobres. Em crises, o governo deve gastar mais para reanimar a economia, ideia associada ao economista John Maynard Keynes.</div>
      <div class="side2"><b>➡️ Visão mais à direita</b>Gastar demais gera dívida, juros altos e inflação, e no fim quem paga a conta são os mais pobres. O governo deve gastar só o que arrecada, ideia associada a Milton Friedman e Friedrich Hayek.</div>
      <p>Muitos governos e economistas ficam no meio: aceita gasto público, mas com limite. No Brasil, esse limite apareceu no <b>teto de gastos</b> (2016) e no <b>arcabouço fiscal</b> (2023).</p>
      <p class="fl">Fontes: <button type="button" class="fn" data-f="fiscal" aria-label="Ver fonte: EC 95 e LC 200">🔎 EC 95 e LC 200</button></p>`}
  ],
  quiz:[
    {q:'O que é inflação?', o:['Aumento geral dos preços, que faz o dinheiro comprar menos','Aumento forte do preço de um único produto, como a gasolina','Aumento dos salários acima dos preços','Aumento da taxa de juros'], a:0, e:'Um produto subir sozinho não é inflação. Inflação é a média de muitos preços subindo.'},
    {q:'Se o Banco Central sobe a Selic, o que tende a acontecer?', o:['O crédito encarece e a inflação tende a cair','Os preços sobem mais rápido','A dívida do governo fica mais barata','O desemprego cai imediatamente'], a:0, e:'Juros altos seguram o consumo e a inflação, mas encarecem a dívida pública e esfriam a economia.'},
    {q:'Por que se diz que o sistema de impostos brasileiro é "regressivo"?', o:['Porque os impostos sobre consumo pesam proporcionalmente mais para quem ganha menos','Porque os ricos pagam uma porcentagem maior da renda','Porque a carga de impostos está diminuindo','Porque o Imposto de Renda é o principal imposto do país'], a:0, e:'Quem é pobre gasta quase tudo em consumo e, por isso, paga uma fatia maior da renda em impostos embutidos nos preços.'},
    {q:'Qual é a meta de inflação do Brasil desde 2025?', o:['3% ao ano, com tolerância de 1,5 ponto','4,5% ao ano, sem tolerância','6% ao ano','Igual à taxa Selic'], a:0, e:'A inflação pode ficar entre 1,5% e 4,5% sem que a meta seja considerada descumprida.'}
  ],
  flash:{title:'Quem decide?', ch:['🏦 Banco Central','🏛️ Congresso','📊 IBGE'], items:[
    {t:'A taxa Selic', a:0, e:'É decidida pelo Copom, do Banco Central.'},
    {t:'Criar ou aumentar impostos', a:1, e:'Impostos precisam de lei, e quem faz leis é o Congresso.'},
    {t:'Calcular a inflação oficial (IPCA)', a:2, e:'O IBGE mede os preços todo mês.'},
    {t:'Aprovar o Orçamento do governo', a:1, e:'O governo propõe, mas quem aprova é o Congresso.'},
    {t:'Medir a taxa de desemprego', a:2, e:'O IBGE mede pela pesquisa PNAD.'},
    {t:'Emitir o dinheiro (o real)', a:0, e:'O Banco Central emite a moeda, e a Casa da Moeda a fabrica.'}
  ]}
},
{
  id:'liberal', emoji:'📜', title:'Liberalismo e libertarianismo', sub:'Liberdade individual e mercado', badge:'📜 Leitor de Locke',
  cards:[
    {t:'O liberalismo clássico', h:`<p>Nasceu entre os séculos XVII e XVIII com pensadores como <b>John Locke</b> e <b>Adam Smith</b>.</p>
      <p>A ideia central é que cada pessoa tem direitos que nenhum governo pode tirar: <b>vida, liberdade e propriedade</b>.</p>
      <ul><li>O governo deve ser limitado por leis e nem o rei fica acima delas.</li><li>As trocas livres no mercado geram riqueza.</li></ul>
      <div class="tip"><b>💡 Curiosidade</b>Na época, isso era revolucionário: era o que a "esquerda" da Revolução Francesa defendia contra o rei.</div>
      <p class="fl">Fontes: <button type="button" class="fn" data-f="locke" aria-label="Ver fonte: Locke e Smith">🔎 Locke e Smith</button></p>`},
    {t:'⚠️ Pegadinha do nome', h:`<p>"Liberal" significa coisas diferentes dependendo do país:</p>
      <ul><li><b>No Brasil e na Europa:</b> geralmente é quem defende livre mercado e Estado menor, o que fica mais à direita na economia.</li>
      <li><b>Nos EUA:</b> "liberal" é quem é <b>progressista</b>, de centro-esquerda.</li></ul>
      <p>Por isso, quando você ler uma notícia americana, "liberal" quase sempre quer dizer o oposto do que se entende aqui.</p>
      <p class="fl">Fontes: <button type="button" class="fn" data-f="heywood" aria-label="Ver fonte: Heywood">🔎 Heywood</button></p>`},
    {t:'As variações', h:`<ul>
      <li><b>Liberalismo social:</b> aceita o mercado, mas quer que o Estado garanta educação, saúde e oportunidades para todos competirem em pé de igualdade.</li>
      <li><b>"Neoliberalismo":</b> rótulo usado principalmente por críticos para as políticas dos anos 80 e 90, como privatizações, abertura comercial e controle de gastos. Margaret Thatcher e Ronald Reagan são os exemplos mais citados. Quase ninguém se apresenta como neoliberal.</li>
      <li><b>Libertarianismo:</b> Estado mínimo na economia <b>e</b> nos costumes. Os mais radicais, os <b>anarcocapitalistas</b>, querem nenhum Estado.</li></ul>
      <p class="fl">Fontes: <button type="button" class="fn" data-f="boas" aria-label="Ver fonte: Boas e Gans-Morse">🔎 Boas e Gans-Morse</button></p>`},
    {t:'O debate', h:`<div class="pro"><b>👍 Quem defende diz</b>O mercado livre gera mais riqueza e inovação do que qualquer planejamento do governo. Governos concentram poder e erram, e a liberdade individual é o valor mais importante.</div>
      <div class="con"><b>👎 Quem critica diz</b>O mercado sozinho gera desigualdade e não cuida de quem fica para trás. Ele também cria monopólios e crises financeiras, como a de 2008, que exigiram socorro do Estado.</div>
      <p class="fl">Fontes: <button type="button" class="fn" data-f="hayek" aria-label="Ver fonte: Hayek e Losurdo">🔎 Hayek e Losurdo</button></p>`}
  ],
  quiz:[
    {q:'Nos EUA, um "liberal" geralmente é...', o:['Progressista, de centro-esquerda','Defensor do livre mercado, como no Brasil','Libertário, contra quase todo imposto','Conservador moderado'], a:0, e:'Lá a palavra ganhou outro sentido. No Brasil ela costuma indicar quem defende o livre mercado.'},
    {q:'Qual ideia NÃO faz parte do liberalismo clássico?', o:['O Estado deve planejar o que as fábricas produzem','Ninguém, nem o governante, está acima da lei','Todos têm direito à vida, à liberdade e à propriedade','O comércio livre gera riqueza'], a:0, e:'Planejamento estatal da produção é o oposto da ideia liberal de mercado livre.'},
    {q:'O termo "neoliberalismo" é...', o:['Usado mais por críticos para políticas de privatização e corte de gastos dos anos 80 e 90','Um conceito criado por Adam Smith no século XVIII','O nome oficial do programa de um partido brasileiro','Sinônimo de liberalismo social'], a:0, e:'Quase ninguém se apresenta como neoliberal. É mais um rótulo de quem critica essas políticas.'},
    {q:'O que diferencia um libertário de um liberal-conservador?', o:['O libertário também quer o Estado fora dos costumes; o liberal-conservador quer preservar valores tradicionais','O libertário defende Estado forte na economia','O liberal-conservador é contra o livre mercado','Nada: são sinônimos'], a:0, e:'Os dois defendem o mercado. A diferença está no eixo das liberdades.'}
  ]
},
{
  id:'conserv', emoji:'🏛️', title:'Conservadorismo e as direitas', sub:'Tradição, ordem, nação', badge:'🏛️ Guardião de Burke',
  cards:[
    {t:'O pai do conservadorismo', h:`<p>Em 1790, o irlandês <b>Edmund Burke</b> escreveu criticando a Revolução Francesa.</p>
      <p>A tese dele: instituições e tradições que duraram gerações guardam uma sabedoria acumulada. Destruir tudo de uma vez, em nome de uma teoria, costuma terminar mal. A Revolução desembocou no período chamado "Terror" (1793–94).</p>
      <div class="tip"><b>💡 Importante</b>O conservador não é contra toda mudança. Ele é contra mudanças <b>bruscas</b> e prefere reformas graduais e prudentes.</div>
      <p class="fl">Fontes: <button type="button" class="fn" data-f="burke" aria-label="Ver fonte: Burke, 1790">🔎 Burke, 1790</button></p>`},
    {t:'Valores típicos', h:`<ul><li>Família como base da sociedade</li><li>Papel da religião e da moral tradicional</li><li>Ordem, segurança e respeito à autoridade</li><li>Desconfiança de grandes projetos de "engenharia social"</li></ul>
      <p><b>Liberal-conservador:</b> é uma combinação muito comum no Brasil, com economia de mercado (lado liberal) e costumes tradicionais (lado conservador).</p>
      <p class="fl">Fontes: <button type="button" class="fn" data-f="scruton" aria-label="Ver fonte: Scruton">🔎 Scruton</button></p>`},
    {t:'Nacionalismo e populismo', h:`<p><b>Nacionalismo:</b> coloca a nação em primeiro lugar, com soberania, fronteiras e identidade nacional. Existe nacionalismo de direita e também de esquerda.</p>
      <p><b>Populismo:</b> para alguns estudiosos, é um <b>estilo</b>; para outros, como o cientista político Cas Mudde, é uma "ideologia fina", que se apoia em outras ideologias. <button type="button" class="fn" data-f="mudde" aria-label="Ver fonte: Mudde, 2017">🔎 Mudde, 2017</button> O líder diz falar pelo "povo puro" contra uma "elite corrupta" e desconfia de instituições intermediárias, como imprensa, tribunais e partidos. Pode aparecer na direita e na esquerda.</p>
      <p class="fl">Fontes: <button type="button" class="fn" data-f="mudde" aria-label="Ver fonte: Mudde, 2017">🔎 Mudde, 2017</button></p>`},
    {t:'E a "extrema-direita"?', h:`<p>O termo costuma ser usado para grupos que vão além do conservadorismo democrático, por exemplo:</p>
      <ul><li>rejeitando regras da democracia</li><li>tratando minorias ou imigrantes como ameaça</li><li>aceitando ou incentivando violência política</li></ul>
      <div class="warn">⚠️ É um rótulo disputado: muitas vezes é usado como acusação contra qualquer conservador. O mesmo acontece com "extrema-esquerda". Na última fase você aprende a separar descrição de xingamento.</div>
      <p class="fl">Fontes: <button type="button" class="fn" data-f="muddefar" aria-label="Ver fonte: Mudde, 2019">🔎 Mudde, 2019</button></p>`},
    {t:'O debate', h:`<div class="pro"><b>👍 Quem defende diz</b>A tradição é sabedoria testada pelo tempo. Família e comunidade dão coesão social, e ordem e segurança são condições para existir liberdade.</div>
      <div class="con"><b>👎 Quem critica diz</b>"Sempre foi assim" já foi usado para manter injustiças, como a resistência ao voto feminino e aos direitos civis. A tradição também pode servir para excluir grupos.</div>
      <p class="fl">Fontes: <button type="button" class="fn" data-f="scruton" aria-label="Ver fonte: Scruton">🔎 Scruton</button> <button type="button" class="fn" data-f="robin" aria-label="Ver fonte: Robin">🔎 Robin</button></p>`}
  ],
  quiz:[
    {q:'Burke criticava a Revolução Francesa principalmente porque...', o:['Ela destruía de uma vez instituições construídas por gerações','Ela defendia o livre mercado','Ela queria fortalecer o rei','Ela era religiosa demais'], a:0, e:'Para Burke, a sabedoria acumulada nas instituições não deveria ser jogada fora em nome de uma teoria.'},
    {q:'Qual frase um conservador no estilo de Burke mais provavelmente diria?', o:['"Reforme o que não funciona, mas com cuidado e aos poucos"','"Nada deve mudar, nunca"','"Vamos refazer a sociedade do zero, com base na razão"','"O mercado resolve tudo, inclusive os costumes"'], a:0, e:'O conservador aceita mudança, desde que seja gradual e prudente.'},
    {q:'Um político diz: "Eu sou a voz do povo contra as elites corruptas da imprensa e dos tribunais". Isso é um sinal típico de...', o:['Populismo, que pode ser de direita ou de esquerda','Conservadorismo clássico','Liberalismo','Social-democracia'], a:0, e:'"Povo puro contra elite corrupta" é a marca do estilo populista, em qualquer lado.'},
    {q:'O nacionalismo é exclusivo da direita?', o:['Não: existem nacionalismos de esquerda, como muitos movimentos anticoloniais','Sim, sempre foi','Sim, desde a Revolução Francesa','Só no Brasil é'], a:0, e:'Movimentos de independência e o nacionalismo econômico de alguns governos de esquerda são exemplos.'}
  ]
},
{
  id:'social', emoji:'⚙️', title:'Socialismo, comunismo e cia.', sub:'E por que não são a mesma coisa', badge:'⚙️ Leitor de Marx',
  cards:[
    {t:'O contexto: século XIX', h:`<p>Revolução Industrial: fábricas com jornadas de 14 a 16 horas, trabalho infantil e nenhum direito trabalhista.</p>
      <p>Muitos pensadores começaram a perguntar: <b>se o trabalhador produz a riqueza, por que ele fica com tão pouco dela?</b></p>
      <p class="fl">Fontes: <button type="button" class="fn" data-f="hobsbawm" aria-label="Ver fonte: Hobsbawm">🔎 Hobsbawm</button></p>`},
    {t:'Karl Marx em 1 minuto', h:`<p>Em 1848, <b>Karl Marx</b> e <b>Friedrich Engels</b> publicaram o <i>Manifesto Comunista</i>.</p>
      <ul><li>A história seria uma <b>luta de classes</b>.</li>
      <li>A <b>burguesia</b> é dona dos <b>meios de produção</b>: fábricas, terras e máquinas.</li>
      <li>O <b>proletariado</b> só tem o próprio trabalho para vender.</li>
      <li>A proposta era tornar os meios de produção <b>coletivos</b>.</li></ul>
      <p class="fl">Fontes: <button type="button" class="fn" data-f="manifesto" aria-label="Ver fonte: Manifesto, 1848">🔎 Manifesto, 1848</button></p>`},
    {t:'Socialismo × comunismo', h:`<p><b>Socialismo:</b> os meios de produção passam a ser controlados coletivamente, pelo Estado ou por cooperativas, para reduzir a desigualdade. Na teoria marxista, seria uma fase de transição.</p>
      <p><b>Comunismo:</b> na teoria, a etapa final, com uma sociedade sem classes, sem dinheiro e até sem Estado.</p>
      <div class="tip"><b>💡 Na prática</b>Nenhum país chegou a esse "comunismo final". Os países chamados de comunistas, como a URSS, a China e Cuba, foram governados por um <b>partido comunista único</b>, com Estado muito forte e economia planejada pelo governo.</div>
      <p class="fl">Fontes: <button type="button" class="fn" data-f="manifesto" aria-label="Ver fonte: Manifesto, 1848">🔎 Manifesto, 1848</button> <button type="button" class="fn" data-f="heywood" aria-label="Ver fonte: Heywood">🔎 Heywood</button></p>`},
    {t:'O balanço histórico', h:`<p>Entre os fatos documentados estão partido único, repressão e fomes com milhões de mortos. O debate é sobre como pesar esses fatos e os avanços sociais que os defensores apontam. <button type="button" class="fn" data-f="fomes" aria-label="Ver fonte: Conquest e Dikötter">🔎 Conquest e Dikötter</button></p>
      <div class="pro"><b>👍 Quem defende lembra</b>Industrialização rápida, alfabetização em massa e saúde pública ampla, como em Cuba. Lembra também que muitos direitos trabalhistas surgiram da pressão de movimentos socialistas.</div>
      <div class="con"><b>👎 Quem critica lembra</b>Partido único, repressão, censura e prisões políticas. Fomes enormes, como na Ucrânia soviética e na China do "Grande Salto Adiante", e economias planejadas que ficaram ineficientes.</div>
      <p class="fl">Fontes: <button type="button" class="fn" data-f="fomes" aria-label="Ver fonte: Conquest e Dikötter">🔎 Conquest e Dikötter</button></p>`},
    {t:'Social-democracia', h:`<p>Aceita o <b>capitalismo e a democracia</b>, mas com um <b>Estado de bem-estar forte</b>:</p>
      <ul><li>saúde e educação públicas</li><li>previdência e seguro-desemprego robustos</li><li>sindicatos fortes e impostos altos</li></ul>
      <div class="tip"><b>⚠️ Pegadinha</b>Suécia e Dinamarca <b>não</b> são socialistas. São economias de mercado com um grande Estado de bem-estar, ou seja, social-democracias.</div>
      <p class="fl">Fontes: <button type="button" class="fn" data-f="esping" aria-label="Ver fonte: Esping-Andersen">🔎 Esping-Andersen</button></p>`},
    {t:'Anarquismo', h:`<p>Quer o fim do Estado e de hierarquias impostas.</p>
      <ul><li><b>Anarquismo de esquerda</b> (Proudhon, Bakunin): fim do Estado <b>e</b> da propriedade privada dos meios de produção, com a sociedade organizada em cooperativas e comunidades.</li>
      <li><b>Anarcocapitalismo:</b> fim do Estado, com tudo resolvido pelo mercado.</li></ul>
      <p>Os dois querem acabar com o Estado, mas por motivos opostos.</p>
      <p class="fl">Fontes: <button type="button" class="fn" data-f="proudhon" aria-label="Ver fonte: Proudhon">🔎 Proudhon</button></p>`}
  ],
  quiz:[
    {q:'Para Marx, o que define a classe social de alguém?', o:['Ser ou não dono dos meios de produção','Quanto dinheiro a pessoa tem no banco','O nível de escolaridade','A religião da família'], a:0, e:'Um gerente bem pago ainda vende o próprio trabalho; o dono da fábrica, não.'},
    {q:'URSS, China e Cuba chegaram ao "comunismo" descrito por Marx?', o:['Não: tiveram partido único e Estado fortíssimo, o oposto de uma sociedade sem Estado','Sim, todas chegaram','Só a URSS chegou','Sim, mas só por alguns anos'], a:0, e:'Na teoria, o comunismo final seria sem classes e sem Estado. Isso nunca existiu na prática.'},
    {q:'A Suécia é...', o:['Uma social-democracia: economia de mercado com Estado de bem-estar forte','Um país socialista, com estatais na maioria dos setores','Um país comunista moderado','Um exemplo de Estado mínimo'], a:0, e:'Tem grandes empresas privadas, como IKEA e Spotify, e impostos altos que financiam serviços públicos.'},
    {q:'O que um socialista e um social-democrata têm em comum?', o:['Querem reduzir a desigualdade','Querem acabar com as eleições','Querem estatizar todas as empresas','Querem o fim do Estado'], a:0, e:'A diferença está no caminho: o socialista quer substituir o capitalismo, o social-democrata quer regulá-lo.'}

{
  id:'autor', emoji:'🛡️', title:'Fascismo e autoritarismo', sub:'O eixo que mais importa', badge:'🛡️ Detector de Autoritarismo',
  cards:[
    {t:'Fascismo e nazismo', h:`<p><b>Fascismo:</b> Itália, Benito Mussolini, no poder a partir de 1922.<br><b>Nazismo:</b> Alemanha, Adolf Hitler, no poder a partir de 1933.</p>
      <ul><li>Nacionalismo extremo e culto ao líder</li><li>Partido único e eliminação da oposição</li><li>Violência como ferramenta política</li><li>O Estado e a nação acima do indivíduo</li><li>Um "inimigo" a combater. No nazismo, isso levou ao Holocausto.</li></ul>
      <p class="fl">Fontes: <button type="button" class="fn" data-f="paxton" aria-label="Ver fonte: Paxton">🔎 Paxton</button></p>`},
    {t:'"Mas o nazismo tinha socialista no nome!"', h:`<p>É uma discussão frequente. O nome do partido era "Nacional-Socialista".</p>
      <p>A <b>grande maioria dos historiadores</b> classifica o nazismo na <b>extrema-direita</b> porque ele:</p>
      <ul><li>perseguiu e prendeu comunistas, socialistas e sindicalistas</li><li>manteve a propriedade privada e se aliou a grandes industriais</li><li>era ultranacionalista e racista</li></ul>
      <p>Quem discorda aponta o forte controle estatal da economia. Para a maioria dos historiadores, esse controle existiu, mas a serviço da guerra e da nação, e não para socializar a propriedade.</p>
      <p class="fl">Fontes: <button type="button" class="fn" data-f="evans" aria-label="Ver fonte: Evans">🔎 Evans</button></p>`},
    {t:'Autoritário × totalitário', h:`<p><b>Autoritarismo:</b> o poder é concentrado e a oposição, limitada, mas algumas áreas da vida ficam livres.</p>
      <p><b>Totalitarismo:</b> o Estado tenta controlar <b>tudo</b>, de pensamento e arte a religião e família. Exemplos: Alemanha nazista, URSS de Stálin, Coreia do Norte.</p>
      <div class="tip"><b>💡 Ditaduras dos dois lados</b>Direita: Chile de Pinochet e Brasil de 1964 a 1985, ambos anticomunistas. Esquerda: URSS, Cuba e Coreia do Norte.</div>
      <p class="fl">Fontes: <button type="button" class="fn" data-f="arendt" aria-label="Ver fonte: Arendt e Linz">🔎 Arendt e Linz</button></p>`},
    {t:'A lição mais importante', h:`<p>Um democrata de esquerda e um democrata de direita têm mais em comum entre si do que cada um tem com os autoritários do próprio lado: os dois aceitam eleições, imprensa livre e alternância de poder.</p>
      <p>Os cientistas políticos Steven Levitsky e Daniel Ziblatt (<i>Como as democracias morrem</i>) listam <b>4 sinais de alerta</b> num político:</p>
      <ol><li>Rejeita ou desrespeita as regras do jogo democrático</li><li>Nega a legitimidade dos adversários</li><li>Tolera ou incentiva violência</li><li>Quer restringir liberdades de opositores e da imprensa</li></ol>
      <p>Esses sinais valem para <b>qualquer</b> lado.</p>
      <p class="fl">Fontes: <button type="button" class="fn" data-f="levitsky" aria-label="Ver fonte: Levitsky e Ziblatt">🔎 Levitsky e Ziblatt</button></p>`}
  ],
  quiz:[
    {q:'Qual característica é central no fascismo?', o:['Nacionalismo extremo, partido único e culto ao líder','Defesa do Estado mínimo e das liberdades individuais','Propriedade coletiva das fábricas pelos trabalhadores','Fim do Estado e de todas as hierarquias'], a:0, e:'O fascismo concentrava todo o poder no Estado e no líder.'},
    {q:'Por que a maioria dos historiadores classifica o nazismo na extrema-direita, apesar do nome?', o:['Perseguiu a esquerda e os sindicatos, manteve a propriedade privada e era ultranacionalista','Porque defendia o livre mercado sem nenhuma intervenção','Porque chegou ao poder por eleições','Porque foi aliado da União Soviética durante toda a guerra'], a:0, e:'Houve um pacto com a URSS em 1939, mas a Alemanha invadiu a URSS em 1941.'},
    {q:'A Coreia do Norte é um exemplo de...', o:['Totalitarismo: o Estado tenta controlar até o pensamento','Autoritarismo leve, com imprensa parcialmente livre','Democracia com um partido dominante','Anarquismo'], a:0, e:'Lá o Estado controla imprensa, religião, arte e até o que as pessoas podem dizer em casa.'},
    {q:'Qual destes NÃO é um sinal de alerta de autoritarismo, segundo Levitsky e Ziblatt?', o:['Defender uma reforma econômica radical','Dizer que só aceita o resultado da eleição se vencer','Chamar adversários de traidores da pátria','Elogiar atos de violência de apoiadores'], a:0, e:'Propostas radicais, de qualquer lado, fazem parte da democracia. Os sinais tratam de como o político lida com as regras e com os adversários.'}
  ]
},
{
  id:'debates', emoji:'🧩', title:'Os novos debates', sub:'Clima, religião e identidade', badge:'🧩 Mediador de Debates',
  cards:[
    {t:'Política não é só economia', h:`<p>A partir dos anos 1960 e 70, novos temas entraram com força na política: <b>meio ambiente</b>, o <b>papel da religião</b> e os <b>direitos de grupos</b>.</p>
      <p>Esses temas nem sempre seguem a linha esquerda/direita da economia. Há evangélicos que apoiam programas sociais e empresários ambientalistas, por exemplo.</p>
      <p class="fl">Fontes: <button type="button" class="fn" data-f="inglehart" aria-label="Ver fonte: Inglehart">🔎 Inglehart</button></p>`},
    {t:'Ecologia política', h:`<p>O Brasil tem a maior parte da Amazônia e é um dos maiores produtores de alimentos do mundo. Por isso o tema pesa muito aqui.</p>
      <div class="side"><b>🌱 Ambientalistas dizem</b>Proteger a floresta e o clima é urgente. O desmatamento ameaça até o agronegócio, que depende das chuvas que a floresta ajuda a produzir.</div>
      <div class="side2"><b>🚜 Críticos das regras ambientais dizem</b>Regras rígidas travam o agro, que sustenta empregos e exportações. Dizem também que o Brasil já preserva mais vegetação nativa do que muitos países ricos.</div>
      <div class="tip"><b>💡 Nem tudo é óbvio</b>Existe ambientalismo conservador, que vê a natureza como herança a preservar. E governos de esquerda também fizeram grandes obras com impacto ambiental, como a usina de Belo Monte.</div>
      <p class="fl">Fontes: <button type="button" class="fn" data-f="mapbiomas" aria-label="Ver fonte: MapBiomas">🔎 MapBiomas</button></p>`},
    {t:'Religião e política', h:`<p>Censo 2022 (IBGE): <b>56,7%</b> dos brasileiros são católicos, <b>26,9%</b> evangélicos e <b>9,3%</b> sem religião. Em 2010, os evangélicos eram 21,6%.</p>
      <p>A <b>Frente Parlamentar Evangélica</b>, conhecida como bancada evangélica, atua forte em temas como aborto, drogas e família.</p>
      <p>O Brasil é um <b>Estado laico</b>: não tem religião oficial e garante a liberdade de todas as crenças.</p>
      <div class="side"><b>⛪ Quem defende mais presença religiosa diz</b>A fé orienta os valores de milhões de pessoas, e é legítimo que eleitores religiosos tenham representantes.</div>
      <div class="side2"><b>⚖️ Quem defende separação mais rígida diz</b>As leis valem para todos, inclusive para quem não tem a mesma fé, e o Estado não deve impor a moral de uma religião.</div>
      <p class="fl">Fontes: <button type="button" class="fn" data-f="censo" aria-label="Ver fonte: Censo 2022">🔎 Censo 2022</button></p>`},
    {t:'Pautas identitárias', h:`<p>São as lutas por direitos de grupos específicos, como negros, mulheres, pessoas LGBT+ e indígenas.</p>
      <p>Exemplos no Brasil: a <b>Lei de Cotas</b> nas universidades federais (2012) e a decisão do STF que equiparou a homofobia ao crime de racismo (2019).</p>
      <div class="side"><b>✊ Defensores dizem</b>Desigualdades históricas, como a escravidão, exigem políticas específicas. Igualdade só no papel não basta.</div>
      <div class="side2"><b>🤔 Críticos dizem</b>São críticos na direita e também em parte da esquerda. Para eles, dividir a sociedade em grupos gera ressentimento, e as políticas deveriam focar em renda ou mérito. Muitos também criticam a "cultura do cancelamento".</div>
      <p class="fl">Fontes: <button type="button" class="fn" data-f="stfhomo" aria-label="Ver fonte: STF, 2019">🔎 STF, 2019</button></p>`},
    {t:'Por que esses temas esquentam tanto?', h:`<p>Porque mexem com <b>identidade e valores</b>, e não só com números. Dá para negociar um meio-termo no valor de um imposto; é bem mais difícil fazer isso quando o assunto é fé ou o que cada um considera justo.</p>
      <div class="tip"><b>💡 Dica</b>São justamente esses temas em que o desafio do "homem de aço" (Fase 12) e o jogo Advogado do outro lado mais fazem diferença.</div>
      <p class="fl">Fontes: <button type="button" class="fn" data-f="haidt" aria-label="Ver fonte: Haidt">🔎 Haidt</button></p>`}
  ],
  quiz:[
    {q:'Segundo o Censo 2022, qual grupo religioso mais cresceu no Brasil desde 2010?', o:['Evangélicos','Católicos','Sem religião','Espíritas'], a:0, e:'Os evangélicos foram de 21,6% para 26,9%. Os sem religião também cresceram, mas menos: de 7,9% para 9,3%.'},
    {q:'O que significa o Brasil ser um "Estado laico"?', o:['O Estado não tem religião oficial e garante a liberdade de todas as crenças','A religião é proibida em espaços públicos','O Estado favorece as religiões cristãs','Políticos não podem declarar sua religião'], a:0, e:'Laico não é antirreligioso: o Estado apenas não adota nem impõe uma fé.'},
    {q:'Defender a preservação ambiental é exclusividade da esquerda?', o:['Não: há conservacionistas de direita, e governos de esquerda também fizeram obras de grande impacto ambiental','Sim, sempre foi','Sim, pelo menos no Brasil','Não, é exclusividade da direita'], a:0, e:'O tema cruza a linha esquerda/direita mais do que parece.'},
    {q:'Qual destes é um argumento de quem CRITICA as políticas identitárias?', o:['Dividir a sociedade em grupos gera ressentimento; seria melhor focar em renda ou mérito','A escravidão deixou desigualdades que exigem políticas específicas','Igualdade só no papel não basta','As cotas aumentaram a diversidade nas universidades'], a:0, e:'As outras três alternativas são argumentos de quem defende essas políticas.'}
  ]
},
{
  id:'poder', emoji:'⚖️', title:'Como o poder funciona no Brasil', sub:'Três poderes e o caminho de uma lei', badge:'⚖️ Conhecedor dos Poderes',
  cards:[
    {t:'Os três poderes', h:`<ul><li><b>Executivo:</b> governa e executa as leis. São o presidente, os governadores e os prefeitos.</li>
      <li><b>Legislativo:</b> faz as leis e fiscaliza o governo. São os deputados, senadores e vereadores.</li>
      <li><b>Judiciário:</b> julga e garante que as leis e a Constituição sejam cumpridas.</li></ul>
      <p>A ideia vem do pensador francês Montesquieu: dividir o poder para que um controle o outro. São os chamados <b>freios e contrapesos</b>.</p>
      <p class="fl">Fontes: <button type="button" class="fn" data-f="cf" aria-label="Ver fonte: Constituição">🔎 Constituição</button></p>`},
    {t:'Quem é quem', h:`<p><b>🇧🇷 Nacional:</b> presidente e Congresso Nacional. O Congresso tem a Câmara, com 513 deputados eleitos para 4 anos (o número por estado segue a população, com mínimo de 8 e máximo de 70), e o Senado, com 81 senadores (3 por estado, eleitos para 8 anos).</p>
      <p><b>🗺️ Estadual:</b> governador e Assembleia Legislativa, onde ficam os deputados estaduais.</p>
      <p><b>🏙️ Municipal:</b> prefeito e Câmara Municipal, onde ficam os vereadores.</p>
      <div class="warn">Não existe "deputado municipal" nem "senador estadual".</div>
      <p class="fl">Fontes: <button type="button" class="fn" data-f="cf" aria-label="Ver fonte: Constituição">🔎 Constituição</button> <button type="button" class="fn" data-f="deputados" aria-label="Ver fonte: STF, 2025">🔎 STF, 2025</button></p>`},
    {t:'Como nasce uma lei', h:`<ol><li>Alguém apresenta um projeto: um parlamentar, o presidente ou até os cidadãos, com um abaixo-assinado (a chamada iniciativa popular).</li>
      <li>As comissões analisam.</li><li>Uma das Casas vota (em geral, a Câmara).</li><li>A outra revisa e vota.</li>
      <li>O presidente <b>sanciona</b> ou <b>veta</b>.</li><li>Se houver veto, o Congresso pode <b>derrubá-lo</b>.</li></ol>
      <p><b>Medida provisória:</b> o presidente edita e ela vale na hora, mas o Congresso tem até 120 dias para aprovar. Se não aprovar, ela perde a validade.</p>
      <div class="tip"><b>🔎 Caso real</b>Em 2025, o Congresso aprovou aumentar a Câmara de 513 para 531 deputados. O presidente vetou, e uma decisão do ministro Luiz Fux, do STF, manteve 513 deputados para a eleição de 2026, e o plenário do STF confirmou por unanimidade em 1º de outubro de 2025. <button type="button" class="fn" data-f="deputados" aria-label="Ver fonte: STF, 2025">🔎 STF, 2025</button> <button type="button" class="fn" data-f="stf531" aria-label="Ver fonte: STF, out/2025">🔎 STF, out/2025</button> Qualquer mudança só pode valer a partir de 2030.</div>
      <p class="fl">Fontes: <button type="button" class="fn" data-f="cf" aria-label="Ver fonte: Constituição">🔎 Constituição</button></p>`},
    {t:'O STF', h:`<p>O Supremo Tribunal Federal tem <b>11 ministros</b>. Eles são indicados pelo presidente, aprovados pelo Senado e podem ficar no cargo até os 75 anos.</p>
      <p>A principal função é ser o guardião da Constituição: ele pode anular leis e atos que a contrariem.</p>
      <div class="side"><b>🛡️ Quem defende um STF atuante diz</b>Ele protege direitos e a Constituição quando os outros poderes erram ou se omitem.</div>
      <div class="side2"><b>⚠️ Quem critica diz</b>Há "ativismo judicial": ministros que não foram eleitos decidindo temas que deveriam ser do Congresso.</div>
      <p>Curiosidade: as críticas vêm da esquerda ou da direita dependendo de qual decisão está em jogo.</p>
      <p class="fl">Fontes: <button type="button" class="fn" data-f="cf" aria-label="Ver fonte: Constituição">🔎 Constituição</button></p>`},
    {t:'De quem é a culpa? (federalismo)', h:`<ul><li><b>🏙️ Prefeitura:</b> buracos na rua, coleta de lixo, postos de saúde, creches e boa parte do ensino fundamental</li>
      <li><b>🗺️ Estado:</b> Polícia Militar e Polícia Civil, ensino médio, presídios e hospitais regionais</li>
      <li><b>🇧🇷 União:</b> moeda, Forças Armadas, relações com outros países, aposentadorias do INSS e universidades federais</li></ul>
      <div class="tip"><b>💡 Na prática</b>Antes de cobrar o presidente pelo buraco da sua rua, lembre que isso é com a prefeitura. A saúde (SUS) é dividida entre os três níveis.</div>
      <p class="fl">Fontes: <button type="button" class="fn" data-f="cf" aria-label="Ver fonte: Constituição">🔎 Constituição</button></p>`}
  ],
  quiz:[
    {q:'Quantos senadores cada estado elege?', o:['3, independentemente da população','Um número proporcional à população, como os deputados','1 por estado','8 por estado'], a:0, e:'Por isso São Paulo e Roraima têm o mesmo número de senadores.'},
    {q:'O presidente vetou um projeto aprovado pelo Congresso. O que pode acontecer?', o:['O Congresso pode derrubar o veto, e o projeto vira lei mesmo assim','O projeto é arquivado para sempre','O STF decide sozinho se o projeto vira lei','O presidente precisa convocar um plebiscito'], a:0, e:'O veto não é a palavra final: é um dos freios e contrapesos.'},
    {q:'Quem escolhe os ministros do STF?', o:['O presidente indica e o Senado aprova','Os próprios ministros escolhem os colegas','O povo elege','A Câmara dos Deputados elege'], a:0, e:'É um exemplo de dois poderes participando de uma decisão.'},
    {q:'De quem é a responsabilidade principal pela Polícia Militar?', o:['Do governo estadual','Da prefeitura','Do governo federal','Do Ministério Público'], a:0, e:'A segurança pública fica principalmente com os estados.'}
  ],
  flash:{title:'De quem é a responsabilidade?', ch:['🏙️ Prefeitura','🗺️ Estado','🇧🇷 União'], items:[
    {t:'Tapar buraco na rua', a:0, e:'As ruas da cidade são da prefeitura.'},
    {t:'Coleta de lixo', a:0, e:'É um serviço municipal.'},
    {t:'Polícia Militar', a:1, e:'É comandada pelo governador.'},
    {t:'Escolas de ensino médio públicas', a:1, e:'Ficam principalmente com os estados.'},
    {t:'Emissão da moeda (o real)', a:2, e:'É competência da União, pelo Banco Central.'},
    {t:'Aposentadorias do INSS', a:2, e:'O INSS é federal.'}
  ]}
},
{
  id:'centro', emoji:'🤝', title:'Centro e Centrão', sub:'Parecem iguais, mas não são', badge:'🤝 Decifrador do Centrão',
  cards:[
    {t:'O centro ideológico', h:`<p>É quem mistura ideias dos dois lados e prefere <b>mudanças graduais</b> e negociação.</p>
      <p>Exemplo famoso: a <b>"Terceira Via"</b> dos anos 90, de Tony Blair no Reino Unido, que tentava combinar mercado eficiente com políticas sociais.</p>
      <p class="fl">Fontes: <button type="button" class="fn" data-f="giddens" aria-label="Ver fonte: Giddens">🔎 Giddens</button></p>`},
    {t:'O Centrão brasileiro', h:`<p>⚠️ O Centrão <b>não é</b> o centro ideológico.</p>
      <p>É um bloco de partidos no Congresso, com origem na Constituinte de 1987–88, conhecido pelo <b>pragmatismo</b>: segundo analistas e críticos, costuma apoiar governos de lados diferentes em troca de cargos, emendas e verbas.</p>
      <p>Por que ele existe? Por causa do <b>presidencialismo de coalizão</b>, expressão do cientista político Sérgio Abranches. Como há muitos partidos, nenhum presidente tem maioria sozinho e precisa negociar.</p>
      <p class="fl">Fontes: <button type="button" class="fn" data-f="abranches" aria-label="Ver fonte: Abranches, 1988">🔎 Abranches, 1988</button></p>`},
    {t:'O debate', h:`<div class="pro"><b>👍 Quem defende diz</b>Garante governabilidade, modera os extremos e leva demandas de cidades do interior que os grandes partidos ignoram.</div>
      <div class="con"><b>👎 Quem critica diz</b>É "fisiologismo", ou seja, apoio trocado por vantagens. Tem pouca coerência de ideias e dificulta saber quem é responsável pelo quê.</div>
      <p class="fl">Fontes: <button type="button" class="fn" data-f="carazza" aria-label="Ver fonte: Carazza">🔎 Carazza</button></p>`},
    {t:'O centro está sumindo?', h:`<p>Um estudo publicado em 2025 com cientistas políticos (Bolognesi, Ribeiro, Codato e Silva) pediu que posicionassem cada partido de 0 (extrema-esquerda) a 10 (extrema-direita).</p>
      <p>O principal achado foi o <b>desaparecimento do centro ideológico</b>: partidos migrando para os polos.</p>
      <p>Exemplo, comparando 2018 e 2022: o Cidadania foi de 4,9 para 6,2, saindo do centro para a centro-direita. <button type="button" class="fn" data-f="codato" aria-label="Ver fonte: Codato, 2025">🔎 Codato, 2025</button></p>
      <p class="fl">Fontes: <button type="button" class="fn" data-f="codato" aria-label="Ver fonte: Codato, 2025">🔎 Codato, 2025</button></p>`}
  ],
  quiz:[
    {q:'Qual a diferença entre "centro" e "Centrão"?', o:['O centro é uma posição de ideias; o Centrão é um bloco pragmático que negocia apoio','São a mesma coisa com nomes diferentes','O Centrão é a ala moderada do PT','O centro só existe na Europa'], a:0, e:'O Centrão se define pelo comportamento no Congresso, não pelas ideias.'},
    {q:'Por que se diz que o Brasil tem "presidencialismo de coalizão"?', o:['Com muitos partidos, o presidente precisa de alianças para ter maioria no Congresso','Porque o presidente e o vice são de partidos diferentes','Porque o presidente é escolhido pelo Congresso','Porque a lei obriga todos os partidos a governar juntos'], a:0, e:'Nenhum partido sozinho tem maioria, então é preciso negociar.'},
    {q:'Qual é a crítica mais comum ao Centrão?', o:['Fisiologismo: trocar apoio por cargos e verbas','Ser radical demais','Nunca apoiar nenhum governo','Defender o fim do Congresso'], a:0, e:'Quem o defende, por outro lado, diz que ele garante a governabilidade.'},
    {q:'No estudo publicado em 2025 com especialistas, o que aconteceu com o Cidadania entre 2018 e 2022?', o:['Saiu do centro para a centro-direita','Foi para a esquerda','Ficou exatamente no centro','Deixou de existir'], a:0, e:'Foi de 4,9 para 6,2 numa escala de 0 (extrema-esquerda) a 10 (extrema-direita).'}
  ]
},
{
  id:'mundo', emoji:'🌎', title:'A política pelo mundo', sub:'EUA, Europa e América Latina', badge:'🌎 Cidadão do Mundo',
  cards:[
    {t:'Dois jeitos de governar', h:`<p><b>Presidencialismo</b> (Brasil, EUA): o povo elege o presidente, que governa por um mandato fixo.</p>
      <p><b>Parlamentarismo</b> (Reino Unido, Alemanha, Espanha): o povo elege o parlamento, e a maioria do parlamento escolhe o <b>primeiro-ministro</b>. Se ele perde o apoio, pode cair sem precisar de impeachment.</p>
      <div class="tip"><b>💡 Por que isso importa</b>Com muitos partidos e parlamentarismo, quase ninguém tem maioria sozinho. Por isso boa parte da Europa vive de <b>governos de coalizão</b>.</div>
      <p class="fl">Fontes: <button type="button" class="fn" data-f="lijphart" aria-label="Ver fonte: Lijphart">🔎 Lijphart</button></p>`},
    {t:'Estados Unidos', h:`<p>Na prática são <b>dois partidos</b>:</p>
      <ul><li><b>Democratas:</b> centro-esquerda nos padrões americanos, os "liberals" de lá.</li>
      <li><b>Republicanos:</b> direita, que reúne conservadores e defensores do livre mercado.</li></ul>
      <p>Muitos analistas observam que o centro americano fica mais à direita que o europeu. Saúde pública universal, por exemplo, é consenso em boa parte da Europa e polêmica nos EUA.</p>
      <p>Hoje o presidente é Donald Trump, republicano. Nas eleições de meio de mandato de 3 de novembro de 2026, a contagem da agência AP de 20/11 mostrava, na Câmara, 257 cadeiras ganhas pelos democratas e 172 pelos republicanos; outras 6 ainda não constavam como ganhas por nenhum partido. No Senado, contando os mandatos que continuam, eram 56 democratas (incluindo 2 que votam com eles) e 44 republicanos. Esses números podem mudar. <button type="button" class="fn" data-f="ap" aria-label="Ver fonte: AP, 20/nov/2026">🔎 AP, 20/nov/2026</button></p>
      <p class="fl">Fontes: <button type="button" class="fn" data-f="ap" aria-label="Ver fonte: AP, 20/nov/2026">🔎 AP, 20/nov/2026</button></p>`},
    {t:'Europa', h:`<p>As grandes "famílias" de partidos:</p>
      <ul><li><b>Social-democratas:</b> centro-esquerda</li><li><b>Democratas-cristãos:</b> centro-direita, como a CDU alemã</li><li><b>Liberais</b> e <b>Verdes</b></li>
      <li><b>Direita nacionalista/populista</b>, que vem crescendo, como o Reagrupamento Nacional (França), a AfD (Alemanha) e o Chega (Portugal)</li></ul>
      <p>Exemplo de 2026: em Portugal, o socialista António José Seguro venceu a eleição presidencial contra André Ventura, do Chega, com 66,8% dos votos.</p>
      <p class="fl">Fontes: <button type="button" class="fn" data-f="portugal" aria-label="Ver fonte: Executive Digest">🔎 Executive Digest</button></p>`},
    {t:'América Latina: o pêndulo', h:`<p>Nos anos 2000 veio a <b>"onda rosa"</b>, uma série de governos de esquerda: Lula, Chávez, os Kirchner, Evo Morales, Bachelet. Eram esquerdas bem diferentes entre si, das democráticas e moderadas, como no Chile e no Uruguai, até a da Venezuela, hoje classificada como autoritária por índices internacionais de democracia. <button type="button" class="fn" data-f="vdem" aria-label="Ver fonte: V-Dem e Freedom House">🔎 V-Dem e Freedom House</button></p>
      <p>Nos anos 2020 houve uma <b>guinada à direita</b> em vários países:</p>
      <ul><li><b>Argentina:</b> Javier Milei, que se define libertário e anarcocapitalista</li>
      <li><b>Chile:</b> José Antonio Kast assumiu em março de 2026 após vencer a candidata comunista Jeannette Jara com 58% dos votos</li>
      <li><b>Colômbia:</b> Abelardo de la Espriella (direita) venceu Iván Cepeda (esquerda) em junho de 2026 por cerca de 1 ponto; o resultado foi confirmado pela autoridade eleitoral (CNE) <button type="button" class="fn" data-f="colcne" aria-label="Ver fonte: Blu Radio, jun/2026">🔎 Blu Radio, jun/2026</button></li></ul>
      <p>O Brasil foi na direção oposta, com Lula reeleito.</p>
      <p class="fl">Fontes: <button type="button" class="fn" data-f="chile" aria-label="Ver fonte: DF (Chile)">🔎 DF (Chile)</button></p>`},
    {t:'A lição do mundo', h:`<p><b>1. Os rótulos mudam de país para país.</b> "Liberal" nos EUA é uma coisa e no Brasil é outra. "Socialista" em Portugal é um partido de centro-esquerda democrático, e não alguém que quer estatizar tudo.</p>
      <p><b>2. O eleitor balança.</b> Nas democracias, governos de esquerda e de direita costumam se alternar no poder, como mostram os exemplos da América Latina nesta fase. <button type="button" class="fn" data-f="chile" aria-label="Ver fonte: DF (Chile)">🔎 DF (Chile)</button> <button type="button" class="fn" data-f="colcne" aria-label="Ver fonte: Blu Radio, jun/2026">🔎 Blu Radio, jun/2026</button></p>
      <p><b>3. A régua é sempre relativa.</b> Antes de chamar alguém de "extremista", pergunte: extremo em relação a quê, e em qual país?</p>
      <p class="fl">Fontes: <button type="button" class="fn" data-f="lijphart" aria-label="Ver fonte: Lijphart">🔎 Lijphart</button></p>`}
  ],

    {t:'Rótulo virou xingamento', h:`<p>"Comunista!", "Fascista!": no dia a dia, esses termos muitas vezes servem para <b>desqualificar</b> alguém, e não para <b>descrever</b> o que a pessoa pensa.</p>

let AC=null;
const SEQ={ok:[[660,.07],[880,.11]],bad:[[196,.12],[147,.2]],combo:[[523,.06],[659,.06],[784,.06],[1047,.15]],win:[[523,.1],[659,.1],[784,.1],[1047,.1],[1319,.32]]};
function snd(t){
  if(S.mute) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    let at=AC.currentTime+.01;
    SEQ[t].forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.setValueAtTime(f,at);g.gain.setValueAtTime(.05,at);g.gain.exponentialRampToValueAtTime(.0008,at+d);o.connect(g);g.connect(AC.destination);o.start(at);o.stop(at+d+.02);at+=d;});
  }catch(e){}
}

function mkFlashQ(m,it){return {key:it.t,tag:'⚡ Rodada relâmpago · '+m.flash.title,q:it.t,o:m.flash.ch,a:it.a,e:it.e,shuffle:false,grid:true,from:m.emoji+' '+m.flash.title};}

const ALLQ={};
MODULES.forEach(m=>{ m.quiz.forEach(q=>ALLQ[q.q]=mkModuleQ(m,q)); if(m.flash) m.flash.items.forEach(it=>ALLQ[it.t]=mkFlashQ(m,it)); });
STEEL.forEach(r=>ALLQ[r.arg]=mkSteelQ(r));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function inst(base,tag){const q=Object.assign({},base); if(tag) q.tag=tag; if(base.shuffle){const idx=shuffle(base.o.map((_,k)=>k)); q.o=idx.map(k=>base.o[k]); q.a=idx.indexOf(base.a);} return q;}

function confetti(){const cols=['#3EF2FF','#FF4FD8','#FFE45E','#5CFF9D','#8E7BFF'];for(let i=0;i<70;i++){const c=document.createElement('i');c.className='cf';c.style.left=Math.random()*100+'vw';c.style.background=cols[i%cols.length];c.style.animationDuration=(1.6+Math.random()*1.6)+'s';c.style.animationDelay=(Math.random()*.4)+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),3800)}}

function compassSVG(point){
  const lab = (x,y,t,anchor)=>`<text x="${x}" y="${y}" font-size="11" fill="#A39DCF" text-anchor="${anchor||'middle'}">${t}</text>`;
  const box=(k,x,y,l1,l2)=>`<g class="qbox" data-q="${k}"><rect x="${x}" y="${y}" width="140" height="140" fill="${QUAD[k].c}" rx="12"/><text x="${x+70}" y="${y+66}" font-size="12" text-anchor="middle" fill="#FFFFFF">${l1}</text><text x="${x+70}" y="${y+82}" font-size="12" text-anchor="middle" fill="#FFFFFF">${l2}</text></g>`;
  let s=`<svg class="compass" viewBox="0 0 320 345" role="img" aria-label="Mapa político de dois eixos">
    ${box('tl',20,20,'Estado forte','+ ordem')}${box('tr',160,20,'Mercado','+ ordem')}${box('bl',20,160,'Estado forte','+ liberdade')}${box('br',160,160,'Mercado','+ liberdade')}
    <line x1="20" y1="160" x2="300" y2="160" stroke="#3EF2FF" stroke-width="2"/><line x1="160" y1="20" x2="160" y2="300" stroke="#3EF2FF" stroke-width="2"/>
    ${lab(160,13,'▲ mais ordem / autoridade')}${lab(160,316,'▼ mais liberdade individual')}
    ${lab(22,340,'◀ mais Estado','start')}${lab(298,340,'mais mercado ▶','end')}`;
  if(point){const cx=160+point.x*130, cy=160-point.y*130;
    s+=`<circle cx="${cx}" cy="${cy}" r="13" fill="#FF4FD8" opacity=".35"><animate attributeName="r" values="11;18;11" dur="1.6s" repeatCount="indefinite"/></circle><circle cx="${cx}" cy="${cy}" r="8" fill="#FF4FD8" stroke="#fff" stroke-width="3"/>`;}
  return s+'</svg>';
}
function bindCompass(){
  document.querySelectorAll('.qbox').forEach(g=>g.addEventListener('click',()=>{
    const q=QUAD[g.dataset.q]; const box=document.getElementById('qinfo'); if(box) box.innerHTML='<b>'+q.n+'</b><br>'+q.d;
  }));
}
function fontesHTML(id){
  const m=MODULES.find(x=>x.id===id); if(!m) return '';
  const ks=[...new Set([...m.cards.map(c=>c.h).join('').matchAll(/data-f="(\w+)"/g)].map(x=>x[1]))];
  if(!ks.length) return '';
  return `<div class="fonteslist"><div class="qtag">🔎 Fontes desta fase</div><ol>`+ks.map(k=>{const f=FONTES[k];return `<li>${esc(f.t)}${f.u?` · <a href="${f.u}" target="_blank" rel="noopener">abrir ↗</a>`:''}</li>`}).join('')+`</ol></div>`;
}
function showFonte(k){const f=FONTES[k]; if(!f) return; let p=document.getElementById('fnpop'); if(!p){p=document.createElement('div');p.id='fnpop';p.setAttribute('role','dialog');document.body.appendChild(p);}
  p.innerHTML=`<button class="x" aria-label="Fechar">✕</button><b>🔎 FONTE</b>${esc(f.t)}${f.u?`<br><a href="${f.u}" target="_blank" rel="noopener">Abrir a fonte original ↗</a>`:''}<div class="nt">A lista completa aparece no fim da fase.</div>`;}
document.addEventListener('click',e=>{const b=e.target.closest('.fn'); const p=document.getElementById('fnpop');
  if(b){e.stopPropagation();showFonte(b.dataset.f);return;}
  if(p&&(e.target.closest('#fnpop .x')||!e.target.closest('#fnpop'))) p.remove();},true);
function deepHTML(id){
  const d=DEEP[id]; if(!d) return '';
  return `<div class="deep"><div class="qtag">📚 Quer se aprofundar?</div>`+
    d.b.map(b=>`<div class="bk"><b>${esc(b[0])}</b><span>${esc(b[1])} · ${esc(b[2])}</span></div>`).join('')+

}

function startQuiz(mi){
  const m=MODULES[mi];
  let qs=m.quiz.map(q=>inst(mkModuleQ(m,q)));
  if(m.flash) qs=qs.concat(shuffle(m.flash.items).map(it=>inst(mkFlashQ(m,it))));
  go({screen:'quiz',mode:'module',m:mi,qs,k:0,ok:0,picked:null,gained:0});
}
function startFinal(){ return go({screen:'voto'});
  const pool=[]; MODULES.forEach(m=>m.quiz.forEach(q=>pool.push(inst(mkModuleQ(m,q),'Prova final · '+m.emoji+' '+m.title))));
  go({screen:'quiz',mode:'final',qs:shuffle(pool).slice(0,10),k:0,ok:0,picked:null,gained:0});
}
function startSteel(){ go({screen:'quiz',mode:'steel',qs:shuffle(STEEL).map(r=>inst(mkSteelQ(r))),k:0,ok:0,picked:null,gained:0}); }
function startReview(){
  const keys=shuffle(S.wrong.filter(k=>ALLQ[k])).slice(0,10);
  go({screen:'quiz',mode:'review',qs:keys.map(k=>inst(ALLQ[k],'🔁 Revisão · '+ALLQ[k].from)),k:0,ok:0,picked:null,gained:0});
}

function quizTitle(){
  if(V.mode==='module') return MODULES[V.m].emoji+' Desafio · Fase '+(V.m+1);
  return {final:'🎓 Prova final',steel:'🎭 Advogado do outro lado',review:'🔁 Revisão dos erros'}[V.mode];
}
function renderQuiz(){
  const q=V.qs[V.k], n=V.qs.length, ans=V.picked!==null;
  let h=topbar()+`<div class="head"><button class="back" id="bk">✕</button><span class="ht">${quizTitle()}</span><span class="chip">${V.k+1}/${n}</span></div>
   <div class="dots">${V.qs.map((_,k)=>`<i class="${k<V.k||(k===V.k&&ans)?'on':''}"></i>`).join('')}</div>
   <div class="card quiz"><div class="qtag">${esc(q.tag)}</div>`;
  if(q.sub) h+=`<div class="argbox"><div class="who">💬 ${esc(q.who)}:</div>"${esc(q.sub)}"</div>`;
  h+=`<div class="qq">${esc(q.q)}</div><div class="opts ${q.grid&&q.o.length<=4?'grid2':''}">`;
  q.o.forEach((o,k)=>{let cl='opt'; if(ans){ if(k===q.a) cl+=' right'; else if(k===V.picked) cl+=' wrong'; else cl+=' dim'; }
    h+=`<button class="${cl}" data-k="${k}" ${ans?'disabled':''}>${esc(o)}</button>`;});
  h+=`</div>`;
  if(ans){const good=V.picked===q.a; h+=`<div class="fb ${good?'good':'badf'}"><b>${good?(S.streak>=3?'🔥 Acertou! '+S.streak+' seguidas':'✅ Acertou!'):'❌ Não foi dessa vez'}</b>${esc(q.e)}${q.f&&FONTES[q.f]?' <button type="button" class="fn" data-f="'+q.f+'">🔎 '+esc(FONTES[q.f].s)+'</button>':''}${good?'':'<br><small>Essa pergunta foi para a sua Revisão dos erros.</small>'}</div>`;}
  h+=`</div>`;
  if(ans) h+=`<div class="nav"><button class="btn ${V.picked===q.a?'ok':''}" id="cont">${V.k<n-1?'Continuar →':'Ver resultado'}</button></div>`;
  app.innerHTML=h;
  document.getElementById('bk').onclick=()=>go({screen:'home'});
  if(!ans) app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.k));
  else document.getElementById('cont').onclick=()=>{ if(V.k<n-1){V.k++;V.picked=null;render();window.scrollTo(0,0);} else finishQuiz(); };
}
function pick(k){
  const q=V.qs[V.k]; V.picked=k;
  if(k===q.a){
    V.ok++; S.streak++; S.best=Math.max(S.best,S.streak);
    const pts=10+(S.streak>=3?5:0); V.gained+=pts; S.xp+=pts; delWrong(q.key); save();
    toast('+'+pts+' pontos'+(S.streak>=3?' · '+S.streak+' seguidos!':'')); snd(S.streak>=3?'combo':'ok');
  } else {
    S.streak=0; addWrong(q.key); save(); snd('bad');
    if(navigator.vibrate) try{navigator.vibrate(80)}catch(e){}
  }
  render();
}
function finishQuiz(){
  const n=V.qs.length, pct=V.ok/n;
  if(V.mode==='final'){
    const pass=V.ok>=7; let newB=false;
    if(pass){ newB=giveBadge(EXTRA_BADGES[B_FINAL]); if(newB){S.xp+=100;save();} snd('win'); confetti(); }
    return go({screen:'result',mode:'final',ok:V.ok,n,pass,newB,gained:V.gained+(newB?100:0)});
  }
  if(V.mode==='steel'){
    let newB=false; if(V.ok>=6){ newB=giveBadge(EXTRA_BADGES[B_STEEL]); if(newB){S.xp+=50;save();} snd('win'); confetti(); }
    return go({screen:'result',mode:'steel',ok:V.ok,n,newB,gained:V.gained+(newB?50:0)});
  }
  if(V.mode==='review'){
    let newB=false; if(V.ok===n){ newB=giveBadge(EXTRA_BADGES[B_REVIEW]); if(newB){S.xp+=40;save();} snd('win'); confetti(); }
    return go({screen:'result',mode:'review',ok:V.ok,n,newB,gained:V.gained+(newB?40:0)});
  }
  const m=MODULES[V.m], stars=pct>=.9?3:pct>=.6?2:1, prev=S.done[m.id];
  let bonus=0;
  if(!prev) bonus=30+stars*10; else if(stars>prev.stars) bonus=(stars-prev.stars)*10;
  S.done[m.id]={stars:Math.max(stars,prev?prev.stars:0)};
  const newB=giveBadge(m.badge); S.xp+=bonus; save();
  go({screen:'result',mode:'module',m:V.m,ok:V.ok,n,stars,newB,gained:V.gained+bonus});
  if(stars>=2||newB){ snd('win'); confetti(); }
}

function renderCompass(){
  const n=COMPASS_Q.length;
  if(V.i>=n || V.show){
    const p=S.compass;
    const key = p.x<0 ? (p.y>0?'tl':'bl') : (p.y>0?'tr':'br');
    const centro = Math.abs(p.x)<.2 && Math.abs(p.y)<.2;
    const q=QUAD[key];
    const pulls=(p.pulls||[]).map(u=>`<div class="pull"><span>${u.dir}</span>${esc(u.t)}</div>`).join('');
    app.innerHTML=topbar()+`<div class="head"><button class="back" id="bk">←</button><span class="ht">🎯 Sua bússola</span></div>
      <div class="card"><h2>${centro?'Bem perto do centro':'Você ficou em: '+q.n}</h2>${compassSVG(p)}
      <p>${centro?'Suas respostas se equilibraram entre os lados. Muita gente que se diz "nem de esquerda nem de direita" cai aqui.':q.d}</p>
      ${pulls?`<div class="qtag" style="margin-top:14px">As frases que mais te puxaram</div>${pulls}`:''}
      <div class="warn">⚠️ São 24 frases, não um diagnóstico. Quase todo mundo mistura ideias de vários quadrantes, e tudo bem não caber num rótulo. Use o resultado para refletir, não como identidade.</div>
      <div class="qinfo" id="qinfo">Toque nos outros quadrantes para comparar.</div></div>
      <div class="nav"><button class="btn ghost" id="redo">Refazer</button><button class="btn" id="home">Voltar à trilha</button></div>`;
    bindCompass();
    document.getElementById('bk').onclick=()=>go({screen:'home'});
    document.getElementById('home').onclick=()=>go({screen:'home'});
    document.getElementById('redo').onclick=()=>go({screen:'compass',i:0,ans:[]});
    return;
  }
  const q=COMPASS_Q[V.i];
  const opts=[['Concordo totalmente',2],['Concordo em parte',1],['Neutro / não sei',0],['Discordo em parte',-1],['Discordo totalmente',-2]];
  app.innerHTML=topbar()+`<div class="head"><button class="back" id="bk">←</button><span class="ht">🎯 Bússola pessoal</span><span class="chip">${V.i+1}/${n}</span></div>
    <div class="dots">${COMPASS_Q.map((_,k)=>`<i class="${k<V.i?'on':''}"></i>`).join('')}</div>
    <div class="card quiz"><div class="qtag">O que você acha?</div><div class="qq">${esc(q.t)}</div>
    <div class="scale">${opts.map(o=>`<button class="opt" data-v="${o[1]}">${o[0]}</button>`).join('')}</div>
    <p style="color:var(--muted);font-size:.85rem;margin-top:14px">Não existe resposta certa aqui, e suas respostas ficam só neste aparelho.</p></div>
    ${V.i>0?'<div class="nav"><button class="btn ghost" style="flex:1" id="prevq">← Pergunta anterior</button></div>':''}`;
  document.getElementById('bk').onclick=()=>go({screen:'home'});
  const pq=document.getElementById('prevq'); if(pq) pq.onclick=()=>{V.i--;render();};
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    V.ans[V.i]=+b.dataset.v; V.i++;
    if(V.i>=n){
      let x=0,y=0; const contrib=[];
      COMPASS_Q.forEach((c,k)=>{const v=(V.ans[k]||0)*c.d; if(c.ax==='x') x+=v; else y+=v;
        if(v!==0) contrib.push({t:c.t,v,dir:c.ax==='x'?(v>0?'mercado ▶':'◀ Estado'):(v>0?'▲ ordem':'▼ liberdade')});});
      const half=COMPASS_Q.length/2*2;
      const pulls=contrib.sort((a,b)=>Math.abs(b.v)-Math.abs(a.v)).slice(0,4).map(u=>({t:u.t,dir:u.dir}));
      S.compass={x:Math.max(-1,Math.min(1,x/half)),y:Math.max(-1,Math.min(1,y/half)),pulls};
      const nb=giveBadge(EXTRA_BADGES[B_COMPASS]); if(nb){S.xp+=40;} save(); if(nb){toast('+40 pontos · '+EXTRA_BADGES[B_COMPASS]);confetti();snd('win');}
    }
    render(); window.scrollTo(0,0);
  });
}

function renderCert(){
  const d=new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'});
  app.innerHTML=topbar()+`<div class="head"><button class="back" id="bk">←</button><span class="ht">🎓 Certificado</span></div>
    <input class="txt" id="nm" placeholder="Seu nome no certificado" value="${esc(S.name||'')}">
    <div class="cert"><div style="font-size:2.4rem">🏆</div><div class="qtag">Certificado de conclusão</div>
      <h2>Política sem Mistério</h2><p>Certificamos que</p><div class="nm" id="cn">${esc(S.name||'Seu nome aqui')}</div>
      <p>concluiu as ${NF} fases do curso, de "O mapa da política" a "Pensando sozinho".</p>
      <p style="color:var(--muted);font-size:.85rem">${d} · ${S.xp} pontos · nível ${level().L.n}</p></div>
    <div class="nav"><button class="btn" id="cp">Copiar conquista</button><button class="btn ghost" id="home">Trilha</button></div>
    <a class="btn" href="index.html#avaliar" style="display:block;text-align:center;text-decoration:none;margin:10px 0">⭐ Avaliar o curso e sugerir um tema</a>
    <p style="color:var(--muted);font-size:.8rem;text-align:center">Dica: tire um print da tela para guardar o certificado.</p>`;
  const nm=document.getElementById('nm');
  nm.oninput=()=>{S.name=nm.value.slice(0,40);save();document.getElementById('cn').textContent=S.name||'Seu nome aqui';};
  document.getElementById('bk').onclick=()=>go({screen:'home'});
  document.getElementById('home').onclick=()=>go({screen:'home'});
  document.getElementById('cp').onclick=async()=>{
    const t=`🎓 ${S.name||'Eu'} concluí o curso "Política sem Mistério": ${NF} fases sobre esquerda, direita, centro, economia, os três poderes, política mundial e mais, com ${S.xp} pontos!`;
    try{await navigator.clipboard.writeText(t);toast('Copiado!');}catch(e){toast('Não deu para copiar aqui');}
  };
}

function renderAval(){
  const a=S.aval||{};const ck=(k,v)=>a[k]===v?'checked':'';
  const radios=(name,opts)=>`<div class="av-row" role="radiogroup">${opts.map(o=>`<label><input type="radio" name="${name}" value="${o}" ${ck(name,o)}><span>${o}</span></label>`).join('')}</div>`;
  app.innerHTML=topbar()+`<div class="head"><button class="back" id="bk">←</button><span class="ht">📝 Avalie o curso</span></div>
   <form class="card" id="avf"><p>Leva 1 minuto. Por enquanto, sua avaliação fica guardada neste aparelho.</p>
    <div class="av-q" id="lr">Que nota você dá ao curso? <small style="font-weight:400;opacity:.8">(1 = não gostei, 5 = gostei muito)</small></div>${radios('rating',['1','2','3','4','5'])}
    <label class="av-q" for="learned" style="display:block">O que você aprendeu que não sabia?</label><textarea class="txt" id="learned" name="learned" maxlength="600">${esc(a.learned||'')}</textarea>
    <div class="av-q">Sentiu que o curso favoreceu algum lado?</div>${radios('bias',['Não','Sim','Não sei'])}
    <div id="bd" ${a.bias==='Sim'?'':'hidden'}><label class="av-q" for="biasDetail" style="display:block">Qual lado, e em que parte?</label><input class="txt" id="biasDetail" name="biasDetail" maxlength="300" value="${esc(a.biasDetail||'')}"></div>
    <label class="av-q" for="comment" style="display:block">Comentário livre</label><textarea class="txt" id="comment" name="comment" maxlength="1000">${esc(a.comment||'')}</textarea>
    <label class="av-q" for="nextTopic" style="display:block">Que tema você quer que vire curso?</label><input class="txt" id="nextTopic" name="nextTopic" maxlength="200" value="${esc(a.nextTopic||'')}">
    <div class="nav"><button type="button" class="btn ghost" id="home">Voltar</button><button type="submit" class="btn">Salvar avaliação</button></div></form>`;
  const f=document.getElementById('avf');
  const sync=()=>{const sim=(new FormData(f).get('bias')==='Sim');document.getElementById('bd').hidden=!sim;};
  f.addEventListener('change',sync);
  document.getElementById('bk').onclick=()=>go({screen:'home'});
  document.getElementById('home').onclick=()=>go({screen:'home'});
  f.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f).entries());if(d.bias!=='Sim')delete d.biasDetail;
    if(!d.rating){toast('Escolha uma nota de 1 a 5');return;}
    S.aval=d;save();
    try{const q=JSON.parse(localStorage.getItem('pmu-fila')||'[]');q.push({curso:'politica-sem-misterio',quando:new Date().toISOString(),...d});localStorage.setItem('pmu-fila',JSON.stringify(q));}catch(x){}
    toast('Avaliação salva neste aparelho. Obrigado!');go({screen:'home'});};
}

const VOTO={"q": "Se a decisão fosse sua: qual deveria ser o tamanho do Estado na economia?", "o": [{"t": "Estado menor", "s": "menos impostos, menos gastos, mais espaço para o mercado", "pro": "Quem defende, na tradição liberal de Locke, Adam Smith e Hayek, diz que impostos e regras demais tiram liberdade das pessoas e travam o crescimento. [[locke]] [[hayek]]", "con": "Quem critica diz que o mercado sozinho não reduz a desigualdade e deixa os mais pobres sem proteção. [[bobbio]]"}, {"t": "Estado maior", "s": "mais serviços públicos e mais proteção social", "pro": "Quem defende cita os países nórdicos, onde impostos altos pagam saúde, educação e proteção social para todos. [[esping]]", "con": "Quem critica diz que isso exige impostos altos, tira o incentivo para investir e trabalhar e dá poder demais ao governo. [[hayek]]"}, {"t": "Meio-termo", "s": "mercado livre, com rede de proteção e contas sob controle", "pro": "Quem defende, como Anthony Giddens na chamada \"terceira via\", diz que dá para combinar mercado forte com proteção social. [[giddens]]", "con": "Quem critica, à esquerda e à direita, diz que o meio-termo vira indefinição: não corta o que deveria nem protege o suficiente. [[heywood]]"}]};
function vtxt(t){return esc(t).replace(/\[\[([a-zA-Z0-9_]+)\]\]/g,(m,k)=>FONTES[k]?`<button type="button" class="fn" data-f="${k}" aria-label="Ver fonte: ${esc(FONTES[k].s)}">🔎 ${esc(FONTES[k].s)}</button>`:'');}
function renderVoto(){
  const k=S.voto, o=(k!=null)?VOTO.o[k]:null;
  app.innerHTML=topbar()+`<div class="head"><button class="back" id="bk">←</button><span class="ht">🗳️ E você, o que acha?</span></div>
   <div class="card"><h2>${esc(VOTO.q)}</h2><p>Não existe resposta certa e não vale nota. Toque numa opção para ver os dois lados.</p>
   ${VOTO.o.map((x,i)=>`<button type="button" class="vo ${k===i?'on':''}" data-v="${i}" aria-pressed="${k===i}"><b>${esc(x.t)}</b><small>${esc(x.s)}</small></button>`).join('')}
   ${o?`<div class="vside" aria-live="polite"><b>👍 A favor</b><p>${vtxt(o.pro)}</p><b>👎 Contra</b><p>${vtxt(o.con)}</p></div>`:''}</div>
   <div class="nav"><button class="btn ghost" id="home">Trilha</button>${k!=null?'<button class="btn" id="ct">Pegar certificado 🎓</button>':''}</div>`;
  app.querySelectorAll('.vo').forEach(b=>b.onclick=()=>{const first=S.voto==null;S.voto=+b.dataset.v;if(first&&giveBadge(EXTRA_BADGES[B_FINAL])){snd('win');}save();renderVoto();});
  document.getElementById('bk').onclick=()=>go({screen:'home'});
  document.getElementById('home').onclick=()=>go({screen:'home'});
  const ct=document.getElementById('ct');if(ct)ct.onclick=()=>go({screen:'cert'});
}

render();
</script>
