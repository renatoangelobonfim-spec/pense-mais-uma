 <button class="go" id="go">${ch.debate?"Ver o debate de verdade":S.ci<CH.length-1?"Próximo capítulo":"Rodada relâmpago"}</button>`;
 document.getElementById("go").onclick=()=>{if(ch.debate)S.scr="debate";else next();save();render()}}
function next(){if(S.ci<CH.length-1){S.ci++;S.k=0;S.scr="chap"}else S.scr="rel"}
function debate(){app.innerHTML=head("O debate de verdade",100)+`<div style="margin-top:14px"><div class="k">Opinião, com os dois lados</div><h2 class="big">O Brasil deveria ter voto impresso?</h2>
 <p style="color:#DCD8F2;line-height:1.55">O que é fato: até hoje não há registro comprovado de fraude na urna desde 1996, segundo o TSE. [[senado26]]</p>
 <p style="color:#DCD8F2;line-height:1.55">O que é opinião: se o sistema atual basta para o eleitor confiar. Aqui as duas posições têm argumentos sérios.</p></div>
 <div class="two"><div><b style="color:#6EE8D3">Quem defende o voto impresso</b><p>Um papel conferido pelo eleitor e guardado numa urna permitiria recontar os votos sem depender do programa. O pesquisador Diego Aranha, que encontrou falhas nos testes, defende isso: para ele, os testes conferem o programa antes da eleição, não o que a urna faz durante a votação, e o sistema seria especialmente vulnerável a alguém de dentro. [[aranha18]] O tribunal alemão também exigiu que o cidadão consiga conferir a votação sem saber informática. [[bverfg]] E o Brasil está entre os países que usam urna eletrônica sem comprovante em papel; em muitos lugares dos EUA, vota-se em papel e uma máquina faz a leitura. [[bbc26]]</p></div>
 <div><b style="color:#F59A74">Quem é contra</b><p>O STF viu risco ao sigilo e à liberdade do voto. [[stf20]] O teste de 2002 trouxe filas, falhas de impressora e quebra de sigilo em algumas seções. [[tse2002]] [[tse2002b]] O relator no STF estimou em quase R$ 2 bilhões o custo das impressoras. [[stf20]] E a urna já tem boletim impresso e testes de integridade em papel. [[tseint]]</p></div></div>
 <p style="color:var(--mut);font-size:13.5px;margin-top:12px">O curso não toma partido nessa discussão: você decide qual argumento pesa mais.</p>
 <button class="go" id="go">Rodada relâmpago</button>`;
 app.querySelectorAll("p").forEach(p=>p.innerHTML=src(p.innerHTML));
 document.getElementById("go").onclick=()=>{next();save();render()}}
function rel(){if(!S.rel){const pool=[...ALL].sort(()=>Math.random()-.5).slice(0,5).map(c=>c.id);S.rel={ids:pool,i:0,ok:0,done:false};save()}
 const R=S.rel;if(R.i>=R.ids.length){R.done=true;S.scr="end";save();return render()}
 const c=ALL.find(x=>x.id===R.ids[R.i]);
 app.innerHTML=head("Rodada relâmpago · "+(R.i+1)+" de 5",R.i/5*100)+`<div class="k" style="margin-top:6px">Revisão: frases sorteadas dos 4 capítulos</div>
 <div class="panel" style="margin-top:14px"><p class="claim" style="color:var(--txt);margin:0">"${esc(c.c)}"</p></div>
 <div class="acts"><button class="m" data-v="m">Mito</button><button class="d" data-v="d">Depende</button><button class="f" data-v="f">Fato</button></div><div id="fbk"></div>`;
 app.querySelectorAll(".acts button").forEach(b=>b.onclick=()=>{const ok=b.dataset.v===c.a;if(ok){R.ok++;S.pts+=10}snd(ok?"ok":"no");app.querySelectorAll(".acts button").forEach(x=>x.disabled=true);
  document.getElementById("fbk").innerHTML=`<div class="panel"><div class="verd"><span class="pill ${c.a}">${V[c.a].toUpperCase()}</span><span class="${ok?"ok":"no"}">${ok?"+10":"Era "+V[c.a].toLowerCase()}</span></div></div><button class="go" id="nx">${R.i<4?"Próxima":"Ver resultado"}</button>`;
  R.i++;save();bar0();document.getElementById("nx").onclick=()=>render()})}
function bar0(){const t=app.querySelector(".top .r span");if(t)t.textContent=S.pts+" pts"}
function end(){const F=S.fb,n=right(),R=S.rel||{ok:0};if(n>=13)confetti();
 app.innerHTML=head("Resultado",100)+`<div style="margin-top:10px"><div class="k">Fato ou mito? · Urna eletrônica</div><h2 class="big">${n} de ${ALL.length} frases certas</h2><p style="color:#DCD8F2">${S.pts} pontos, com ${R.ok} de 5 na rodada relâmpago.</p></div>
 <div class="chaps">${CH.map((c,i)=>`<div>${c.i} ${c.t}<span class="stars">${stars(i)}</span></div>`).join("")}</div>
 <div class="panel"><b>Antes de compartilhar um boato</b><p style="font-size:14.5px">Procure a frase em agências de checagem. A página Fato ou Boato, do TSE, reúne checagens de dez parceiros. [[tsefob]]</p></div>
 <div class="panel"><b>Avalie o curso</b><p style="font-size:14px">Que nota você dá?</p><div class="rate">${[1,2,3,4,5].map(x=>`<button data-n="${x}" class="${F.nota===x?"on":""}">${x}</button>`).join("")}</div>
 <p style="font-size:14px">O que você aprendeu que não sabia?</p><textarea id="apr" rows="2">${esc(F.apr||"")}</textarea>
 <p style="font-size:14px">Sentiu que o curso favoreceu algum lado?</p><select id="lado"><option value="">Escolha</option>${["Não","Sim, a favor da urna","Sim, contra a urna","Não sei"].map(o=>`<option ${F.lado===o?"selected":""}>${o}</option>`).join("")}</select>
 <p style="font-size:14px">Comentário</p><textarea id="com" rows="2">${esc(F.com||"")}</textarea>
 <p style="font-size:14px">Que tema você quer que vire o próximo Fato ou mito?</p><textarea id="tema" rows="2">${esc(F.tema||"")}</textarea>
 <button class="go" id="env">${F.sent?"Avaliação enviada ✓":"Enviar avaliação"}</button></div>
 <div class="panel"><b>Próximos da série Fato ou mito?</b><p style="font-size:14.5px">Regulação das redes · Drogas na lei · Aborto na lei</p></div>
 <div class="panel"><b>Para ir além</b><p style="font-size:14px"><a style="color:#C9C2FF" href="https://www.youtube.com/results?search_query=teste+p%C3%BAblico+de+seguran%C3%A7a+urna+eletr%C3%B4nica" target="_blank" rel="noopener">Vídeos sobre o Teste Público de Segurança (busca no YouTube)</a></p></div>
 <div class="panel"><b>Fontes</b><ul class="fontes">${Object.values(FONTES).map(f=>`<li>${esc(f.t)}${f.u?` · <a href="${f.u}" target="_blank" rel="noopener">abrir</a>`:""}</li>`).join("")}</ul></div>
 <button class="go alt" id="again">Jogar de novo</button>`;
 app.querySelectorAll(".panel p").forEach(p=>p.innerHTML=src(p.innerHTML));
 app.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{S.fb.nota=+b.dataset.n;save();app.querySelectorAll("[data-n]").forEach(x=>x.classList.toggle("on",x===b))});
 [["apr","apr"],["com","com"],["tema","tema"]].forEach(([i,k])=>document.getElementById(i).oninput=e=>{S.fb[k]=e.target.value;save()});
 document.getElementById("lado").onchange=e=>{S.fb.lado=e.target.value;save()};
 document.getElementById("env").onclick=e=>{S.fb.sent=true;try{const q=JSON.parse(localStorage.getItem("pmu-fila")||"[]");q.push({curso:"fato-ou-mito-urna",quando:new Date().toISOString(),...S.fb});localStorage.setItem("pmu-fila",JSON.stringify(q))}catch(x){}save();e.target.textContent="Avaliação enviada ✓"};
 document.getElementById("again").onclick=()=>{S={scr:"intro",ci:0,k:0,ans:{},pts:0,streak:0,mute:S.mute,fb:{},rel:null};save();render()}}
function confetti(){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;const cv=document.createElement("canvas");cv.className="confetti";cv.width=innerWidth;cv.height=innerHeight;document.body.appendChild(cv);const x=cv.getContext("2d");const P=Array.from({length:90},()=>({x:Math.random()*cv.width,y:-20-Math.random()*200,v:2+Math.random()*3,r:Math.random()*6.28,c:["#3DDBC0","#8C7CFF","#F07A4B","#FFD66B"][Math.random()*4|0]}));let t=0;(function f(){x.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.y+=p.v;p.r+=.1;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillRect(-4,-2,8,4);x.restore()});if(++t<140)requestAnimationFrame(f);else cv.remove()})();snd("win")}
const pop=document.getElementById("fnpop");
document.addEventListener("click",e=>{const b=e.target.closest(".fn");if(b){e.preventDefault();e.stopPropagation();const f=FONTES[b.dataset.f];if(!f)return;document.getElementById("fnbody").innerHTML=`<b>Fonte</b><br>${esc(f.t)}${f.u?`<br><a href="${f.u}" target="_blank" rel="noopener">Abrir a fonte ↗</a>`:""}`;pop.style.display="block";return}
 if(e.target.closest("#fnpop .x")||!e.target.closest("#fnpop"))pop.style.display="none"},true);
if(S.scr==="card"&&S.ans[S.ci+"-"+S.k]){if(S.k<CH[S.ci].cards.length-1)S.k++;else S.scr="recap"}
render();
</script>
</body></html>
