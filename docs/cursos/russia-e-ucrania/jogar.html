const wait=ms=>new Promise(r=>setTimeout(r,FAST?0:ms));
async function step(){if(busy)return;busy=true;tray.innerHTML="";
 while(S.pos<R.length){const b=R[S.pos];bar();
  if(b.day){addDay(b.day);S.pos++;continue}
  if(b.m){if(!FAST){const ty=typing(b.m[0]);await wait(Math.min(1600,450+b.m[1].length*9));ty.remove()}addMsg(b.m[0],b.m[1]);if(!FAST)snd("pop");S.pos++;save();continue}
  if(b.c){const A=S.ans[b.c.id];if(A&&A.done){replayChoice(b.c,A);S.pos++;continue}
   busy=false;showChoice(b.c);return}
  if(b.game){if(S.ans.game&&S.ans.game.done){renderGame(true);S.pos++;continue}busy=false;renderGame(false);return}
  if(b.end){busy=false;renderEnd();bar();return}
 }busy=false}
function chipsHTML(q,opts){return `<div class="q">${q}</div><div class="chips">${opts.map((o,k)=>`<button class="chip" data-k="${k}">${o}</button>`).join("")}</div>`}
function showChoice(c){
 if(c.kind==="factround")return factRound(c);
 if(c.kind==="quiz")return quiz(c);
 tray.innerHTML=chipsHTML(c.q,c.o);down();
 tray.querySelectorAll(".chip").forEach(b=>b.onclick=async()=>{const k=+b.dataset.k;tray.innerHTML="";const A={v:k,done:true};
  addMsg("me",c.o[k]);
  if(c.kind==="predict"){const ok=k===c.a;A.ok=ok;if(ok){S.pts+=10;snd("ok")}else snd("no")}

  await reveal(c,A);busy=false;step()})}
