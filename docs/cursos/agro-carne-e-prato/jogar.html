<style>
:root{--bg:#FBF6EC;--ink:#2B2118;--to:#C4472B;--ol:#3E4A2B;--sand:#F1E6D2;--br:#8A6A3E;--mut:#6E5E4E;--card:#fff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font:400 16px/1.5 'DM Sans',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{background-image:repeating-linear-gradient(0deg,transparent 0 22px,rgba(196,71,43,.035) 22px 24px),repeating-linear-gradient(90deg,transparent 0 22px,rgba(196,71,43,.035) 22px 24px)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--to)}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:0 20px calc(24px + env(safe-area-inset-bottom))}
#pratos{display:flex;gap:8px;justify-content:center;padding:14px 0 6px}
#pratos i{width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px var(--sand);display:block}
#pratos i.on{background:var(--to);box-shadow:0 0 0 3px #F3C9BC}
.k{font:italic 600 15px 'Fraunces',Georgia,serif;color:var(--to);margin-top:10px}
h1{font:800 40px/1.05 'Fraunces',Georgia,serif;margin:10px 0 14px;letter-spacing:-.01em}
h1 em{font-style:italic;color:var(--to)}
h2{font:800 28px/1.12 'Fraunces',Georgia,serif;margin:4px 0 10px}
.p{margin-bottom:12px}.m{color:var(--mut);font-size:15px}
.nt{font:italic 600 15px/1.45 'Fraunces',Georgia,serif;color:var(--ol);background:#EEF0E6;border-radius:14px;padding:12px 14px;margin:6px 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}.chips span{background:var(--sand);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px}
.go{display:block;width:100%;min-height:54px;border-radius:999px;background:var(--to);color:#fff;font:800 18px 'DM Sans';margin-top:14px}
.go.alt{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:18px}
.nav button{min-height:48px;padding:0 6px;font-weight:700;color:var(--mut)}
.nav .nx{background:var(--ink);color:var(--bg);border-radius:999px;padding:0 20px}
/* prato */
.plate{width:248px;height:248px;border-radius:50%;margin:8px auto 14px;background:#fff;box-shadow:0 0 0 14px var(--sand),0 10px 26px rgba(43,33,24,.14);position:relative;transition:transform .2s}
.plate.drop{transform:scale(1.04)}
.food{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 13px 'DM Sans';color:#fff;text-align:center;transition:all .35s cubic-bezier(.2,.8,.2,1)}
.f-arroz{left:26px;top:34px;width:112px;height:112px;background:#EDE6D6;color:#6B5B45}
.f-feijao{left:124px;top:38px;width:96px;height:96px;background:#5B3A26}
.f-mix{left:62px;top:136px;width:126px;height:80px;border-radius:40px;opacity:0;transform:scale(.6)}
.f-mix.on{opacity:1;transform:none}
.tray{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.tray::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:46px;padding:0 14px;border-radius:14px;background:#fff;border:2px dashed #D8C7AE;font-weight:700;font-size:14px;touch-action:none;user-select:none}
.chip.on{border-style:solid;border-color:var(--to);background:#FDEDE8}
.ghost{position:fixed;pointer-events:none;z-index:50;padding:10px 14px;border-radius:14px;background:#fff;border:2px solid var(--to);font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.18)}
.bars{margin:6px 0 12px}
.bar{display:grid;grid-template-columns:118px 1fr 44px;align-items:center;gap:8px;font-size:13px;margin-bottom:8px;min-height:28px;width:100%;text-align:left}
.bar .tr{height:14px;border-radius:7px;background:var(--sand);overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:7px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar b{font-weight:800;text-align:right}
.big{font:800 54px/1 'Fraunces',Georgia,serif;color:var(--to)}
.unit{font-size:13px;color:var(--mut);margin-bottom:10px}
/* lados */
.lado{background:#fff;border-radius:18px;padding:14px 16px;margin-bottom:10px;border-left:6px solid var(--c,var(--to))}
.lado h3{font:800 17px 'Fraunces',Georgia,serif;margin-bottom:4px}
.lado p{font-size:15px}
/* pizza */
.pie{width:248px;height:248px;border-radius:50%;margin:8px auto 14px;box-shadow:0 0 0 14px var(--sand),0 10px 26px rgba(43,33,24,.14);position:relative;transition:background .5s}
.pie::after{content:attr(data-c);position:absolute;inset:58px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;text-align:center;font:800 17px/1.15 'Fraunces',Georgia,serif;padding:6px;white-space:pre-line}
.leg{display:grid;gap:8px;margin-bottom:10px}
.leg button{display:flex;align-items:center;gap:10px;text-align:left;background:#fff;border-radius:14px;padding:10px 12px;min-height:48px;border:2px solid transparent;font-size:14px}
.leg button.on{border-color:var(--ink)}
.leg i{width:16px;height:16px;border-radius:50%;flex:none}
.leg small{margin-left:auto;font-weight:800}
.det{background:var(--sand);border-radius:14px;padding:12px 14px;font-size:15px;margin-bottom:12px;min-height:48px}
.seg{display:flex;background:var(--sand);border-radius:999px;padding:4px;margin-bottom:8px}
.seg button{flex:1;min-height:44px;border-radius:999px;font-weight:700;font-size:14px}
.seg button.on{background:var(--ink);color:var(--bg)}
.ch{display:flex;gap:10px;margin-bottom:12px}
.ch div{flex:1;background:#fff;border-radius:16px;padding:12px}
.ch b{font:800 22px 'Fraunces',Georgia,serif;display:block;color:var(--ol)}
.ch p{font-size:13px}
/* cardápios */
.menu{display:block;width:100%;text-align:left;cursor:pointer;background:#fff;border-radius:16px;padding:14px 16px;margin-bottom:10px;border:2px solid var(--sand);min-height:56px}
.menu h3{font:800 16px 'DM Sans';display:flex;justify-content:space-between}
.menu h3 span{color:var(--mut);font-weight:700}
.menu .in{display:none;margin-top:6px}
.menu.on .in{display:block}
.menu .pc{font:800 40px/1 'Fraunces',Georgia,serif;color:var(--to)}
/* voto */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 12px}
.opt{background:#fff;border-radius:18px;padding:12px;text-align:center;border:2px solid transparent;min-height:120px}
.opt.on{border-color:var(--to);background:#FDEDE8}
.mini{width:58px;height:58px;border-radius:50%;margin:0 auto 8px;background:#fff;box-shadow:0 0 0 6px var(--sand);position:relative;overflow:hidden}
.mini i{position:absolute;border-radius:50%}
.opt b{font:800 15px 'Fraunces',Georgia,serif;display:block}.opt small{font-size:12px;color:var(--mut)}
.cd{background:#fff;border-radius:18px;padding:14px 16px;margin-bottom:12px}
.cd i{display:block;font:italic 700 14px 'Fraunces',Georgia,serif;margin:4px 0 2px;color:var(--ol)}
.cd i.c{color:var(--to)}
.box{background:#fff;border-radius:20px;padding:16px;margin-bottom:14px}
.box h3{font:800 20px 'Fraunces',Georgia,serif;margin-bottom:8px}
.box p+p{margin-top:10px}
.rate{display:flex;gap:8px}.rate button{flex:1;min-height:48px;border-radius:14px;background:var(--sand);font:800 18px 'DM Sans'}
.rate button.on{background:var(--ink);color:var(--bg)}
textarea,select{width:100%;margin-top:6px;border:2px solid var(--sand);border-radius:12px;padding:10px;font:400 15px 'DM Sans';background:#fff;color:var(--ink)}
ol.fontes{padding-left:22px;font-size:13px;color:var(--mut)}ol.fontes li{margin-bottom:8px}
/* fonte */
sup{line-height:0}
.fn{font:800 11px 'DM Sans';min-width:22px;min-height:22px;padding:0 4px;margin-left:2px;border-radius:50%;background:var(--sand);color:var(--to);vertical-align:2px;position:relative}
.fn::before{content:"";position:absolute;inset:-11px -6px}
#fnpop{position:fixed;left:14px;right:14px;bottom:14px;max-width:500px;margin:0 auto;background:#fff;border-radius:20px;padding:16px 18px;z-index:60;display:none;font-size:14px;box-shadow:0 0 0 2px var(--ink),0 16px 40px rgba(43,33,24,.3)}
#fnpop b{font:800 15px 'Fraunces',Georgia,serif}#fnpop a{font-weight:700}
#fnpop .x{position:absolute;right:6px;top:2px;font-size:24px;min-width:44px;min-height:44px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
const FONTES={
 owid_less:{s:"Our World in Data, 2020",t:"Our World in Data (Hannah Ritchie, fev/2020), com dados de Poore e Nemecek (Science, 2018): a carne de boi tem mediana mundial de 25 kg de CO2 equivalente por 100 g de proteína (metade emite mais, metade menos), e os 10% de produtores de menor impacto emitem menos de 9; entre os vegetais, os 10% de maior impacto chegam a 3,5 no tofu, 2,4 nas castanhas e 0,8 na ervilha; frango dos 10% de menor impacto, 2,4. Conclusão do texto: comer menos carne é quase sempre melhor do que comer carne mais sustentável",u:"https://ourworldindata.org/less-meat-or-sustainable-meat"},
 owid_mean:{s:"Our World in Data (Poore e Nemecek)",t:"Our World in Data, com a maior meta-análise já feita sobre impactos da comida (Poore e Nemecek, 2018: 570 estudos, cerca de 38.700 fazendas em 119 países, ano de referência mediano 2010): médias mundiais de emissões, em kg de CO2 equivalente por 100 g de proteína: boi de corte 49,9, queijo 10,8, porco 7,6, frango 5,7, ovo 4,2, tofu 2,0, feijão e outras leguminosas 0,84",u:"https://ourworldindata.org/grapher/ghg-per-protein-poore"},
 fapesp:{s:"Revista Pesquisa Fapesp, 2022",t:"Revista Pesquisa Fapesp (abr/2022): quanto menor o tempo de vida do boi, mais baixa a emissão por quilo de carne; a integração da lavoura com a pecuária foi sistematizada pela Embrapa nos anos 1990, e as raízes do capim estocam carbono no solo; uma fazenda com integração citada pela revista emitia 11,5 t de CO2 equivalente por tonelada de carne, cerca de 40% abaixo da média mundial, valor que a revista ainda considera alto",u:"https://revistapesquisa.fapesp.br/o-esforco-do-brasil-para-reduzir-a-pegada-de-carbono-da-pecuaria/"},
 embrapa_cbc:{s:"Embrapa, Protocolo Carne Baixo Carbono, 2025",t:"Embrapa (2025): o Protocolo Carne Baixo Carbono, de adesão voluntária, pretende valorizar a carne de sistemas capazes de mitigar as emissões do gado de corte, com práticas em pastagens, terminação intensiva e integração lavoura-pecuária, em linha com o Plano ABC+ do Ministério da Agricultura",u:"https://www.infoteca.cnptia.embrapa.br/infoteca/bitstream/doc/1180924/1/Protocolo-carne-baixo-carbono-2025.pdf"},
 seeg25:{s:"SEEG, via Canal Rural, 2026",t:"Canal Rural (out/2026), com dados do SEEG: as emissões brutas do Brasil somaram 2,06 bilhões de toneladas de CO2 equivalente em 2025, queda de 6%; mudança de uso da terra (sobretudo desmatamento) 814 milhões de toneladas, queda de 15%; agropecuária 626 milhões, queda de 0,1%; energia 427 milhões, alta de 1,2%; resíduos 96 milhões; processos industriais 94 milhões",u:"https://www.canalrural.com.br/diversos/emissoes-liquidas-do-brasil-caem-ao-menor-nivel-desde-2012/"},
 forbes:{s:"Imaflora/SEEG, via Forbes, 2026",t:"Forbes Agro (21/out/2026), com dados do Imaflora para o SEEG: a agropecuária emitiu 626,3 milhões de toneladas de CO2 equivalente em 2025; a pecuária caiu 1,68%, para 494,1 milhões, e a agricultura somou 132,1 milhões; o gado de corte respondeu por 410,7 milhões, 65,6% do total; no mesmo ano, a produção de carcaças bovinas avançou 7,2%",u:"https://forbes.com.br/forbes-agro/2026/10/emissoes-da-agropecuaria-ficam-em-626-milhoes-de-toneladas-de-co%e2%82%82-em-2025-diz-imaflora/"},
 seeg13:{s:"SEEG 13 (dados de 2024)",t:"SEEG, relatório analítico 13 (dados de 2024): somando as emissões diretas do setor e o desmatamento, a atividade agropecuária responde por dois terços das emissões brutas do país; a pecuária sozinha responde por 51%",u:"https://seeg.eco.br/wp-content/uploads/2026/03/SEEG13-relatorio-analitico-BR.pdf"},
 prodes26:{s:"Inpe/Prodes, via Canal Rural, 2026",t:"Canal Rural (out/2026), com dados do Prodes/Inpe divulgados pelo governo federal: o desmatamento na Amazônia somou 3.335 km² entre agosto de 2025 e julho de 2026, queda de 41,8%, a menor taxa da série iniciada em 1988; no Cerrado, 5.516,69 km², queda de 23,8%, a menor da série iniciada em 2001",u:"https://www.canalrural.com.br/politica/queda-do-desmatamento-reforca-discurso-ambiental-do-agro-brasileiro/"},
 cepea_pib:{s:"Cepea e CNA, 2026",t:"CNA (4/mai/2026), com o Cepea/USP: o PIB do agronegócio cresceu 12,2% em 2025, e a participação do setor na economia subiu de 22,9% em 2024 para 25,13%. O conceito soma insumos, produção, agroindústria e serviços ligados ao agro",u:"https://cnabrasil.org.br/noticias/cna-e-cepea-apontam-crescimento-de-12-2-do-pib-do-agronegocio-em-2025"},
 ibge61:{s:"IBGE, via CNN Brasil, 2026",t:"CNN Brasil (2026), com dados do IBGE: o PIB da agropecuária, que mede a produção dentro da fazenda, somou R$ 775,3 bilhões em 2025, o que correspondeu a aproximadamente 6,1% do PIB",u:"https://www.cnnbrasil.com.br/agro/pib-da-agropecuaria-cresce-117-e-soma-r-7753-bi-em-2025/"},
 emprego:{s:"Cepea e CNA, via Agrolink, 2026",t:"Agrolink (mai/2026), com Cepea e CNA: o agronegócio teve 28,4 milhões de pessoas ocupadas em 2025, recorde, alta de 2,2%; o setor respondeu por 26,3% dos empregos do país",u:"https://www.agrolink.com.br/noticias/agronegocio-responde-por-26-3--dos-empregos-no-brasil_513941.html"},
 export:{s:"Ministério da Agricultura, via Band, 2026",t:"Band (2026), com o Ministério da Agricultura: em 2025, as exportações do agronegócio somaram US$ 169,2 bilhões, 48,5% do total das vendas externas do Brasil",u:"https://www.band.com.br/agro/brasil-consolida-lideranca-global-e-bate-recordes-de-produtividade"},
 conab_bov:{s:"Conab, via Itatiaia, 2026",t:"Itatiaia (2026), com dados da Conab: a oferta de carne bovina por habitante deve cair de 34,6 kg por ano em 2026 para 31,9 kg em 2027; segundo a Conab, a carne bovina perdeu espaço no orçamento das famílias de menor renda para proteínas mais acessíveis, como frango e porco",u:"https://www.itatiaia.com.br/agro/ciclo-pecuario-reduz-producao-e-consumo-de-carne-bovina-em-2027-aponta-conab/"},
 abpa_fra:{s:"ABPA, via Notícias Agrícolas, 2026",t:"Notícias Agrícolas (6/mai/2026), com o Relatório Anual da Associação Brasileira de Proteína Animal: o consumo de frango no Brasil alcançou 46,7 kg por habitante em 2025",u:"https://www.noticiasagricolas.com.br/noticias/granjeiros/420278-consumo-de-frango-no-brasil-chega-a-46-7-kg-por-habitante-e-impulsiona-avicultura.amp.html"},
 ibope18:{s:"Ibope 2018, via CNN Brasil",t:"CNN Brasil (2022): pesquisa do Ibope de 2018 apontou que 14% dos brasileiros (cerca de 30 milhões de pessoas à época) se reconheciam vegetarianos",u:"https://www.cnnbrasil.com.br/viagemegastronomia/viagem/dia-mundial-sem-carne-mercado-cresce-e-se-adapta-a-novos-habitos/"},
 ibope_svb:{s:"Tribuna de Jundiaí",t:"Tribuna de Jundiaí: o dado de 14% de vegetarianos (30 milhões de brasileiros) vem de pesquisa da Sociedade Vegetariana Brasileira (SVB), alta de 75% sobre 2012, quando a proporção era de 8%",u:"https://tribunadejundiai.com.br/gastronomia/30-milhoes-de-brasileiros-ja-sao-vegetarianos-diz-pesquisa/"},
 svb25:{s:"Datafolha para a SVB, 2025",t:"Sociedade Vegetariana Brasileira (21/mar/2025), sobre pesquisa Datafolha encomendada por ela: 7% da população (cerca de 15 milhões) concorda, total ou parcialmente, que é vegana; a SVB diz que a metodologia mediu o senso de identidade, não detalhes do que cada pessoa come",u:"https://svb.org.br/wp-content/uploads/2025/04/declaracao-pesquisa-7-veganos.pdf"},
 opovo_df:{s:"Datafolha para a SVB, via O Povo, 2025",t:"O Povo (mar/2025), sobre a pesquisa Datafolha encomendada pela SVB: 74% da população concorda, em algum grau, com a possibilidade de parar de consumir carne pela própria saúde, e 22% afirmam já ter tentado parar de comer carne em algum momento",u:"https://mais.opovo.com.br/colunistas/eliziane-colares/2025/03/29/7-dos-brasileirossao-veganos.html"},
 ipsos_veg:{s:"Ipsos para o EscolhaVeg, 2023",t:"Ipsos (16/mai/2023), para o programa EscolhaVeg, da ONG Mercy For Animals (1.001 entrevistas on-line): 55% dos brasileiros têm alimentação onívora, 22% flexitariana, 8% vegetariana estrita ou vegana, 7% pescetariana e 5% ovolactovegetariana",u:"https://www.ipsos.com/pt-br/pesquisa-aponta-habitos-alimentares-da-populacao-brasileira-e-busca-por-alimentacao-nutritiva-e"},
 inca:{s:"INCA, sobre a avaliação da OMS, 2015",t:"Instituto Nacional de Câncer (INCA), sobre o relatório da Agência Internacional de Pesquisa em Câncer (Iarc), da OMS, de outubro de 2015: carnes processadas, como salsicha, linguiça, bacon e presunto, foram classificadas no grupo 1 (evidência suficiente de que causam câncer colorretal); cada porção diária de 50 g aumenta esse risco em 18%; a carne vermelha entrou no grupo 2A, de carcinógeno provável",u:"https://ninho.inca.gov.br/jspui/bitstream/123456789/9068/1/Informe%20INCA%20341-4.pdf"},
 iarc_ind:{s:"Iarc, via Observador, 2015",t:"Observador (2015), citando Kurt Straif, diretor do programa de monografias da Iarc: para um indivíduo, o risco de câncer colorretal pelo consumo de carne processada continua pequeno, mas aumenta com a quantidade consumida; o jornal acrescenta que estar no mesmo grupo do tabaco não quer dizer que o risco seja equivalente",u:"https://observador.pt/?p=1019847"},

 <p><a href="https://www.youtube.com/results?search_query=pecu%C3%A1ria+baixo+carbono+Embrapa" target="_blank" rel="noopener">Pecuária de baixo carbono (busca no YouTube)</a><br><a href="https://www.youtube.com/results?search_query=dieta+vegetariana+nutricionista+B12" target="_blank" rel="noopener">Dieta vegetariana e vitamina B12 (busca no YouTube)</a></p></section>
 <section class="box" id="avaliar"><h3>Avalie o curso</h3><p>Que nota você dá?</p><div class="rate">${[1,2,3,4,5].map(x=>`<button data-n="${x}" class="${S.fb.nota===x?"on":""}" aria-label="Nota ${x}">${x}</button>`).join("")}</div>
 <p>O que você aprendeu que não sabia?</p><textarea id="apr" rows="2">${esc(S.fb.apr||"")}</textarea>
 <p>Sentiu que o curso favoreceu algum lado?</p><select id="lado"><option value="">Escolha</option>${["Não","Sim, a favor de comer carne","Sim, contra comer carne","Não sei"].map(o=>`<option ${S.fb.lado===o?"selected":""}>${o}</option>`).join("")}</select>
 <p>Comentário</p><textarea id="com" rows="2">${esc(S.fb.com||"")}</textarea>
 <p>Que tema você quer que vire curso?</p><textarea id="tema" rows="2">${esc(S.fb.tema||"")}</textarea>
 <button class="go" id="env">${S.fb.sent?"Avaliação enviada ✓":"Enviar avaliação"}</button></section>
 <section class="box"><h3>Fontes</h3><ol class="fontes">${ORD.map(k=>{const f=FONTES[k];return `<li>${esc(f.t)} · <a href="${f.u}" target="_blank" rel="noopener">abrir</a></li>`}).join("")}</ol>
 <button class="go alt" data-go="0">Voltar ao início</button></section>
 <div class="nav"><button data-nav="-1">‹ voltar</button></div>`}

const R={prato,produtor,pizza,medida,pesquisas,saude};
function render(){S.i=Math.max(0,Math.min(T-1,S.i));save();
 if(S.i===0)app.innerHTML=capa();else if(S.i===T-1)app.innerHTML=dots()+fim();else{const c=CAPS[S.i-1];app.innerHTML=dots()+R[c.tipo](c)}
 wire()}
function go(d){S.i+=d;render();scrollTo(0,0)}
function setMix(id){S.mix=id;if(!S.tried.includes(id))S.tried.push(id);save();render()}
function wire(){
 const en=document.getElementById("env");if(en)en.onclick=()=>{S.fb.sent=true;try{const q=JSON.parse(localStorage.getItem("pmu-fila")||"[]");q.push({curso:"agro-e-prato",quando:new Date().toISOString(),voto:S.vote,...S.fb});localStorage.setItem("pmu-fila",JSON.stringify(q))}catch(x){}save();en.textContent="Avaliação enviada ✓"};
 ["apr","com","tema"].forEach(k=>{const e=document.getElementById(k);if(e)e.oninput=()=>{S.fb[k]=e.value;save()}});
 const l=document.getElementById("lado");if(l)l.onchange=()=>{S.fb.lado=l.value;save()};
 /* arrastar para o prato */
 app.querySelectorAll(".chip").forEach(ch=>{ch.onpointerdown=e=>{const plate=document.getElementById("plate");let g=null,sx=e.clientX,sy=e.clientY,moved=false;
  const mv=ev=>{if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>8){moved=true;g=document.createElement("div");g.className="ghost";g.textContent=ch.textContent;document.body.appendChild(g)}
   if(g){g.style.left=ev.clientX-40+"px";g.style.top=ev.clientY-24+"px";const r=plate.getBoundingClientRect();plate.classList.toggle("drop",ev.clientX>r.left&&ev.clientX<r.right&&ev.clientY>r.top&&ev.clientY<r.bottom)}};
  const up=ev=>{removeEventListener("pointermove",mv);removeEventListener("pointerup",up);if(g){g.remove();const r=plate.getBoundingClientRect();plate.classList.remove("drop");if(ev.clientX>r.left&&ev.clientX<r.right&&ev.clientY>r.top&&ev.clientY<r.bottom)setMix(ch.dataset.mix)}else setMix(ch.dataset.mix)};
  addEventListener("pointermove",mv);addEventListener("pointerup",up)}});
}
const pop=document.getElementById("fnpop");
document.addEventListener("click",e=>{const b=e.target.closest(".fn");
 if(b){e.preventDefault();e.stopPropagation();const f=FONTES[b.dataset.f];document.getElementById("fnbody").innerHTML=`<b>Fonte ${N[b.dataset.f]}</b><br>${esc(f.t)}<br><a href="${f.u}" target="_blank" rel="noopener">Abrir a fonte ↗</a>`;pop.style.display="block";return}
 if(pop.style.display==="block"&&(e.target.closest("#fnpop .x")||!e.target.closest("#fnpop"))){pop.style.display="none";if(!e.target.closest("button,a"))return}
 const km=e.target.closest("[data-mix]");if(km&&e.detail===0){setMix(km.dataset.mix);return}
 const t=e.target.closest("[data-go],[data-nav],[data-bar],[data-fat],[data-med],[data-card],[data-k],[data-n]");if(!t)return;const d=t.dataset;
 if(d.go!=null){S.i=+d.go;render();scrollTo(0,0)}
 else if(d.nav!=null)go(+d.nav);
 else if(d.bar!=null){S.bar=+d.bar;save();render()}
 else if(d.fat!=null){S.fat=+d.fat;save();render()}
 else if(d.med!=null){S.med=+d.med;save();render()}
 else if(d.card!=null){const j=+d.card;if(!S.cards.includes(j))S.cards.push(j);else S.cards=S.cards.filter(x=>x!==j);save();render()}
 else if(d.k!=null){S.vote=+d.k;save();app.querySelectorAll(".opt").forEach(x=>{x.classList.toggle("on",x===t);x.setAttribute("aria-pressed",x===t)});document.getElementById("vcd").innerHTML=vcard(S.vote)}
 else if(d.n!=null){S.fb.nota=+d.n;save();app.querySelectorAll("[data-n]").forEach(x=>x.classList.toggle("on",x===t))}
},true);
document.addEventListener("keydown",e=>{if(e.key==="Escape")pop.style.display="none";const m=e.target.closest&&e.target.closest("[data-card]");if(m&&(e.key==="Enter"||e.key===" ")){e.preventDefault();m.click()}});
render();
</script>
</body></html>
