 return {route:2,i:0,pts:0,ans:{},eff:{carla:0,rafael:0,dalia:0,antonio:0},mute,fb:{}};

if(!S.route && (S.i>0 || S.ans.palpite)) {
 T=[...stages.slice(1,7),stages[0],...stages.slice(7)];
} else {
 S.route=2;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* som */
let AC=null;function snd(t){if(S.mute)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);const f={ok:[660,990],no:[300,200],tap:[520,520],win:[523,1046]}[t]||[440,440];o.frequency.setValueAtTime(f[0],AC.currentTime);o.frequency.linearRampToValueAtTime(f[1],AC.currentTime+.15);g.gain.setValueAtTime(.08,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.25);o.start();o.stop(AC.currentTime+.26)}catch(e){}}
function addPts(n){S.pts+=n;save()}
/* cidade */

 return `<svg class="city" viewBox="0 0 350 112" role="img" aria-label="A cidade: escola, fundo, restaurante e posto de saúde">

 <g class="${dim('rafael')}"><rect x="96" y="30" width="64" height="66" fill="#fff" stroke="#163238" stroke-width="2"/><path d="M106 80l12-12 10 8 20-22" stroke="#2E6B66" stroke-width="3" fill="none"/><text x="128" y="46" font-size="10" text-anchor="middle" fill="#163238" font-weight="700">FUNDO</text></g>
 <g class="${dim('dalia')}"><rect x="178" y="56" width="70" height="40" fill="#F7D2C4"/><rect x="174" y="46" width="78" height="12" rx="3" fill="#163238"/><rect x="190" y="70" width="18" height="26" fill="#fff"/><text x="213" y="54.5" font-size="8.5" text-anchor="middle" fill="#fff" font-weight="700">RESTAURANTE</text></g>

 app.innerHTML=`<div class="top"><div class="toprow"><span class="t">Gastos, dívida e juros</span><span>⭐ ${S.pts} pontos</span><button class="iconbtn" id="mute" aria-label="${S.mute?'Ligar som':'Desligar som'}">${S.mute?'🔇':'🔊'}</button></div><div class="prog"><i style="width:${pct}%"></i></div></div>${city()}<main>${inner}</main>`;
 document.getElementById("mute").onclick=()=>{S.mute=!S.mute;save();render()};window.scrollTo(0,0)}

 }
 case "poll":{h+=`<h2>${t.h}</h2>`+t.o.map((o,k)=>`<button class="opt ${A.v===k?'on':''}" data-k="${k}">${o}</button>`).join("");if(A.v!=null)h+=`<div class="fb">${t.fb}</div>`;h+=nav(A.v!=null);frame(h);

 case "order":{if(!A.cur){A.cur=[2,4,0,3,1];S.ans[t.id]=A}

  const c=document.getElementById("chk");if(c)c.onclick=()=>{const ok=A.cur.every((ix,p)=>ix===p);A.ok=ok;A.done=true;A.cur=[0,1,2,3,4];if(ok){addPts(10);snd("ok")}else snd("no");save();render()};bindNext();break}

  if(ch!=null&&!A.seen){const o=t.o[ch];if(o.first){h+=`<div class="box"><b>${t.pq}</b><div class="pick">${Object.keys(CH).map(k=>`<button data-p="${k}">${CH[k].n}</button>`).join("")}<button data-p="ninguem">Ninguém, por enquanto</button></div></div>`}else{h+=`<button class="btn" id="see">Ver o que acontece</button>`}}

   const others=t.o.map((x,k)=>k===ch?"":`<li><b>${x.t}:</b> ${src(x.txt)}</li>`).join("");h+=`<details class="box"><summary><b>E se tivesse escolhido outra?</b></summary><ul class="list">${others}</ul></details>`}

  bindNext();break}
 case "snow":{h+=`<h2>${t.h}</h2><div class="box"><svg class="snow" viewBox="0 0 320 130" role="img" aria-label="Bola de neve descendo uma ladeira"><polygon points="0,30 320,120 0,120" fill="#DCE9FF"/><line x1="0" y1="30" x2="320" y2="120" stroke="#163238" stroke-width="2"/><g style="animation:roll 3s ease-in infinite alternate;transform-origin:40px 30px"><circle cx="40" cy="22" r="16" fill="#fff" stroke="#163238" stroke-width="2"/></g><text x="200" y="40" font-size="12" fill="#163238" font-weight="700">juros: a bola cresce</text><text x="160" y="110" font-size="12" fill="#163238" font-weight="700">crescimento: a ladeira aumenta</text></svg>${t.b}</div>`+nav(true);frame(h);bindNext();break}
 case "sim":{const PRE=[{n:"Juros altos, crescimento baixo",r:7,g:1,s:-0.5},{n:"Juros menores, crescimento maior",r:3,g:3,s:0.5}];const v=S.sim||{...PRE[0]};S.sim=v;

  if(A.v!=null)h+=`<div class="fb"><b>${A.v===0?"✅ Essa é a mais forte! +10":"A mais forte é a que usa fatos."}</b>${src(t.e)}</div>`;h+=nav(A.v!=null);frame(h);
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{A.v=+b.dataset.k;if(A.v===0){addPts(10);snd("ok")}else snd("no");save();render()});bindNext();break}
 case "quiz":{A.r=A.r||[];h+=`<h2>${t.h}</h2><div class="box">${t.b}</div>`+t.qs.map((q,k)=>{const r=A.r[k];return `<div class="box"><b>${k+1}. ${q.q}</b>${q.o.map((o,j)=>{let c="";if(r!=null)c=j===q.a?"ok":j===r?"no":"";return `<button class="opt ${c}" data-q="${k}" data-j="${j}" ${r!=null?"disabled":""}>${o}</button>`}).join("")}${r!=null?`<p class="small">${r===q.a?"✅ +10. ":""}${q.e}</p>`:""}</div>`}).join("");
  const done=t.qs.every((_,k)=>A.r[k]!=null);h+=nav(done,"Ver meu resultado");frame(h);
  app.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{const k=+b.dataset.q,j=+b.dataset.j;A.r[k]=j;S.ans[t.id]=A;if(j===t.qs[k].a){addPts(10);snd("ok")}else snd("no");save();const y=window.scrollY;render();window.scrollTo(0,y)});bindNext();break}
 case "recap":{const D=["d1","d2","d3"].map(id=>{const tt=T.find(x=>x.id===id);const a=S.ans[id];return a&&a.v!=null?tt.o[a.v].t:"(sem escolha)"});
  const lab=k=>{const v=S.eff[k];return v>0?`<span class="st up">▲ saiu ganhando</span>`:v<0?`<span class="st dn">▼ saiu perdendo</span>`:`<span class="st">= ficou igual</span>`};
  h+=`<h2>${t.h}</h2><p class="small">No exemplo simplificado deste curso:</p><div class="box"><b>Suas escolhas</b><ol class="list"><li>${D[0]}</li><li>${D[1]}</li><li>${D[2]}</li></ol></div><div class="chars">${Object.keys(CH).map(k=>`<div class="ch"><span class="av" style="background:${CH[k].c}">${CH[k].e}</span><span><b>${CH[k].n}</b>${lab(k)}<small>${CH[k].r}</small></span></div>`).join("")}</div><div class="fb"><b>💡 Outro caminho, outros ganhadores</b>Com escolhas diferentes, outras pessoas da cidade sairiam ganhando ou perdendo. Não existe escolha sem custo: existe escolher quem paga, e quando.</div>`+nav(true);frame(h);bindNext();break}
 case "compare":{const p0=S.ans.palpite?S.ans.palpite.v:null;const P=stages.find(stage=>stage.id==="palpite").o;h+=`<h2>${t.h}</h2><div class="box">No começo, você disse: <b>${p0!=null?P[p0]:"(sem palpite)"}</b>.<br>Se o governo gastasse menos, a sua vida ficaria melhor ou pior?</div>`+P.map((o,k)=>`<button class="opt ${A.v===k?'on':''}" data-k="${k}">${o}</button>`).join("");
  h+=`<div class="box"><b>O que mudaria a sua opinião?</b> <span class="small">(opcional)</span><textarea id="why" rows="3" placeholder="Escreva aqui...">${esc(A.why||"")}</textarea></div>`;
  if(A.v!=null)h+=`<div class="fb">${A.v===p0?"Você manteve o palpite, agora sabendo quem paga cada escolha.":"Você mudou de ideia. Mudar com informação nova é pensar mais uma."}</div>`;h+=nav(A.v!=null);frame(h);
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{A.v=+b.dataset.k;A.why=document.getElementById("why").value;S.ans.compare=A;save();snd("tap");render()});
  document.getElementById("why").oninput=e=>{A.why=e.target.value;S.ans.compare=A;save()};bindNext();break}
 case "end":{
  const MAXPTS=10+10+20+40+10+30+(S.ans.d1?.p!=null?10:0);
  const pct=S.pts/MAXPTS;const st=pct>=.9?3:pct>=.6?2:1;if(!S.won){S.won=true;save();snd("win")}
  const pd=S.ans.pdia||{},vt=S.ans.voto||{},F=S.fb||{};
  h+=`<h2>${t.h}</h2><div class="box" style="text-align:center"><div class="stars">${"⭐".repeat(st)}${"☆".repeat(3-st)}</div><p><b>${S.pts} de ${MAXPTS} pontos</b></p><p class="small">Os pontos vêm das previsões e dos testes. Nas decisões, não existe escolha certa.</p></div>
  <div class="box"><p class="kicker">Pergunta do dia</p><b>Quem aprova o orçamento do governo federal todo ano?</b>${["O Congresso Nacional","O Banco Central","O Tesouro Nacional"].map((o,k)=>{let c="";if(pd.v!=null)c=k===0?"ok":k===pd.v?"no":"";return `<button class="opt ${c}" data-pd="${k}" ${pd.v!=null?"disabled":""}>${o}</button>`}).join("")}${pd.v!=null?`<p class="small">O Congresso Nacional. O governo envia a proposta, e deputados e senadores votam e podem mudar o texto. ${src("[[cf]]")}</p>`:""}</div>
  <div class="box"><p class="kicker">Vote no próximo tema</p>${["Inflação: por que os preços sobem?","Reforma tributária: quem vai pagar mais?","Previdência: a conta fecha?"].map((o,k)=>`<button class="opt ${vt.v===k?'on':''}" data-vt="${k}">${o}</button>`).join("")}${vt.v!=null?`<p class="small">Voto registrado. Obrigado!</p>`:""}</div>
  <div class="box"><p class="kicker">Avalie o curso</p><b>Que nota você dá?</b><div class="rate">${[1,2,3,4,5].map(n=>`<button class="${F.nota===n?'on':''}" data-n="${n}">${n}</button>`).join("")}</div>
  <p><b>Sentiu que o curso favoreceu algum lado?</b></p><select id="lado"><option value="">Escolha</option>${["Não","Sim, a esquerda","Sim, a direita","Não sei"].map(o=>`<option ${F.lado===o?"selected":""}>${o}</option>`).join("")}</select>
  <p><b>O que você aprendeu que não sabia?</b></p><textarea id="aprendi" rows="2">${esc(F.aprendi||"")}</textarea>
  <p><b>Que tema você quer que vire curso?</b></p><textarea id="tema" rows="2">${esc(F.tema||"")}</textarea>
  <button class="btn" id="env">${F.sent?"Avaliação enviada ✓":"Enviar avaliação"}</button></div>
  <div class="box"><p class="kicker">Fontes deste curso</p><ul class="fontes">${Object.values(FONTES).map(f=>`<li>${esc(f.t)}${f.u?` · <a href="${f.u}" target="_blank" rel="noopener">abrir</a>`:""}</li>`).join("")}</ul></div>
  <div class="box small"><b>Quer se aprofundar?</b><br>📘 "Economia: modo de usar", de Ha-Joon Chang: uma visão crítica do livre mercado.<br>📗 "Economia básica", de Thomas Sowell: uma visão a favor do livre mercado.<br>▶️ <a href="https://www.youtube.com/results?search_query=d%C3%ADvida+p%C3%BAblica+juros+explicado" target="_blank" rel="noopener">Buscar vídeos sobre dívida pública no YouTube</a></div>
  <button class="btn ghost" id="again">Jogar de novo</button>`;frame(h);
  app.querySelectorAll("[data-pd]").forEach(b=>b.onclick=()=>{S.ans.pdia={v:+b.dataset.pd};snd(+b.dataset.pd===0?"ok":"no");save();render()});
  app.querySelectorAll("[data-vt]").forEach(b=>b.onclick=()=>{S.ans.voto={v:+b.dataset.vt};save();snd("tap");render()});
  app.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{S.fb.nota=+b.dataset.n;save();render()});
  document.getElementById("lado").onchange=e=>{S.fb.lado=e.target.value;save()};
  document.getElementById("aprendi").oninput=e=>{S.fb.aprendi=e.target.value;save()};
  document.getElementById("tema").oninput=e=>{S.fb.tema=e.target.value;save()};
  document.getElementById("env").onclick=()=>{S.fb.sent=true;try{const q=JSON.parse(localStorage.getItem("pmu-fila")||"[]");q.push({curso:"economia",quando:new Date().toISOString(),...S.fb,voto:S.ans.voto});localStorage.setItem("pmu-fila",JSON.stringify(q))}catch(e){}save();render()};
  document.getElementById("again").onclick=()=>{S=freshState(S.mute);T=stages;save();render()};break}
 }}
function hits(o){const k=Object.keys(o.eff).filter(x=>o.eff[x]!==0);return k.length?k:['ninguem']}
function sumEff(a,b){const o={...a};for(const k in b)o[k]=(o[k]||0)+b[k];return o}
function applyEff(e){for(const k in e)S.eff[k]=Math.max(-2,Math.min(2,(S.eff[k]||0)+e[k]))}
/* popover de fontes */
const pop=document.getElementById("fnpop");
document.addEventListener("click",e=>{const b=e.target.closest(".fn");if(b){e.preventDefault();e.stopPropagation();const f=FONTES[b.dataset.f];if(!f)return;document.getElementById("fnbody").innerHTML=`<b>Fonte</b><br>${esc(f.t)}${f.u?`<br><a href="${f.u}" target="_blank" rel="noopener">Abrir a fonte ↗</a>`:""}`;pop.style.display="block";return}
 if(e.target.closest("#fnpop .x")||!e.target.closest("#fnpop"))pop.style.display="none"},true);
render();
</script>
</body></html>
