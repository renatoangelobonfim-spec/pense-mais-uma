{id:"tel",k:"CASO 1 DE 6 · TELEFONE",t:"A fila de anos por uma linha",lugar:"Brasil, 1998",
 story:[

  "Em 29 de julho de 1998, o governo vendeu o Sistema Telebrás em 12 leilões e arrecadou R$ 22 bilhões, 63% acima do preço mínimo. [[bndes_tel]]",
  "Vinte anos depois, o país tinha 235,5 milhões de linhas de celular, mais do que habitantes. [[istoe_tel]]"],
 recibos:[{h:"LINHA DE TELEFONE",a:"1998",b:"2018",la:"ESTATAL",lb:"PRIVATIZADA",linhas:[["Linhas fixas","17 mi","40,8 mi","istoe_tel"],["Celulares","4,6 mi","235,5 mi","istoe_tel"],["Assinatura mensal*","R$ 13,82","R$ 19,77","sesc_tel"]],obs:"* de julho de 1998 a 2001, sem correção pela inflação"}],
 nota:"Antes e depois não prova causa: o celular também se espalhou pelo mundo nessa época.",

 con:"O Idec apontou que a assinatura subiu 42,5% em três anos, bem acima da inflação, e as reclamações no Procon-SP subiram 68% (jan–ago/2001 contra todo o ano de 2000). [[sesc_tel]] Críticos também lembram que a lei da privatização ignorou a banda larga. [[abr_tel]]",
 vai:{p:"Depois da privatização da Telebrás, as linhas fixas mais que dobraram e os celulares passaram de 4,6 milhões para 235,5 milhões em 20 anos.",d:"Quanto da melhora veio da privatização e quanto veio da tecnologia, que avançou no mundo todo."}},
{id:"vale",k:"CASO 2 DE 6 · VALE",t:"Vendida barata ou bem administrada?",lugar:"Brasil, 1997",
 story:[
  "Em 6 de maio de 1997, o governo vendeu o controle da Vale do Rio Doce por cerca de R$ 3,3 bilhões. [[cut_vale]] Pelo preço do leilão, a empresa inteira valia R$ 12,5 bilhões. [[bdf_vale12]]",
  "Só em 2021, a Vale lucrou R$ 121 bilhões. [[bdf_121]] Desde a privatização, distribuiu pelo menos US$ 208 bilhões aos acionistas. [[bdf_208]]",
  "Duas barragens romperam depois da venda: Mariana, em 2015, com 19 mortos, de uma empresa da Vale com a BHP [[agmin_mar]], e Brumadinho, em 2019, com 272 mortos. [[mg_bru]]"],
 recibos:[{h:"QUANTO VALIA A VALE",a:"1997",b:"2021–22",la:"NA VENDA",lb:"DEPOIS",linhas:[["Valor da empresa","R$ 12,5 bi","R$ 452 bi","bdf_vale12 cut_vale"],["Lucro no ano (1997 e 2021)","R$ 756 mi","R$ 121 bi","monitor_vale bdf_121"]],obs:"1997: ano do leilão (maio); a Vale já era privada em 8 dos 12 meses. Valores sem correção pela inflação"}],
 nota:"O minério de ferro, principal produto da Vale, subiu 750% de 2003 a 2010, puxado pela China, o que valorizou também mineradoras sempre privadas, como a Rio Tinto. [[puc_vale]]",
 pro:"Os economistas Vinicius Carrasco e João Manoel Pinho de Mello (PUC-Rio) compararam a Vale com a Rio Tinto, sempre privada, para descontar o efeito do minério, e concluíram que a gestão privada adicionou enorme valor à empresa. [[puc_vale]] A Vale diz ter pago US$ 4,25 bilhões em impostos e royalties no Brasil só em 2019. [[vale_fiscal]]",
 con:"Quem critica diz que a empresa foi vendida a preço baixo, por menos do que ela passou a lucrar em um só ano, e que os acionistas ficaram com a maior parte dos ganhos. [[bdf_121]] [[bdf_208]] As tragédias de Mariana e Brumadinho levaram a acordos de reparação de R$ 170 bilhões e R$ 37,68 bilhões. [[agmin_mar]] [[mg_bru]]",
 vai:{d:"Se a Vale foi vendida barata ou se valorizou por causa da gestão privada e do minério.",n:"Se uma Vale estatal teria evitado os rompimentos de Mariana e Brumadinho."}},
{id:"trem",k:"CASO 3 DE 6 · TRENS BRITÂNICOS",t:"Privatizou, cresceu e agora volta para o Estado",lugar:"Reino Unido, 1994 a 2027",
 story:[
  "O Reino Unido privatizou a operação dos trens a partir de 1994/95. Em 20 anos, as viagens mais que dobraram. [[dft15]]",
  "Mas as passagens subiram acima da inflação: em 2018, estavam 20% mais caras do que em 1995, descontada a inflação. [[commons_fares]]",
  "Em 2024, o governo trabalhista decidiu trazer as operadoras de volta conforme os contratos vencem. Em setembro de 2026, 10 das 14 operadoras inglesas já eram públicas, e o plano termina no fim de 2027. [[gov_chil]] O plano não promete baixar as passagens [[express_fares]], mas em março de 2026 as passagens reguladas foram congeladas na Inglaterra. [[orr_fares]]"],
 recibos:[{h:"TREM NO REINO UNIDO",a:"1994/95",b:"2014–18",la:"NA VENDA",lb:"DEPOIS",linhas:[["Viagens por ano","735 mi","1,65 bi","dft15"],["Preço descontada a inflação","100","120","commons_fares"]],obs:"preço: índice, janeiro de 1995 = 100"}],
 nota:"Pela nova lei, a primeira a voltar foi a South Western Railway, em maio de 2025; outras quatro já eram estatais desde 2018–2023, assumidas quando as empresas falharam. [[gov_swr]] [[wiki_dfto]]",
 pro:"Quem defende a privatização lembra que as viagens dobraram e que, segundo a consultoria Oxera, um déficit de £ 800 milhões da British Rail virou superávit com as empresas privadas, como diz a Rail Partners, associação das operadoras. [[dft15]] [[railpartners]]",
 con:"Quem defende a volta ao Estado diz que juntar trilhos e trens numa só empresa pública, a Great British Railways, vai reduzir atrasos e cancelamentos. [[gov_swr]]",
 vai:{p:"No Reino Unido, as viagens de trem mais que dobraram depois da privatização, e as passagens ficaram 20% mais caras acima da inflação até 2018.",n:"Se a volta dos trens britânicos ao Estado vai melhorar o serviço ou baratear as passagens."}},
{id:"agua",k:"CASO 4 DE 6 · ÁGUA",t:"Duas apostas: Sabesp e Thames Water",lugar:"São Paulo, 2024 · Londres, 1989",
 story:[

  "O contrato prevê cerca de R$ 70 bilhões em investimentos para levar água e esgoto a todos até 2029. [[semil_univ]]",
  "Do outro lado do oceano, a Thames Water, de Londres, foi privatizada em 1989 quase sem dívidas. [[openedu]] [[wiki_thames]] Em 2026, devia mais de £ 20 bilhões e lutava para não ser assumida pelo governo. [[hl_thames]]"],
 recibos:[
  {h:"SABESP",a:"2024",b:"2025–26",la:"ANTES",lb:"DEPOIS",linhas:[["Parte do governo","50,3%","18%","isto_sab"],["Investimento jan–set","base","+151%","semil_tar"],["Reajuste da tarifa","—","+6,11%","semil_tar"]],obs:"reajuste de jan/2026: repõe a inflação (IPCA) de jul/2024 a out/2025"},
  {h:"THAMES WATER",a:"1989–91",b:"2025–26",la:"INÍCIO",lb:"HOJE",linhas:[["Dívida","quase nenhuma*","> £ 20 bi","openedu hl_thames"],["Multa do regulador","—","£ 122,7 mi","lbc_fine"],["Conta de água","—","+31%","lbc_fine"]],obs:"* em 1990/91, já privada, a dívida equivalia a 7% do capital; conta: aumento médio de abril de 2025"}],

{id:"luz",k:"CASO 5 DE 6 · ENERGIA",t:"Eletrobras: a empresa mudou, e a conta de luz?",lugar:"Brasil, 2022",
 story:[
  "Em junho de 2022, a Eletrobras foi privatizada numa operação de R$ 34 bilhões. [[b3_el]] O governo ficou com 43% das ações, mas com voto limitado a 10%. [[isto_acordo]]",

{id:"cor",k:"CASO 6 DE 6 · CORREIOS",t:"Vender, socorrer ou reinventar?",lugar:"Brasil, 2021 a 2026",
 story:[
  "Os Correios estão em praticamente todos os municípios do país. [[correios24]] Em 2021, a Câmara aprovou um projeto para privatizar a empresa, mas ele travou no Senado; em 2023, o governo Lula tirou os Correios da lista de privatizações. [[suno_cor23]]",
  "Em 2021, a estatal teve lucro de R$ 3,7 bilhões, o maior em 22 anos, segundo a empresa. [[abr_cor21]] Desde o fim de 2022, só registra prejuízo: em 2025, foram R$ 8,5 bilhões. [[folhape_cor]]",
  "No fim de 2025, a empresa pegou R$ 12 bilhões emprestados com cinco bancos, com garantia da União: se ela não pagar, o governo paga. [[gp_cor25]] O plano de reestruturação prevê fechar cerca de mil agências e um programa de demissão voluntária. [[istoe_plano]]"],
 recibos:[{h:"CORREIOS EM DOIS ANOS",a:"2021",b:"2025",la:"MAIOR LUCRO EM 22 ANOS",lb:"CRISE",linhas:[["Resultado do ano","+R$ 3,7 bi","−R$ 8,5 bi","abr_cor21 gp_cor25"],["Empréstimo com garantia da União","—","R$ 12 bi","gp_cor25"]],obs:"Valores sem correção pela inflação. Os Correios não foram privatizados: aqui o antes e depois é da própria estatal"}],
 nota:"O que pesou em 2025: as encomendas internacionais caíram 65,6%, depois da mudança na tributação de compras de baixo valor e da entrada de concorrentes privados [[monitor_cor]] [[tb_cor]]; grandes lojas online passaram a fazer as próprias entregas [[abr_cor26]]; o custo operacional também pesou; e R$ 6,4 bilhões foram para processos judiciais, boa parte trabalhistas. [[gp_cor25]] [[dp_cor]] Quanto disso vem da gestão estatal e quanto vem do mercado é justamente o que está em debate.",
 pro:"O jurista Fernando Vernalha diz que empréstimos e reestruturação só aliviam sintomas e defende abrir o setor à competição, com regras para os serviços que precisam chegar a todos. [[vernalha]] O economista Alex Agostini, da Austin Rating, defende passar parte da operação à iniciativa privada por concessão. [[agostini]]",
 con:"Lula diz que, enquanto for presidente, não haverá privatização, só parcerias ou economia mista. [[lula_cor]] O economista Roberto Troster diz que dá para reinventar a empresa sem vender e que, sem regras, um comprador ficaria só com a parte lucrativa e deixaria de atender o interior, onde a entrega é mais cara. [[troster]]",
 vai:{d:"Se o prejuízo vem da gestão estatal ou de mudanças no mercado, como as lojas online fazendo as próprias entregas.",n:"Quem atenderia, e a que preço, as cidades onde a entrega dá prejuízo, se a empresa fosse vendida."}}
];

const VOTO=[
 {t:"Privatizar mais",s:"como Correios e outras estatais",pro:"Quem defende cita a fila de anos pelo telefone que acabou com a competição e o salto de investimento na ex-Eletrobras. [[istoe_tel]] [[neofeed]]",con:"Quem critica cita a Thames Water, endividada e multada depois de privatizada, e as passagens de trem britânicas mais caras. [[hl_thames]] [[commons_fares]]"},
 {t:"Manter as estatais estratégicas",s:"como Petrobras e bancos públicos",pro:"Quem defende diz que, sem o controle, o governo perde instrumentos para influenciar preços e tarifas, como críticos dizem da Eletrobras. [[carta_el]]",con:"Quem critica lembra que, com a Telebrás estatal, uma linha chegava a custar US$ 5 mil e a espera levava anos. [[istoe_tel]]"},
 {t:"Depende do setor e das regras",s:"privatizar onde há concorrência e contrato com metas",pro:"Quem defende lembra que, para Eduardo Tude, o que acabou com as filas foi a competição, e que a Sabesp foi vendida com metas e golden share. [[istoe_tel]] [[mt_golden]]",con:"Quem critica lembra que a Thames Water também tinha regulador e licença, e mesmo assim acumulou dívida e multas. [[lbc_fine]] [[yahoo_helm]]"},
 {t:"Trazer alguns serviços de volta ao Estado",s:"como o Reino Unido faz com os trens",pro:"Quem defende diz que uma empresa pública única, como a Great British Railways, reduz atrasos e cancelamentos. [[gov_swr]]",con:"Quem critica diz que não há evidência clara de que a estatização funcione e que, no caso da Thames, assumir a empresa pode custar caro ao contribuinte. [[railpartners]] [[cityam]]"}
];

const KEY="pmu-privatizar-v1";let S;try{S=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){S=null}if(!S)S={vote:null,fb:{},seen:[]};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const N={},ORD=[];const num=k=>{if(FONTES[k]&&!(k in N)){ORD.push(k);N[k]=ORD.length}};
const COVER_SRC=["suno_df","agorarn_df"];COVER_SRC.forEach(num);
CASOS.forEach(c=>{JSON.stringify(c.story).replace(/\[\[([a-z0-9_]+)\]\]/g,(m,k)=>num(k));c.recibos.forEach(r=>r.linhas.forEach(l=>l[3].split(" ").forEach(num)));JSON.stringify([c.nota,c.pro,c.con]).replace(/\[\[([a-z0-9_]+)\]\]/g,(m,k)=>num(k))});
JSON.stringify(VOTO).replace(/\[\[([a-z0-9_]+)\]\]/g,(m,k)=>num(k));
const sup=k=>FONTES[k]?`<sup><button type="button" class="fn" data-f="${k}" aria-label="Fonte ${N[k]}: ${esc(FONTES[k].s)}">${N[k]}</button></sup>`:"";
const tx=h=>esc(h).replace(/\s*\[\[([a-z0-9_]+)\]\]/g,(m,k)=>sup(k));
const COL={p:"PROVADO",d:"EM DISPUTA",n:"NINGUÉM SABE"};
function recibo(r,ci,ri){const id=`sw-${ci}-${ri}`;
 return `<div class="rc b"><div class="tk" id="tk-${ci}-${ri}"><div class="h"><span>${esc(r.h)}</span><span id="${id}-yr">${esc(r.a)}</span></div>
 ${r.linhas.map(l=>`<div class="r"><span>${esc(l[0])}</span><span class="v"><s>${esc(l[1])} → </s><em data-a="${esc(l[1])}" data-b="${esc(l[2])}">${esc(l[1])}</em>${l[3].split(" ").map(sup).join("")}</span></div>`).join("")}
 ${r.obs?`<div class="obs">${esc(r.obs)}</div>`:""}</div>
 <button class="sw" id="${id}" role="switch" aria-checked="false" data-c="${ci}" data-r="${ri}" aria-label="Virar o recibo ${esc(r.h)}: ${esc(r.la||"antes")} ou ${esc(r.lb||"depois")}"><i></i><span class="a">${esc(r.la||"ANTES")} · ${esc(r.a)}</span><span class="b">${esc(r.lb||"DEPOIS")} · ${esc(r.b)}</span></button></div>`}
function caso(c,i){return `<section class="caso" id="c${i}" data-i="${i}"><div class="k">${esc(c.k)}</div><h2>${esc(c.t)}</h2><div class="lugar">${esc(c.lugar)}</div>
 ${c.story.map(p=>`<p class="b">${tx(p)}</p>`).join("")}
 ${c.recibos.map((r,ri)=>recibo(r,i,ri)).join("")}${i===0?`<p class="hint">↑ toque na chave para virar o recibo</p>`:""}
 <div class="nota b">${tx(c.nota)}</div>
 <div class="duo b"><div><b>QUEM DEFENDE A PRIVATIZAÇÃO DIZ</b>${tx(c.pro)}</div><div><b>QUEM CRITICA DIZ</b>${tx(c.con)}</div></div></section>`}
function board(){const L={p:[],d:[],n:[]};CASOS.forEach((c,i)=>Object.entries(c.vai).forEach(([k,t])=>L[k].push([t,i+1])));
 return `<section class="board" id="balanco"><div class="k">O BALANÇO</div><h2>O que os cinco recibos mostram</h2>
 <p>Os resultados variaram de caso para caso. O que está provado não decide a questão sozinho: a escolha também depende de valores.</p>
 ${["p","d","n"].map(k=>`<div class="col ${k} b"><div class="h"><span>${COL[k]}</span><span>${L[k].length}</span></div><ul>${L[k].map(([t,n])=>`<li>${esc(t)} <small>CASO ${n}</small></li>`).join("")}</ul></div>`).join("")}
 <section class="box" id="voto"><div class="k">E você?</div><h3>Se a decisão fosse sua</h3><p>Não existe resposta certa e não vale nota. Toque numa opção para ver os dois lados.</p>
 ${VOTO.map((o,k)=>`<button class="vt ${S.vote===k?"on":""}" data-k="${k}"><b>${esc(o.t)}</b><small>${esc(o.s)}</small></button>`).join("")}<div id="vcd"></div></section>
 <section class="box"><h3>Quer se aprofundar?</h3><p><b>Privatize já</b>, de Rodrigo Constantino: a defesa de vender estatais no Brasil.<br><br><b>O Estado empreendedor</b>, de Mariana Mazzucato: a defesa do papel do Estado na inovação e na economia.<br><br><a href="https://www.youtube.com/results?search_query=privatiza%C3%A7%C3%A3o+debate+Brasil" target="_blank" rel="noopener">Debates sobre privatização (busca no YouTube)</a><br><a href="https://www.youtube.com/results?search_query=Great+British+Railways+renationalisation" target="_blank" rel="noopener">A volta dos trens britânicos ao Estado (busca no YouTube)</a></p></section>
 <section class="box" id="avaliar"><h3>Avalie o curso</h3><p>Que nota você dá?</p><div class="rate">${[1,2,3,4,5].map(x=>`<button data-n="${x}" class="${S.fb.nota===x?"on":""}" aria-label="Nota ${x}">${x}</button>`).join("")}</div>
 <p style="margin-top:14px">O que você aprendeu que não sabia?</p><textarea id="apr" rows="2">${esc(S.fb.apr||"")}</textarea>
 <p style="margin-top:14px">Sentiu que o curso favoreceu algum lado?</p><select id="lado"><option value="">Escolha</option>${["Não","Sim, a favor da privatização","Sim, contra a privatização","Não sei"].map(o=>`<option ${S.fb.lado===o?"selected":""}>${o}</option>`).join("")}</select>
 <p style="margin-top:14px">Comentário</p><textarea id="com" rows="2">${esc(S.fb.com||"")}</textarea>
 <p style="margin-top:14px">Que tema você quer que vire curso?</p><textarea id="tema" rows="2">${esc(S.fb.tema||"")}</textarea>
 <button class="go" id="env">${S.fb.sent?"AVALIAÇÃO ENVIADA ✓":"ENVIAR AVALIAÇÃO"}</button></section>
 <section class="box"><h3>Fontes</h3><ol class="fontes">${ORD.map(k=>{const f=FONTES[k];return `<li>${esc(f.t)}${f.u?` · <a href="${f.u}" target="_blank" rel="noopener">abrir</a>`:""}</li>`}).join("")}</ol>
 <button class="go ghost" id="top">VOLTAR AO INÍCIO</button></section></section>`}
function build(){let h=`<section class="cover"><div class="k">Pense Mais Uma · Recibo</div><h1>Privatizar: o serviço melhora ou piora?</h1>
 <p class="lead">Cinco empresas que saíram das mãos do governo, ou estão voltando para ele, e uma estatal em crise que voltou ao debate: os Correios. Cada caso vira um recibo: o que mudou antes e depois, quem defende e quem critica.</p>
 <div class="op"><b>O BRASIL ESTÁ DIVIDIDO · DATAFOLHA, MAR/2023</b><div class="bar"><i class="a" style="width:38%">38% A FAVOR</i><i class="c" style="width:45%">45% CONTRA</i><i class="n" style="width:17%"></i></div>Em 2017, só 20% apoiavam privatizar. ${sup("suno_df")}${sup("agorarn_df")}</div>
 <p class="how">Sem perguntas: leia, vire os recibos e, no fim, veja o balanço. Cerca de 18 minutos. Toque no número pequeno ao lado de um dado para ver a fonte. Dados atualizados em novembro de 2026; a pesquisa Datafolha citada é de março de 2023.</p>
 <a class="go" href="#c0">ABRIR O PRIMEIRO RECIBO</a></section>`;
 h+=CASOS.map(caso).join("")+board();document.getElementById("app").innerHTML=h;
 document.getElementById("td").innerHTML=CASOS.map(()=>"<i></i>").join("")}
build();
function flip(b,on){const ci=b.dataset.c,ri=b.dataset.r,r=CASOS[ci].recibos[ri];b.setAttribute("aria-checked",on?"true":"false");
 const tk=document.getElementById(`tk-${ci}-${ri}`);tk.classList.toggle("on",on);document.getElementById(`${b.id}-yr`).textContent=on?`${r.a} → ${r.b}`:r.a;
 tk.querySelectorAll("em").forEach(e=>e.textContent=on?e.dataset.b:e.dataset.a);
 const key=b.id;if(on&&!S.seen.includes(key)){S.seen.push(key);save()}}
document.querySelectorAll(".sw").forEach(b=>{b.onclick=()=>flip(b,b.getAttribute("aria-checked")!=="true");
 let x0=null;b.addEventListener("touchstart",e=>{x0=e.touches[0].clientX},{passive:true});b.addEventListener("touchend",e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>30){e.preventDefault();flip(b,dx>0)}x0=null})});
const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;e.target.classList.add("in");io.unobserve(e.target)}),{threshold:.12});
document.querySelectorAll(".b").forEach(b=>io.observe(b));
let cur=-1;const io2=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const i=e.target.id==="balanco"?CASOS.length:+e.target.dataset.i;cur=Math.max(cur,i);
 document.getElementById("tl").textContent=e.target.id==="balanco"?"BALANÇO":`CASO ${i+1}/${CASOS.length}`;
 document.querySelectorAll("#td i").forEach((x,j)=>x.classList.toggle("on",j<=Math.min(i,CASOS.length-1)))}}),{rootMargin:"-40% 0px -55% 0px"});
document.querySelectorAll(".caso,#balanco").forEach(s=>io2.observe(s));
document.getElementById("top").onclick=()=>scrollTo({top:0,behavior:"smooth"});
function showVote(){const v=S.vote,el=document.getElementById("vcd");if(v==null){el.innerHTML="";return}const o=VOTO[v];el.innerHTML=`<div class="cd"><i>QUEM DEFENDE DIZ</i>${tx(o.pro)}<i>QUEM CRITICA DIZ</i>${tx(o.con)}</div>`}
showVote();
document.querySelectorAll(".vt").forEach(b=>b.onclick=()=>{S.vote=+b.dataset.k;save();document.querySelectorAll(".vt").forEach(x=>x.classList.toggle("on",x===b));showVote()});
document.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{S.fb.nota=+b.dataset.n;save();document.querySelectorAll("[data-n]").forEach(x=>x.classList.toggle("on",x===b))});
["apr","com","tema"].forEach(k=>document.getElementById(k).oninput=e=>{S.fb[k]=e.target.value;save()});
document.getElementById("lado").onchange=e=>{S.fb.lado=e.target.value;save()};
document.getElementById("env").onclick=e=>{S.fb.sent=true;try{const q=JSON.parse(localStorage.getItem("pmu-fila")||"[]");q.push({curso:"privatizar",quando:new Date().toISOString(),voto:S.vote,...S.fb});localStorage.setItem("pmu-fila",JSON.stringify(q))}catch(x){}save();e.target.textContent="AVALIAÇÃO ENVIADA ✓"};
const pop=document.getElementById("fnpop");
document.addEventListener("click",e=>{const b=e.target.closest(".fn");if(b){e.preventDefault();e.stopPropagation();const f=FONTES[b.dataset.f];if(!f)return;document.getElementById("fnbody").innerHTML=`<b>Fonte ${N[b.dataset.f]}</b><br>${esc(f.t)}${f.u?`<br><a href="${f.u}" target="_blank" rel="noopener">Abrir a fonte ↗</a>`:""}`;pop.style.display="block";return}
 if(e.target.closest("#fnpop .x")||!e.target.closest("#fnpop"))pop.style.display="none"},true);
</script>
</body></html>
