/PMC10712335", "note": "Artigo em inglês que revisa aplicações e críticas ao modelo do estresse de minoria, inclusive sua ampliação para pessoas trans.", "n": 64}, "cfp": {"name": "Conselho Federal de Psicologia · Resolução 01/99, histórico", "year": "consultado em novembro de 2026", "url": "https://site.cfp.org.br/resolucao-01-99/historico/", "note": "A norma de 1999 diz que não cabe a psicólogos oferecer práticas de reversão sexual, porque a homossexualidade não é doença.", "n": 65}, "cura1": {"name": "CartaCapital · STF extingue ação popular e mantém proibição da “cura gay”", "year": "2020", "url": "https://www.cartacapital.com.br/?p=109066", "note": "Relata a ação de psicólogos ligados a grupos religiosos e a decisão de 2017 do juiz que permitia atendimentos “necessários à plena investigação científica”.", "n": 66}, "cura2": {"name": "IBDFAM · STF extingue definitivamente ação contra o Conselho Federal de Psicologia", "year": "2020", "url": "https://ibdfam.org.br/noticias/7315/javascript", "note": "O STF rejeitou por unanimidade o último recurso dos autores e manteve a Resolução 01/1999.", "n": 67}, "badgett": {"name": "M. V. Lee Badgett · The Economic Cost of Stigma and the Exclusion of LGBT People: A Case Study of India (Banco Mundial)", "year": "outubro de 2014", "url": "https://openknowledge.worldbank.org/handle/10986/21515", "note": "Versão final (outubro de 2014): propõe um modelo para estimar o custo do estigma e diz que a pesquisa existente não permite uma estimativa precisa para a Índia; registra que, em 2006, 41% dos indianos não queriam um vizinho homossexual.", "n": 68}, "ibgecas": {"name": "IBGE · Estatísticas do Registro Civil 2024", "year": "10 de dezembro de 2025", "url": "https://agenciadenoticias.ibge.gov.br/agencia-sala-de-imprensa/2012-agencia-de-noticias/noticias/45423-numero-de-divorcios-cai-em-2024-apos-tres-anos-de-alta.html", "note": "Recorde de 12.187 casamentos civis entre pessoas do mesmo sexo em 2024, alta de 8,8% sobre 2023.", "n": 69}, "cas2": {"name": "Diario de Pernambuco · Casamentos voltam a crescer em 2024", "year": "dezembro de 2025", "url": "https://www.diariodepernambuco.com.br/brasil/2025/12/11702557-ibge-casamentos-voltam-a-crescer-em-2024-mas-ainda-nao-retomam-nivel-pre-pandemia.html", "note": "Com dados do IBGE: série iniciada em 2013; uniões entre mulheres foram 64,6% dos casamentos entre pessoas do mesmo sexo em 2024.", "n": 70}, "cvv": {"name": "CVV · Centro de Valorização da Vida", "year": "consultado em novembro de 2026", "url": "https://cvv.org.br/", "note": "Apoio emocional gratuito, 24 horas, pelo telefone 188.", "n": 71}, "unaids": {"name": "UNAIDS · reportagem sobre a apresentação de Lee Badgett no Banco Mundial", "year": "14 de março de 2014", "url": "https://unaids.org/en/resources/presscentre/featurestories/2014/march/20140314homophobia", "note": "Estimativas preliminares: até 1,7% do PIB indiano (até US$ 31 bilhões) por ano, por perda de produtividade e de anos de vida.", "n": 72}, "cnj175": {"name": "Conselho Nacional de Justiça · Resolução nº 175", "year": "14 de maio de 2013", "url": "https://atos.cnj.jus.br/atos/detalhar/1754", "note": "Art. 1º: proíbe as autoridades competentes de recusar habilitação, celebração de casamento civil ou conversão de união estável em casamento entre pessoas do mesmo sexo.", "n": 73}, "abr13": {"name": "Agência Brasil · quase 4 mil casamentos entre pessoas do mesmo sexo em 2013 (em inglês)", "year": "9 de dezembro de 2014", "url": "https://agenciabrasil.ebc.com.br/en/direitos-humanos/noticia/2014-12/brazil-hits-almost-4000-same-sex-marriages-2013", "note": "Com dados do IBGE: 3.701 casamentos civis entre pessoas do mesmo sexo em 2013.", "n": 74}, "starobs": {"name": "Star Observer · O legado de Toonen contra Austrália", "year": "1º de maio de 2009", "url": "https://www.starobserver.com.au/?p=36362", "note": "Relata que o governo da Tasmânia exigiu a demissão de Toonen sob ameaça de cortar verbas do Conselho de Aids, que o governo federal incluiu o direito à privacidade numa lei federal e que a Tasmânia revogou sua lei em 1997.", "n": 75}};
const R=[[{"tag": "Suécia e Nigéria · pesquisa de opinião", "title": "94% de quê, exatamente?", "body": "Em 2019, o Pew, instituto de pesquisa dos EUA, fez a mesma pergunta em 34 países. Entre os entrevistados na Suécia, 94% disseram que a sociedade deveria aceitar a homossexualidade. Na Nigéria, 7% deram essa resposta.", "refs": ["pew"], "prompt": "Ouvir a pergunta inteira", "detail": "A pergunta contrapunha aceitar e rejeitar a homossexualidade. Se a manchete trocar “aceitação da homossexualidade” por “apoio aos direitos trans”, terá mudado o assunto sem fazer outra entrevista. O ano também importa. O próprio Pew encontrou mudanças entre rodadas. No mundo: segundo a ILGA World, federação internacional de organizações LGBTI, 65 países-membros da ONU criminalizavam em 2025 relações sexuais consensuais entre pessoas do mesmo sexo, o primeiro aumento em quase uma década. Em 7 deles, a lei prevê pena de morte; em outros 5, a ILGA diz não haver plena certeza jurídica. Na outra ponta, a mesma ILGA conta 37 países e Taiwan com casamento entre pessoas do mesmo sexo. O Pew Research Center lista 39 lugares em 2025, incluindo Taiwan e o Nepal, onde, segundo o Pew, casais já se casam, mas ainda não há lei de casamento igualitário. Entre eles estão o Brasil, desde 2013, por decisão judicial, e a África do Sul, único na África. As contagens variam porque cada organização usa critérios próprios.", "more": ["pew"], "kind": "estimativa", "kind2": "fato", "more2": ["ilga", "pewm"]}, {"tag": "Países Baixos, Espanha e Turquia · 2026", "title": "Casar e ter reconhecimento legal são a mesma resposta?", "body": "Numa pesquisa on-line feita entre abril e maio de 2026 e publicada em junho, a Ipsos, empresa de pesquisas, somou duas posições num só indicador: apoiar o casamento entre pessoas do mesmo sexo ou outra forma de reconhecimento legal. A média simples de 26 países foi 66%, três pontos abaixo de 2025.", "refs": ["ipsos", "ipsosm"], "prompt": "Abrir os resultados por país", "detail": "Nos Países Baixos e na Espanha, o indicador chegou a 85%. Na Turquia, a 32%. Alguém pode apoiar a união legal e se opor ao casamento. Também seria um erro subtrair esse resultado dos números do Pew de 2019 para medir uma mudança de opinião: a pergunta e os países mudaram. Só o casamento: Países Baixos 80%, Espanha 74%, Turquia 16%. Na mesma pesquisa, o apoio a que atletas trans compitam conforme a identidade de gênero caiu de 32% (2021) para 22% (2026), na média de 23 países, e a oposição foi a visão mais comum em quase todos.", "more": ["ipsos", "pew"], "kind": "estimativa", "kind2": "estimativa"}, {"tag": "Europa · pesquisa de experiência", "title": "Quem solta a mão na rua?", "body": "O levantamento da FRA, agência de direitos da União Europeia, fez uma pergunta a quem vive a situação. No recorte de 2023 comparável a 2019, 54% dos respondentes evitavam andar de mãos dadas com alguém do mesmo sexo por medo de sofrer uma agressão. Em 2019 eram 61%.", "refs": ["fra"], "prompt": "Descobrir quem pôde responder", "detail": "A pesquisa de 2023 recebeu respostas on-line voluntárias de pessoas LGBTIQ com 15 anos ou mais, nos 27 países da UE e em três países candidatos. Para comparar anos, a agência restringiu países e grupos aos presentes nas duas edições. O dado descreve os respondentes desse recorte. Seria preciso outro desenho para estimar a opinião de todos os europeus.", "more": ["fra"], "kind": "estimativa", "kind2": "fato"}, {"tag": "África do Sul e Uganda · duas decisões", "title": "Quem está falando aqui: o Estado ou a população?", "body": "Na África do Sul, a Constituição de 1996 incluiu orientação sexual na cláusula contra discriminação injusta. Em Uganda, em abril de 2024, a Corte Constitucional manteve a maior parte da lei anti-homossexualidade de 2023 e anulou quatro artigos. São decisões em dois países do mesmo continente.", "refs": ["za", "ug"], "prompt": "Cruzar a lei com a pesquisa", "detail": "Na África do Sul, 54% dos entrevistados pelo Pew em 2019 responderam que a sociedade deveria aceitar a homossexualidade. Em Uganda, a lei de 2023 criminaliza a homossexualidade e sua “promoção”. Segundo o comunicado da corte, os juízes consideraram a falta de consenso internacional, a regra da Constituição de Uganda que manda levar em conta as normas socioculturais do país e a aprovação da lei por ampla maioria no Parlamento. Os autores das ações, 22 cidadãos e ativistas, alegavam que ela viola direitos garantidos pela Constituição. No Brasil: em 2019, o STF decidiu, por 8 votos a 3, que homofobia e transfobia devem ser punidas pela Lei do Racismo até o Congresso aprovar lei própria. Para a maioria, o Congresso estava em omissão ao não aprovar lei sobre o tema. A tese diz que a punição não alcança nem restringe a liberdade religiosa, desde que as manifestações não configurem discurso de ódio. Nos votos vencidos, Ricardo Lewandowski sustentou que definir crimes cabe ao Congresso, não ao STF. Na ONU: em 1994, no caso Toonen contra Austrália, o Comitê de Direitos Humanos da ONU concluiu que uma lei da Tasmânia que punia relações sexuais entre homens violava o direito à privacidade previsto no Pacto Internacional sobre Direitos Civis e Políticos, e que a proibição de discriminação por “sexo” inclui a orientação sexual. Desde 2016, o Conselho de Direitos Humanos mantém um especialista independente sobre violência e discriminação por orientação sexual e identidade de gênero; em julho de 2025, renovou o mandato por 29 votos a 15, com 3 abstenções, e o Brasil votou a favor. Nas negociações, o Paquistão, em nome da Organização para a Cooperação Islâmica, chamou o mandato de instrumento para defender “visões controversas”. Em 2024, duas relatoras da ONU divergiram sobre esporte: Reem Alsalem defendeu reservar a categoria feminina a pessoas de sexo biológico feminino, com categorias abertas para as demais; Alexandra Xanthaki defendeu que o direito internacional protege também mulheres trans e intersexo no esporte e que proibições gerais não cumprem esse padrão. O próprio Comitê diz que não é um tribunal, mas que suas decisões são uma interpretação “com autoridade” do Pacto, que os países devem considerar de boa-fé; relatores e especialistas independentes têm mandato para relatar e aconselhar.", "more": ["pew", "za", "ug"], "kind": "fato", "kind2": "estimativa", "more2": ["ado", "ado2"], "more3": ["toonen", "hrc25", "oci", "alsalem", "xanthaki", "gc33", "ohchrsp"]}, {"tag": "Índia · nos autos de um processo", "title": "O que muda quando um formulário só admite duas respostas?", "body": "Em 2014, a Suprema Corte indiana reconheceu o direito à identificação de gênero como masculino, feminino ou terceiro gênero. O julgamento NALSA (sigla do órgão indiano de assistência jurídica gratuita que levou o caso) também reconheceu hijras como terceiro gênero. Hijra é uma comunidade tradicional do sul da Ásia, descrita no acórdão como pessoas nascidas com corpo masculino que deixam de se identificar como homens. Há duas ideias distintas aqui: abrir uma opção e respeitar a identificação da pessoa.", "refs": ["india"], "prompt": "Ler quem participou do caso", "detail": "Laxmi Narayan Tripathy, que se identifica como hijra, entrou no processo e relatou a exclusão vivida desde a infância. A corte registrou o depoimento no parágrafo 10. Ao recontar o caso em português, vale conservar “hijra”: traduzir automaticamente como “pessoa não binária” apagaria o nome que aparece no próprio testemunho.", "more": ["india"], "kind": "fato", "kind2": "fato"}, {"tag": "Juchitán, México · entrevista", "title": "O que se perde ao traduzir muxe?", "body": "Em entrevista de 2016, a ativista e antropóloga Amaranta Gómez Regalado descreveu a vida em Juchitán, no México, como muxe: nome usado pelo povo zapoteca para pessoas que nascem com corpo masculino e se identificam com o gênero feminino, segundo a reportagem. Contou que a mãe a apoiava e, ao mesmo tempo, temia que alguém lhe fizesse mal. A mesma família caberia em duas respostas diferentes a uma enquete sobre aceitação.", "refs": ["muxe"], "prompt": "Escutar a explicação de Amaranta", "detail": "Para Gómez Regalado, a aceitação no istmo de Tehuantepec envolve vizinhos e redes de apoio, além da família. Ela critica a imagem de que toda pessoa muxe traria boa sorte à comunidade. Numa reportagem sobre sua vida, manter a palavra zapoteca e explicar quem a usa preserva algo que uma letra isolada perderia.", "more": ["muxe"], "kind": "opinião atribuída", "kind2": "opinião atribuída"}], [{"tag": "1978 · o nome impresso", "title": "O que dizia a primeira página?", "body": "Em 1978, durante a ditadura, surgiram o jornal Lampião da Esquina e, em São Paulo, o grupo Somos. O grupo adotou a expressão “Afirmação Homossexual”. Uma palavra coletiva podia estampar um jornal, circular entre cidades e reunir pessoas que até então se conheciam pouco.", "refs": ["mem"], "prompt": "Voltar uma década", "detail": "Antes do Lampião, publicações como O Snob já circulavam no Rio de Janeiro na década de 1960. A data de criação de uma organização localiza um modo de se reunir. Para contar quem já escrevia e criava laços antes dela, é preciso olhar também os jornais menores.", "more": ["mem"], "kind": "fato", "kind2": "fato"}, {"tag": "1983 · uma banca dentro do bar", "title": "Quem podia vender um jornal?", "body": "Em 19 de agosto de 1983, ativistas do Grupo de Ação Lésbico-Feminista (GALF) protestaram no Ferro’s Bar, em São Paulo. O conflito envolvia a proibição de vender ali o boletim ChanacomChana. As frequentadoras disputavam o direito de fazer circular um texto escrito por elas.", "refs": ["ferro", "miriam"], "prompt": "Ler a lembrança de uma participante", "detail": "Vinte anos depois, Miriam Martinho explicou à Folha por que a proibição a indignava: “Éramos, afinal, as principais clientes”. Contou também que havia quem temesse ser identificada na cobertura. A presença da imprensa podia dar força ao movimento e, para uma participante, expor sua vida particular.", "more": ["miriam"], "kind": "fato", "kind2": "opinião atribuída"}, {"tag": "Anos 1990 · letreiro e faixa", "title": "GLS e GLBT conviviam na mesma rua", "body": "Em seu estudo sobre São Paulo, Isadora Lins França descreveu o mercado GLS, de gays, lésbicas e simpatizantes, e o movimento GLBT, que nomeava gays, lésbicas, bissexuais, travestis e transexuais. Nos anos 1990, as duas siglas circulavam ao mesmo tempo.", "refs": ["franca"], "prompt": "Trocar o letreiro pela faixa", "detail": "Na análise de França, publicada em 2007, consumo e militância se aproximavam e também disputavam quem representava quem. Na porta de uma festa, o S convidava simpatizantes. Numa reivindicação pública, escrever B e T dava nome a quem fazia parte da coalizão. Uma sequência de siglas por ano esconderia essa diferença de uso.", "more": ["franca"], "kind": "fato", "kind2": "opinião atribuída"}, {"tag": "2008 · plenária nacional", "title": "Por que o L foi para a frente?", "body": "Em 2008, a I Conferência Nacional foi convocada com a sigla GLBT. Na plenária final, os participantes decidiram trocar para LGBT, com a justificativa de dar mais visibilidade às lésbicas. O L já existia no nome anterior. O que mudou foi sua posição e a mensagem pública sobre quem vinha em primeiro lugar.", "refs": ["lgbt"], "prompt": "Rebobinar até o Ferro’s", "detail": "O protesto de 1983 antecede a decisão em 25 anos. Se a abertura de uma exposição trouxer só “em 2008, as lésbicas entraram no movimento”, a primeira vitrine já contradiz a manchete: há um boletim feito por militantes lésbicas e uma mobilização documentada um quarto de século antes.", "more": ["ferro", "lgbt"], "kind": "fato", "kind2": "fato"}, {"tag": "2019 · pesquisa domiciliar", "title": "Quantas pessoas cabem numa pergunta?", "body": "Na Pesquisa Nacional de Saúde de 2019, o IBGE estimou que 2,9 milhões de adultos no Brasil se declaravam homossexuais ou bissexuais. A pergunta era sobre orientação sexual autoidentificada. Informar a idade, o ano e o verbo “declarar” muda o sentido da manchete.", "refs": ["ibge"], "prompt": "Abrir as respostas em branco", "detail": "O IBGE estimou que 3,6 milhões de adultos preferiram não responder. A pesquisa não autoriza distribuir essas pessoas entre orientações por suposição. Tampouco contou toda a população LGBTQIAPN+: alguém pode, por exemplo, ser trans e heterossexual. Uma pergunta sobre orientação não revela sua identidade de gênero: a pesquisa não coletou dados sobre isso, e o próprio IBGE alertou que o número pode estar subestimado por causa do estigma. Violência: não há estatística oficial nacional sobre a motivação desses assassinatos no Brasil, e os números mais citados vêm de organizações do movimento. O Grupo Gay da Bahia contou 257 mortes violentas de pessoas LGBT+ em 2025, a partir de notícias e relatos; a conta inclui homicídios, latrocínios e suicídios, e o grupo alerta para subnotificação. A ANTRA contou 80 assassinatos de pessoas trans em 2025, 34% a menos que em 2024; diz que a queda reflete subnotificação e que o Brasil concentra cerca de 30% dos casos registrados no mundo pela ONG Transgender Europe. Críticos do método do GGB dizem que a lista inclui mortes sem indício de que a vítima foi atacada por ser LGBT: segundo reportagem da Gazeta do Povo de 2019, uma checagem parcial do geneticista Eli Vieira sobre os homicídios de 2017 encontrou motivação homofóbica comprovada em 6% dos casos e nenhuma motivação homofóbica em 42%. Essa checagem trata dos dados de 2017, não dos de 2025. Em checagem de 2018, a Agência Pública lembrou que faltam dados oficiais na maioria dos países, o que impede um ranking mundial. Já o Atlas da Violência 2026, do Ipea e do Fórum Brasileiro de Segurança Pública, usa notificações da rede de saúde: 59.790 casos de violência contra homossexuais e bissexuais entre 2015 e 2024, de todos os tipos, não só assassinatos. Os autores atribuem parte do aumento à melhora dos registros, mas dizem que o tamanho do crescimento sugere mais violência.", "more": ["ibge"], "kind": "estimativa", "kind2": "estimativa", "more2": ["ggb", "antra26", "eli", "publica", "atlas"]}, {"tag": "2025 · um documento de saúde", "title": "Quem decidiu a versão mais longa?", "body": "As diretrizes do Programa Brasil Saudável de 2025 usam LGBTQIAPN+. O glossário explicita assexuais, pansexuais e pessoas não binárias. Também nomeia travestis ao explicar o T. Essa grafia tem autoria, data e função dentro de um programa público.", "refs": ["saude"], "prompt": "Comparar os nomes nas capas", "detail": "A agência europeia intitulou seu relatório de 2024 com LGBTIQ. A conferência brasileira de 2008 escolheu LGBT. As diretrizes brasileiras de 2025 registram LGBTQIAPN+. Para citar um documento, preserve a grafia dele e explique seu alcance. Essas três fontes não estabelecem uma data mundial de entrada de cada letra.", "more": ["fra", "lgbt", "saude"], "kind": "fato", "kind2": "fato"}], [{"tag": "L · G · B · P", "title": "Por quem uma pessoa sente atração?", "body": "Lésbica costuma nomear uma mulher que sente atração por mulheres. Gay costuma nomear um homem que sente atração por homens, e algumas mulheres também usam gay. Bissexual pode nomear quem sente atração por mais de um gênero. Pansexual costuma destacar que o gênero não determina por quem a pessoa pode se interessar.", "refs": ["pf", "stone"], "prompt": "Abrir o arquivo de São Francisco", "detail": "Em 1990, a Conferência Nacional Bissexual reuniu participantes em São Francisco. O acervo da GLBT Historical Society guarda fotos feitas ali por Efrain John Gonzalez. A letra B tem uma história de organização própria. E, no uso contemporâneo, “mais de um gênero” pode incluir pessoas não binárias. Há espaço para sobreposição entre bi e pan. Como cada lado vê: o glossário da Polícia Federal registra que pessoas não binárias também podem se dizer lésbicas. A LGB Alliance, criada no Reino Unido em 2019 por lésbicas, gays e bissexuais, diz que a orientação deles se baseia no sexo e que trocar sexo por gênero apaga a discriminação que sofrem. Em 16 de abril de 2025, a Suprema Corte britânica decidiu que, na Lei de Igualdade do país, sexo significa sexo biológico; segundo o resumo oficial, outra leitura enfraqueceria a proteção por orientação sexual e os espaços só de lésbicas. A corte também afirmou que pessoas trans seguem protegidas contra discriminação.", "more": ["bis", "stone", "pf"], "kind": "fato", "kind2": "fato + opinião atribuída", "more2": ["pf", "lgba", "uksc"]}, {"tag": "T · N", "title": "Quem a pessoa é? Como ela se apresenta?", "body": "Trans reúne pessoas cuja identidade de gênero difere do sexo registrado ao nascer (“atribuído”, no vocabulário dos glossários citados). No Brasil, o T também abriga o nome travesti. Não binária é a pessoa cuja identidade de gênero escapa à classificação exclusiva como homem ou mulher. Uma pessoa pode usar mais de um desses nomes para si.", "refs": ["pf", "stone", "saude"], "prompt": "Ouvir uma fundadora da ASTRAL", "detail": "Em 1992, travestis criaram a ASTRAL (Associação das Travestis e Liberados), no Rio de Janeiro, para enfrentar a violência policial. Em entrevista de 2010, Jovanna Baby lembrou como as detenções impediam que as trabalhadoras da Praça Mauá ganhassem seu sustento. Quando o T aparece numa faixa política, carrega também essa história de organização. Como cada lado vê: os glossários usados no curso definem trans pela identidade de gênero. A filósofa Kathleen Stock, em Material Girls (2021), critica a ideia de que a identidade de gênero pese mais que o sexo biológico em espaços só de mulheres, na saúde e na coleta de dados. A escritora Shon Faye, em The Transgender Issue (2021), descreve a vida trans e defende justiça e solidariedade entre minorias. A declaração católica Dignitas infinita (2024) pede respeito a toda pessoa “independentemente da própria orientação sexual” e critica a “teoria de gênero” e a mudança de sexo. No movimento brasileiro, travestis e transexuais também disputaram o sentido de cada nome. No Brasil: a Matria, associação de mulheres criada em 2023, atua nos três Poderes, inclusive no STF, em defesa de políticas para mulheres baseadas no sexo biológico. Para Celina Lazzari, da Matria, “o dissenso legítimo das mulheres precisava tornar-se visível”. A ANTRA, associação nacional de travestis e transexuais, publicou em 2025, com núcleos universitários e outras entidades, um dossiê que chama a Matria de “lobby antitrans disfarçado de defesa das mulheres e crianças”. Em 2025, o Conselho Federal de Medicina proibiu bloqueadores hormonais e hormônios cruzados para tratar incongruência de gênero em menores de 18 anos e elevou para 21 anos a idade mínima de cirurgias com efeito esterilizador. O relator citou riscos à densidade óssea, ao crescimento e à fertilidade, e revisões semelhantes na Suécia, na Noruega, na Finlândia e na Inglaterra. A ANTRA e o IBRAT (Instituto Brasileiro de Transmasculinidades) contestam a resolução no STF (ADI 7.806): dizem que ela ignora evidências de bem-estar psicológico desses tratamentos e viola a dignidade e o direito à identidade de gênero. Em 2025, a Justiça Federal do Acre suspendeu a norma a pedido do MPF. Em outubro, o ministro Flávio Dino a restabeleceu até o STF decidir o tema. Até setembro de 2026, a ADI não tinha julgamento de mérito.", "more": ["astral"], "kind": "fato", "kind2": "opinião atribuída", "more2": ["pf", "stock", "faye", "dign", "astral"], "more3": ["matria", "antram", "cfm", "adi", "acre", "dino", "adist"]}, {"tag": "Q · um panfleto em inglês", "title": "Quem tem licença para dizer queer?", "body": "No inglês, queer já serviu para insultar. Parte do movimento se apropriou do termo para desafiar normas e reunir experiências diferentes de gênero e sexualidade. Em junho de 1990, o panfleto anônimo Queers Read This! circulou numa marcha do orgulho em Nova York.", "refs": ["stone", "fly"], "prompt": "Mudar quem fala", "detail": "No panfleto, o termo era uma escolha dos autores para falar de si e se dirigir a seus pares. O glossário da Stonewall observa que algumas pessoas ainda o recebem como insulto. Ao traduzir uma entrevista, veja quem escolheu a palavra: reproduzir uma autodescrição e aplicar um rótulo a outra pessoa são gestos diferentes. Como cada lado vê: para os autores do panfleto, chamar-se queer era uma escolha. A LGB Alliance perguntou a seus apoiadores se LGBTQ+ era um nome adequado para a comunidade e, segundo a entidade, a maioria disse que não; o relatório se chama Don’t Call Me Queer (“não me chame de queer”). É uma consulta a apoiadores, não uma amostra de todos os gays e lésbicas.", "more": ["fly", "stone"], "kind": "fato", "kind2": "fato + opinião atribuída", "more2": ["fly", "lgba"]}, {"tag": "I · características sexuais", "title": "O que quer dizer nascer intersexo?", "body": "Intersexo reúne variações nas características sexuais, como cromossomos, hormônios e anatomia, que diferem dos padrões habituais de corpos femininos ou masculinos. Algumas aparecem ao nascer, outras na puberdade, e algumas nunca ficam visíveis. A palavra, sozinha, não informa o gênero nem a orientação da pessoa.", "refs": ["un"], "prompt": "Ler a reivindicação de Malta", "detail": "Na Declaração de Malta de 2013, ativistas intersexo reivindicaram o direito de decidir sobre o próprio corpo. A ONU Direitos Humanos também aponta os danos de intervenções irreversíveis, sem necessidade médica, feitas em crianças que ainda não podem consentir. Nem toda pessoa intersexo se vê na sigla. A Intersex Human Rights Australia escreve que “alguns de nós são LGBT, mas muitos não” e pede que LGBT e LGBTI não sejam usados como sinônimos. Em 2006, um consenso médico passou a usar o termo “distúrbios do desenvolvimento sexual” (DSD, em inglês). Algumas pessoas intersexo usam esse termo, sobretudo no atendimento de saúde; para a organização australiana, ele serve para justificar intervenções sem consentimento.", "more": ["malta", "un", "ihra", "dsd"], "kind": "fato", "kind2": "opinião atribuída"}, {"tag": "A · duas formas de atração", "title": "É possível se apaixonar e ser assexual?", "body": "Sim. Assexualidade diz respeito à atração sexual, que pode ser ausente ou pouco frequente no espectro assexual. Atração romântica é outra dimensão. Uma pessoa pode desejar namorar e construir uma relação sem sentir atração sexual. Nas diretrizes brasileiras de 2025, o A identifica assexuais.", "refs": ["stone", "saude"], "prompt": "Abrir o segundo verbete", "detail": "Arromanticidade diz respeito à pouca ou nenhuma atração romântica. Alguém pode ser assexual e arromântico, ou usar só um desses termos. Uma pergunta sobre frequência de relações sexuais mediria comportamento. Para entender a experiência de atração ou a palavra escolhida pela pessoa, seriam necessárias outras perguntas.", "more": ["stone"], "kind": "fato", "kind2": "fato"}, {"tag": "+ · uma decisão de edição", "title": "Quando vale escrever todas as letras?", "body": "Nas diretrizes brasileiras de 2025, o sinal de mais abre espaço para outras orientações e identidades. Na pesquisa do IBGE, a pergunta de 2019 tinha um objeto mais estreito. Para escolher o título de uma matéria sobre esse número, volte ao questionário antes de escolher a sigla.", "refs": ["saude", "ibge"], "prompt": "Preparar o fechamento", "detail": "Experimente três escalas. Para a estimativa do IBGE, escreva quais adultos foram contados. Para a história da conferência, use LGBT, como decidiram os participantes. Para o depoimento de Juchitán, mantenha muxe e apresente Amaranta. Uma boa manchete deixa o leitor saber de quem aquela história fala. A grafia varia até dentro do governo: o Ministério da Saúde usa LGBTQIAPN+, e o Ministério dos Direitos Humanos tem uma Secretaria Nacional dos Direitos das Pessoas LGBTQIA+. Estudos acadêmicos descrevem disputas sobre quais letras entram e em que ordem (Facchini, 2005; Aguião, 2016). No Brasil: em 2023, o STF derrubou uma lei de Rondônia que proibia a linguagem neutra (como “todes”) em escolas e concursos, por entender que só a União pode legislar sobre o tema. O autor da lei, o deputado estadual Eyder Brasil, via na linguagem neutra uma “verdadeira deturpação” da língua portuguesa; para o relator, Edson Fachin, a proibição era censura prévia. Os ministros Nunes Marques e André Mendonça acompanharam o relator com ressalvas.", "more": ["ibge", "lgbt", "muxe", "mdh", "book1"], "kind": "fato", "kind2": "fato", "more2": ["ro", "ro2", "ro3"]}], [{"tag": "Uganda · 2023", "title": "O que prevê a lei de Uganda?", "body": "A lei anti-homossexualidade de Uganda, sancionada em maio de 2023, manteve a prisão perpétua para relações sexuais entre pessoas do mesmo sexo, criou a pena de morte para a chamada “homossexualidade agravada” e previu até 20 anos de prisão para quem “promover” a homossexualidade.", "refs": ["hrw23", "npr23"], "prompt": "Ver o que a lei chama de “agravada”", "detail": "Segundo a NPR, emissora pública dos EUA, a “homossexualidade agravada” inclui relações entre pessoas do mesmo sexo envolvendo pessoa com HIV, criança, idoso ou pessoa com deficiência. Em agosto de 2023, dois homens foram os primeiros acusados; num dos casos, um jovem de 20 anos foi acusado de relações com um homem de 41 anos com deficiência. A Human Rights Watch critica a lei também por negar a pessoas com deficiência a capacidade de consentir. Como cada lado vê: a corte constitucional de Uganda manteve a maior parte da lei citando as normas socioculturais do país; os autores das ações, cidadãos e ativistas, alegavam que ela viola direitos garantidos pela Constituição.", "more": ["npr23", "hrw23"], "more2": ["ug"], "kind": "fato", "kind2": "fato + opinião atribuída"}, {"tag": "Europa · 2023", "title": "Quantos já foram atacados na rua?", "body": "Na pesquisa on-line da FRA, agência de direitos da União Europeia, com mais de 100 mil pessoas LGBTIQ, mais de 1 em cada 2 disse ter sofrido assédio motivado por ódio no ano anterior; em 2019 era 1 em cada 3. Mais de 1 em cada 10 disse ter sofrido violência nos 5 anos anteriores.", "refs": ["frapr"], "prompt": "Ver quem sofre mais e o que melhorou", "detail": "Entre pessoas trans e intersexo, 2 em cada 3 relataram assédio, e mais de 1 em cada 3 pessoas intersexo disse ter sido atacada. Na média da UE, 19% se sentiram discriminados no trabalho ou ao procurar emprego no ano anterior. Ao mesmo tempo, mais gente se diz aberta sobre quem é: 51% na média da UE. A pesquisa é feita com quem se dispõe a responder, e não com uma amostra sorteada.", "more": ["frapr", "frade"], "kind": "estimativa", "kind2": "estimativa"}, {"tag": "Saúde mental", "title": "O preconceito adoece?", "body": "Numa revisão de 2003 com meta-análises, o pesquisador Ilan Meyer concluiu que lésbicas, gays e bissexuais têm maior prevalência de transtornos mentais que heterossexuais. Ele explica a diferença pelo estresse de minoria: estigma, preconceito e discriminação criam um ambiente hostil e estressante, que causa problemas de saúde mental.", "refs": ["meyer"], "prompt": "Ver como esse estresse funcionaria", "detail": "O modelo descreve quatro processos: sofrer episódios de preconceito, esperar rejeição, esconder quem se é e internalizar a homofobia. Também descreve o que protege, como apoio e comunidade. Em 2023, Frost e Meyer revisaram as críticas ao modelo e sua ampliação para pessoas trans. Entre as críticas, há quem proponha olhar para a falta de segurança social, e não só para o estresse, e quem levante uma causa genética comum; os autores dizem que essa hipótese genética não tem evidência causal. Uma diferença média entre grupos não diz nada sobre a saúde de uma pessoa específica. Se você precisa conversar, o CVV atende de graça, 24 horas, pelo telefone 188.", "more": ["meyer", "frost", "cvv"], "kind": "estimativa", "kind2": "fato"}, {"tag": "Brasil · 1999–2020", "title": "Dá para “curar” a homossexualidade?", "body": "Desde 1999, uma resolução do Conselho Federal de Psicologia diz que psicólogos não podem oferecer práticas de reversão sexual, porque a homossexualidade não é doença.", "refs": ["cfp"], "prompt": "Ver a disputa na Justiça", "detail": "Em 2017, um juiz federal manteve a proibição de oferecer a reversão, mas permitiu que psicólogos atendessem quem os procurasse querendo mudar a orientação sexual, em ação movida por psicólogos ligados a grupos religiosos, que defendiam a liberdade de pesquisar e atender quem pede esse tipo de ajuda. Em 2019, a ministra Cármen Lúcia, do STF, derrubou essa decisão, e em 2020 o tribunal rejeitou por unanimidade o último recurso dos autores, mantendo a resolução.", "more": ["cura1", "cura2"], "kind": "fato", "kind2": "fato + opinião atribuída"}, {"tag": "Índia · 2014", "title": "Quanto custa excluir?", "body": "Numa apresentação no Banco Mundial, em março de 2014, a economista M. V. Lee Badgett estimou, de forma preliminar, que o estigma contra pessoas LGBT poderia custar à Índia até 1,7% do PIB por ano, somando perdas de produtividade por discriminação no trabalho e anos de vida perdidos por doença ou morte precoce.", "refs": ["unaids", "badgett"], "prompt": "Ver de onde vem o número", "detail": "Na versão final do estudo, de outubro de 2014, ela escreveu que as pesquisas existentes não permitem uma estimativa precisa, mas que o custo pode ser substancial, e propôs um modelo para calculá-lo quando houver dados. O estudo registra que, em 2006, 41% dos indianos não queriam um vizinho homossexual, mas que as atitudes negativas vinham diminuindo desde 1990.", "more": ["badgett"], "kind": "estimativa", "kind2": "fato"}, {"tag": "Brasil e Austrália", "title": "E quando a lei muda?", "body": "No Brasil, uma resolução do Conselho Nacional de Justiça proíbe desde maio de 2013 que cartórios recusem casamentos entre pessoas do mesmo sexo. Naquele ano, o IBGE registrou 3.701 desses casamentos; em 2024, o recorde de 12.187, e 64,6% foram entre mulheres.", "refs": ["cnj175", "abr13", "ibgecas", "cas2"], "prompt": "Ver o custo pessoal de mudar uma lei", "detail": "Na Austrália, depois que o Comitê de Direitos Humanos da ONU deu razão a Nicholas Toonen, em 1994, o governo federal incluiu o direito à privacidade sexual entre adultos numa lei federal; a Tasmânia só revogou suas regras contra relações entre homens em 1997. Durante a disputa, o governo da Tasmânia exigiu que o Conselho de Aids do estado demitisse Toonen, sob ameaça de cortar verbas da entidade.", "more": ["toonen", "starobs"], "kind": "fato", "kind2": "fato"}]];

const questions=['O que o mundo pensa? Depende da pergunta.','Por que o L mudou de lugar?','O que cada letra consegue dizer?','O que o preconceito custa?'];
const intro=['Sintonize uma pesquisa na Suécia e na Nigéria. Compare a pesquisa com relatos europeus, leis africanas e as palavras de quem vive na Índia e no México.','Folheie jornais, entre numa conferência e abra um questionário do IBGE. Acompanhe quem escolheu cada nome e por quê.','Monte a sigla letra por letra. Descubra o que ela diz sobre atração, gênero e corpo e experimente escolher a palavra de uma manchete.','Leia o mural da esquina: leis que punem, ataques na rua, saúde, consultório e dinheiro. No fim, veja o que muda quando a lei muda.'];
const html=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const foot=ids=>ids.map(id=>'<button class="note" data-ref="'+id+'" aria-label="Abrir fonte '+S[id].n+'">'+S[id].n+'</button>').join('');
const link=(id,label)=>'<button class="link" id="'+id+'">'+label+'</button>';
const caption=$('action').querySelector('span');
let scene='street',house=0,leaf=0,opened=false,edition=0,letter=0,review=false,saved=false,dialogMode='';
const drafts=editions.map(()=>''), feedback={nota:'',aprendeu:'',vies:'',comentario:'',tema:''};
const $scene=document.querySelector('.scene'), md=$('modal');
const byId=(id,f)=>{const el=$(id);if(el)el.onclick=f};
function refsIn(el){el.querySelectorAll('[data-ref]').forEach(b=>b.onclick=()=>showRef(b.dataset.ref))}
function pop(title,content,url,mode=''){
 dialogMode=mode;$('modalTitle').textContent=title;$('modalText').innerHTML=content;
 const a=$('modalSource');a.hidden=!url;if(url)a.href=url;else a.removeAttribute('href');
 $('modalBack').hidden=!['sourceIndex','letter'].includes(mode);
 if(!md.open)md.showModal();md.scrollTop=0;refsIn($('modalText'));
}
function showRef(id){
 const src=S[id];const origin=dialogMode==='sources'||dialogMode==='sourceIndex'?'sourceIndex':dialogMode==='letters'||dialogMode==='letter'?'letter':'';
 pop('Fonte '+src.n+' · '+src.name,'<p class="stamp">'+html(src.year)+'</p><p>'+html(src.note)+'</p>',src.url,origin);
}
function showSources(){
 const rows=Object.entries(S).sort((a,b)=>a[1].n-b[1].n);
 pop('Caderno de fontes','<p>Na ordem do percurso. Toque em um título para consultar o documento.</p><ol>'+rows.map(([id,s])=>'<li><button class="idx" data-ref="'+id+'">'+html(s.name)+'</button></li>').join('')+'</ol>',null,'sources');
}
function showLetters(i=letter){letter=i;const [g,word,definition,rs,target]=letters[i];
 pop('Disque uma letra','<div class="letters">'+letters.map(([c,w],j)=>'<button aria-label="'+html(c+' · '+w)+'" aria-pressed="'+(j===i)+'" data-g="'+j+'">'+c+'</button>').join('')+'</div><h3>'+html(word)+'</h3><p>'+html(definition)+foot(rs.split(' '))+'</p>'+link('visitWord','Investigar esta letra →'),null,'letters');
 $('modalText').querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{showLetters(+b.dataset.g);$('modalText').querySelector('[aria-pressed="true"]').focus()});
 byId('visitWord',()=>{md.close();record(2,target)});
}
function index(){
 pop('Mapa da rua',houses.map((h,i)=>'<h3 class="menuhead">'+html(h)+'</h3><ol>'+R[i].map((r,j)=>'<li><button class="idx" data-jump="'+i+','+j+'">'+html(r.title)+'</button></li>').join('')+'</ol>').join('')+'<div class="sub">'+link('mapEdit','Redação final')+link('mapBooks','Estante')+link('mapSources','Fontes')+link('mapFeedback','Avaliar')+'</div>');
 md.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{md.close();record(...b.dataset.jump.split(',').map(Number))});
 byId('mapEdit',()=>{md.close();view('edit')});byId('mapBooks',()=>{md.close();books()});byId('mapSources',showSources);byId('mapFeedback',()=>{md.close();view('feedback')});
}
function books(){pop('Quer se aprofundar?','<h3>Sopa de letrinhas?</h3><p>Regina Facchini acompanha o grupo CORSA e as disputas sobre como nomear o movimento brasileiro nos anos 1990.'+foot(['book1'])+'</p><h3>Devassos no paraíso</h3><p>João Silvério Trevisan percorre a história cultural da homoafetividade no Brasil. Leia a quarta edição junto com os jornais da banca.'+foot(['book2'])+'</p><h3>Material Girls e The Transgender Issue (em inglês)</h3><p>Um par para ler lado a lado: Kathleen Stock critica a prioridade da identidade de gênero sobre o sexo biológico; Shon Faye descreve a vida trans e defende justiça entre minorias.'+foot(['stock','faye'])+'</p><p>Buscas no YouTube</p><form action="https://www.youtube.com/results" target="_blank" rel="noopener"><button class="idx" name="search_query" value="Regina Facchini movimento LGBT">Regina Facchini sobre o movimento LGBT ↗</button><button class="idx" name="search_query" value="João Silvério Trevisan Devassos no paraíso">Trevisan sobre Devassos no paraíso ↗</button></form><p></p>')}
function home(){view('street')}
function view(v){scene=v;paint();panel.scrollTop=0;panel.focus({preventScroll:true})}
function record(h,l){house=h;leaf=l;opened=false;view('record')}
function nextRecord(d){const position=house*6+leaf+d;if(position<0){home();return}if(position>=R.length*6){view('edit');return}record(Math.floor(position/6),position%6)}
function showBars(){
 const rows=leaf===0?[['Suécia',94],['Nigéria',7]]:leaf===1?[['Países Baixos',85],['Espanha',85],['Turquia',32]]:[];
 if(house||!rows.length)return '';
 return '<div class="mini-bars" aria-hidden="true">'+rows.map(([label,n])=>'<span>'+label+'</span><span class="track"><i style="width:'+n+'%"></i></span><b>'+n+'%</b>').join('')+'</div>';
}
function det(r){const refs=[r.more,r.more2||[],r.more3||[],r.more4||[]];return r.detail.split(/ (?=Como cada lado vê: |No Brasil: |No mundo: |Violência: |Na ONU: )/).map((p,i)=>'<p class="detail"'+(i?'':' id="extra"')+'>'+html(p).replace(/^(Como cada lado vê:|No Brasil:|No mundo:|Violência:|Na ONU:)/,'<strong>$1</strong>')+foot(refs[i])+'</p>').join('')}
function paint(){
 const r=R[house][leaf],reading=scene!=='street';
 $('cab').classList.toggle('reading',reading);$scene.dataset.location=scene==='record'?houses[house]:scene==='edit'?'Redação de plantão':'Fim de edição';
 pins.forEach((p,i)=>{p.setAttribute('aria-pressed',String(house===i));p.setAttribute('aria-label','Selecionar '+houses[i])});
 $('left').disabled=$('right').disabled=scene==='feedback'||scene==='done';
 if(scene==='street'){
 panel.innerHTML='<p class="tag">Rua da imprensa · '+houses[house]+'</p><h2>'+questions[house]+'</h2><p>'+intro[house]+'</p><p class="meta"><strong>Cerca de 26 minutos</strong> · Pesquisa até novembro de 2026</p><div class="sub">'+link('guide','Mapa da rua')+link('words','Consultar a sigla')+link('editor','Ir à redação')+'</div>';
 caption.textContent='Entrar';byId('guide',index);byId('words',()=>showLetters());byId('editor',()=>view('edit'));
 }else if(scene==='record'){
 panel.innerHTML='<p class="tag">'+html(r.tag)+' · '+(leaf+1)+'/6</p><h2>'+html(r.title)+'</h2><p class="signal">'+html(r.body)+foot(r.refs)+'</p>'+((leaf===0||opened)?showBars():'')+'<button class="fold" id="fold" aria-expanded="'+opened+'">'+(opened?'−  Fechar detalhe':'+  '+html(r.prompt))+'</button>'+(opened?det(r):'')+'<div class="sub">'+link('back','Voltar à rua')+link('guide','Índice da estação')+(house===2?link('words','Discar uma letra'):'')+'</div>';
 byId('fold',()=>{opened=!opened;paint();$('fold').focus({preventScroll:true});if(opened)$('extra').scrollIntoView({block:'nearest'})});byId('back',home);byId('guide',index);byId('words',()=>showLetters());caption.textContent=house===R.length-1&&leaf===5?'Ir à redação':leaf===5?'Próxima estação':'Próximo registro';
 }else if(scene==='edit'){
 const e=editions[edition];panel.innerHTML='<p class="tag">E você? · fechamento da edição</p><h2>Que manchete vai para a rua?</h2><label for="pauta">Escolha sua pauta</label><select id="pauta">'+editions.map((c,i)=>'<option value="'+i+'" '+(edition===i?'selected':'')+'>'+html(c.name)+'</option>').join('')+'</select><p class="signal">'+html(e.item)+foot(e.refs)+'</p>'+(review?'<section class="reviewbox"><p class="tag">Sua edição</p><p id="myHeadline"></p><b>Uma edição possível</b><p>'+html(e.model)+foot(e.refs)+'</p><b>O que se perde neste outro título?</b><p class="choice">'+html(e.wide)+'</p><p>'+html(e.why)+foot(e.refs)+'</p></section>':'<label for="draft">Sua manchete</label><textarea id="draft" maxlength="220" rows="2" placeholder="Escreva o título que você publicaria"></textarea><p class="meta">'+html(e.angle)+'</p>')+'<div class="sub">'+(review?link('revise','Editar meu título'):link('example','Ver uma edição comentada'))+link('rate','Avaliar o curso')+link('back','Rua')+'</div><p id="msg" role="status"></p>';
 $('pauta').onchange=e=>pick(+e.target.value);if(review)$('myHeadline').textContent=drafts[edition].trim()||'Você escolheu ler a edição comentada.';else{$('draft').value=drafts[edition];$('draft').oninput=e=>drafts[edition]=e.target.value}
 byId('rate',()=>view('feedback'));byId('back',home);byId('example',()=>{review=true;view('edit')});byId('revise',()=>{review=false;view('edit');$('draft').focus()});caption.textContent=review?'Fechar edição':'Revisar manchete';
 }else if(scene==='feedback'){
 panel.innerHTML='<p class="tag">Avaliação do curso</p><h2>Como foi o percurso?</h2><p class="meta">Avaliação opcional, salva neste navegador.</p><form id="survey"><label for="nota">Nota de 1 a 5</label><select id="nota" required><option value="">Escolha</option>'+[1,2,3,4,5].map(x=>'<option>'+x+'</option>').join('')+'</select><label for="aprendeu">O que você aprendeu que não sabia?</label><textarea id="aprendeu" rows="2" maxlength="1500"></textarea><label for="vies">Sentiu que o curso favoreceu algum lado?</label><select id="vies"><option value="">Escolha, se quiser</option>'+['Não','Sim, a favor de uma visão','Sim, contra uma visão','Não sei'].map(x=>'<option>'+x+'</option>').join('')+'</select><label for="comentario">Comentário</label><textarea id="comentario" rows="2" maxlength="1500"></textarea><label for="tema">Que tema você quer que vire curso?</label><textarea id="tema" rows="2" maxlength="400"></textarea><div class="sub">'+link('skip','Encerrar sem avaliar')+'</div><p id="msg" role="status"></p></form>';
 for(const k of Object.keys(feedback)){$(k).value=feedback[k];$(k).oninput=e=>feedback[k]=e.target.value}
 $('survey').onsubmit=e=>{e.preventDefault();save()};byId('skip',e=>{e.preventDefault();view('done')});caption.textContent='Salvar avaliação';
 }else{
 panel.innerHTML='<p class="tag">Edição encerrada</p><h2>Quem cabe na sua manchete?</h2><p>Antes de publicar, volte a três perguntas. Quem está falando? Qual foi a pergunta? A palavra usada é a que aquela pessoa escolheu?</p>'+(saved?'<p class="feedback">Avaliação salva neste navegador.</p>':'')+'<div class="sub">'+link('books','Quer se aprofundar?')+link('sources','Fontes numeradas')+link('editor','Outra manchete')+(saved?'':link('rate','Avaliar o curso'))+'</div>';byId('rate',()=>view('feedback'));byId('books',books);byId('sources',showSources);byId('editor',()=>{review=false;view('edit')});caption.textContent='Voltar à rua';
 }refsIn(panel);
}
function pick(i){edition=i;review=false;view('edit')}
function save(){
 if(!$('survey').reportValidity())return;
 try{const val=localStorage.getItem('pmu-fila'),queue=val===null?[]:JSON.parse(val);if(!Array.isArray(queue))throw new Error();queue.push({curso:'quem-cabe-na-sigla',quando:new Date().toISOString(),voto:editions[edition].name,...feedback,nota:Number(feedback.nota)});localStorage.setItem('pmu-fila',JSON.stringify(queue));saved=true;view('done')}
 catch{$('msg').textContent='Não foi possível salvar neste navegador. Suas respostas continuam no formulário. Você pode tentar de novo ou encerrar sem avaliar.';$('msg').scrollIntoView({block:'nearest'})}
}
function go(){switch(scene){
 case 'street':record(house,0);break;case 'record':nextRecord(1);break;
 case 'edit':if(review){view('done')}else if(drafts[edition].trim()){review=true;view('edit')}else{$('msg').textContent='Escreva uma manchete ou escolha a edição comentada.';$('draft').focus()}break;
 case 'feedback':save();break;default:home()
}}
function turn(d){if(scene==='street'){house=(house+d+houses.length)%houses.length;leaf=0;paint()}else if(scene==='record')nextRecord(d);else if(scene==='edit')pick((edition+d+editions.length)%editions.length)}
pins.forEach((p,i)=>p.onclick=()=>{house=i;leaf=0;paint()});
byId('action',go);byId('left',()=>turn(-1));byId('right',()=>turn(1));byId('close',()=>md.close());
byId('modalBack',()=>dialogMode==='letter'?showLetters():showSources());
byId('menu',index);byId('help',()=>pop('Controles do fliperama','<p>Na rua, toque em 01, 02, 03 ou 04 para escolher um prédio e em A para entrar. As setas mudam de prédio ou folheiam registros. O botão com + revela a segunda leitura.</p><p>No teclado, use ←, → e A. Tab percorre os controles e Esc fecha esta janela. Os números pequenos abrem as fontes. Você pode entrar na redação a qualquer momento pelo mapa.</p>'));
document.addEventListener('keydown',e=>{if(md.open||['TEXTAREA','SELECT','INPUT'].includes(e.target.tagName)||e.ctrlKey||e.altKey||e.metaKey)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();turn(e.key==='ArrowRight'?1:-1)}else if(e.key.toLowerCase()==='a'&&!e.repeat){e.preventDefault();go()}});
paint();

</script></html>
