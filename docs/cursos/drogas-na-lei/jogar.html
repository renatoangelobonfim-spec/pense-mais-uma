 {tab:"MUNDO · 1830–1971",t:"O caso da proibição",
  f:[["O que fizeram","Ao longo do século 20, os países assinaram tratados da ONU, como a Convenção Única de 1961 e a de 1971, que obrigam a controlar a produção e o comércio de drogas. [[tni]] Em 1971, o presidente dos EUA Richard Nixon chamou o abuso de drogas de \"inimigo público nº 1\", e a expressão \"guerra às drogas\" pegou. [[nixon]]"],
     ["Por quê","A aposta do regime internacional foi cortar a oferta: menos droga circulando, menos gente usando. [[ufu]]"]],
  bet:{q:"Onde surgiu uma das primeiras leis do mundo contra a maconha?",o:["Nos Estados Unidos","No Brasil","Na Inglaterra","No México"],a:1},
  rev:[["O que aconteceu","No Brasil. Uma postura municipal do Rio de Janeiro, de 1830, proibia a venda e o uso do \"pito do pango\", o cachimbo de maconha: o vendedor pagava multa e quem usasse, inclusive escravizados, pegava dias de cadeia. [[pango]] Um decreto de 1932 já incluía a maconha entre as substâncias proibidas em todo o país [[dec1932]], e o Decreto-Lei 891, de 1938, consolidou a proibição. [[decretos]] [[pango]]"],
       ["O que se discute","Historiadores apontam que as primeiras leis miravam a população negra e escravizada e se apoiavam em ideias racistas da época. [[carta_rac]] [[ufs]] Quem defende a proibição hoje fala em proteger a saúde, como as entidades médicas brasileiras. [[cfm]]"]],
  q:[{q:"O que foi a Convenção Única de 1961?",o:["Um tratado da ONU para controlar drogas","A lei americana que criou a DEA","Um acordo entre Brasil e Portugal","A primeira lei a liberar a maconha medicinal"],a:0,e:"É um dos tratados da ONU que organizam o controle internacional de drogas. [[tni]]"},
     {q:"Quem popularizou a expressão \"guerra às drogas\"?",o:["Ronald Reagan, em 1986","Richard Nixon, em 1971","Getúlio Vargas, em 1938","A ONU, em 1961"],a:1,e:"Nixon, em junho de 1971. Reagan endureceu a política depois, mas a expressão é de antes. [[nixon]]"},
     {q:"Em que ano veio a lei nacional que consolidou a proibição da maconha?",o:["1830","1938","1964","2006"],a:1,e:"1830 foi uma regra só da cidade do Rio. A lei nacional que consolidou a proibição é de 1938; um decreto de 1932 já incluía a maconha. [[dec1932]] [[decretos]]"}]},
 {tab:"BRASIL · 2006",t:"O caso da Lei de Drogas",
  f:[["O que fizeram","A Lei 11.343, de 2006, tirou a prisão de quem é pego com droga para uso próprio: a pena virou advertência, serviço comunitário ou curso. [[ufu2]] [[cef_pen]] Ao mesmo tempo, a pena mínima do tráfico subiu de 3 para 5 anos. [[conjur_pol]]"],
     ["Por quê","A ideia era separar quem usa de quem vende. Mas a lei não diz quanta droga separa um do outro: o juiz olha tipo e quantidade, local e circunstâncias. [[conjur_pol]] [[ipea]]"]],
  bet:{q:"Depois da lei, o número de presos por crimes de drogas...",o:["caiu","ficou parecido","dobrou","mais que quadruplicou"],a:3},
  rev:[["O que aconteceu","Saltou de 47 mil (dez/2006) para 193 mil presos (dez/2023), alta de 311%, segundo o CNJ. [[cnj_bol]] [[cnj]] Hoje, quase 28% dos presos do país estão lá por crimes da Lei de Drogas. [[senappen]]"],
       ["Quem critica e quem defende","Um estudo do CNJ calcula que ao menos 110 mil presos por tráfico não tinham antecedentes e poderiam ter pena menor. [[cnj110]] Segundo o Ipea, a maioria é de homens, jovens e negros. [[ipea_perfil]] Do outro lado, entidades médicas defendem manter o porte como crime, porque descriminalizar poderia aumentar o consumo e fortalecer o tráfico. [[cfm]]"]],
  ad:[["Presos por crimes da Lei de Drogas","47 mil (2006)","193 mil (dez/2023)",["cnj_bol"]]],
  mud:"A população carcerária inteira também cresceu: 85% entre 2006 e 2016, em grande parte por crimes ligados às drogas, segundo artigo publicado no Congresso em Foco. [[cef_guerra]]",
  q:[{q:"Pela lei de 2006, o que acontece com quem é pego com droga para uso próprio?",o:["Advertência, serviço comunitário ou curso, sem prisão","Até dois anos de prisão","Multa e prisão em regime aberto","Nada: o uso é permitido"],a:0,e:"A lei acabou com a prisão do usuário, mas manteve o porte como crime. [[ufu2]] [[cef_pen]]"},
     {q:"Como a lei de 2006 separa usuário de traficante?",o:["Até 25 gramas é usuário","O juiz avalia tipo e quantidade, local e circunstâncias, sem número fixo","Quem tem antecedentes é sempre traficante","Só o delegado decide"],a:1,e:"Não há número na lei, e é isso que o Ipea critica. [[ipea]] [[conjur_pol]]"},
     {q:"Que parte dos presos do Brasil está presa por crimes da Lei de Drogas?",o:["Cerca de 5%","Quase 28%","Cerca de metade","Três em cada quatro"],a:1,e:"Quase 28%, segundo a Senappen. [[senappen]]"}]},
 {tab:"PORTUGAL · 2001",t:"O caso Portugal",
  f:[["O que fizeram","Desde 1º de julho de 2001, usar ou portar qualquer droga para consumo próprio, até 10 dias de uso, deixou de ser crime em Portugal. [[pt_bmj]] [[pt_unsw]] Desde 2023, mesmo acima disso não é crime se ficar provado que a droga é para consumo próprio. [[pt_l55]] Quem é pego vai a uma Comissão de Dissuasão, e não a um juiz. [[pt_sciam]] O tráfico continua sendo crime. [[pt_obs]]"],
     ["Por quê","Nos anos 1990, o país vivia uma crise de heroína, com overdoses e casos de HIV subindo. [[pt_unsw]]"]],
  bet:{q:"Nos anos seguintes, as mortes ligadas a drogas em Portugal...",o:["caíram","ficaram iguais","subiram um pouco","dobraram"],a:0},
  rev:[["O que aconteceu","Caíram: as mortes ligadas a drogas foram de 131 para 20 entre 2000/01 e 2008, segundo o BMJ [[pt_bmj]], e os casos de HIV ligados a seringas despencaram. [[pt_sciam]] Um balanço da Universidade de New South Wales aponta mais gente em tratamento, menos HIV e hepatite C e menos prisões. [[pt_unsw]]"],
       ["Quem critica e quem defende","Nos últimos anos as mortes voltaram a subir, Lisboa e Porto reapareceram no topo das listas europeias de drogas pesadas e o prefeito do Porto disse que o país \"foi longe demais\". [[pt_nos]] O crack preocupa as autoridades. [[pt_dn]] A ONG Transform, que defende o modelo, diz que os dados de consumo costumam ser distorcidos e que as mortes seguem bem abaixo da média europeia. [[pt_transform]]"]],
  ad:[["Presos por crimes de drogas","3.863 (1999)","1.140 (2017)",["pt_statista"]],["Novos casos de HIV por drogas injetáveis","907 (2000)","18 (2017)",["pt_statista"]],["Mortes ligadas a drogas (BMJ)","131 (2000/01)","20 (2008)",["pt_bmj"]],["Mortes com droga detectada no exame (Cato Institute, pró-reforma)","cerca de 400 (1999)","290 (2006)",["pt_sciam"]]],
  mud:"A lei veio junto com mais tratamento e redução de danos: a troca de seringas existia desde 1993. Por isso, nem os defensores atribuem tudo à descriminalização. [[pt_who]] [[pt_transform]] As contagens de mortes também mudam conforme o critério: cada fonte mede uma coisa diferente, mas todas mostram queda. [[pt_bmj]] [[pt_sciam]]",
  br:"Aqui, portar maconha para uso foi crime até 2024, e portar outras drogas ainda é. A lei de 2006 não tem quantidade fixa; Portugal usa como referência 10 dias de uso, que desde 2023 é só um indício, não um limite. [[br_carta]] [[pt_bmj]] [[pt_l55]] [[ipea]]",
  q:[{q:"O que Portugal fez em 2001?",o:["Legalizou a venda de todas as drogas","Deixou de tratar como crime o porte de qualquer droga para uso próprio","Liberou só a maconha","Acabou com a pena para traficantes"],a:1,e:"Descriminalizou o uso de todas as drogas, mas a venda continua proibida. [[pt_obs]]"},
     {q:"Para onde vai quem é pego com droga para uso em Portugal?",o:["Para um juiz criminal","Para uma Comissão de Dissuasão","Para internação obrigatória","Para a delegacia, para ser fichado"],a:1,e:"As comissões avaliam o caso e podem encaminhar para tratamento. [[pt_sciam]]"},
     {q:"Qual a diferença entre descriminalizar e legalizar?",o:["São a mesma coisa","Descriminalizar tira o crime de quem usa; legalizar permite e regula a venda","Legalizar vale só para remédios","Descriminalizar libera a venda em lojas"],a:1,e:"Portugal descriminalizou: o usuário não comete crime, mas vender continua proibido. Uruguai e Canadá foram além e legalizaram a venda de maconha. [[pt_obs]] [[uy_folhape]]"}]},
 {tab:"HOLANDA · 1976",t:"O caso dos coffeeshops",
  f:[["O que fizeram","Desde 1976, a Holanda tolera a venda de maconha nos coffeeshops; hoje o limite é de 5 g por cliente. Não é legal, é \"tolerado\": a lei diz que vender é crime, mas o governo escolhe não punir. [[nl_fast]] Segundo a Folha de Pernambuco, são cerca de 570 coffeeshops em 102 dos 345 municípios. [[nl_folhape]]"],
     ["Por quê","A ideia era separar a maconha das drogas de \"risco inaceitável\", como heroína e cocaína. [[nl_vic]]"]],
  bet:{q:"O coffeeshop pode vender. Mas de onde vinha a maconha que ele vende?",o:["De fazendas do governo","De produtores licenciados","Do mercado ilegal","Importada legalmente do Canadá"],a:2},
  rev:[["O que aconteceu","Do mercado ilegal. É o \"problema da porta dos fundos\": a venda pela frente é tolerada, mas o abastecimento continua proibido. [[nl_vic]] Desde 7 de abril de 2025, coffeeshops de 10 cidades vendem só maconha de produtores licenciados, num teste de quatro anos. [[nl_gov]] [[nl_fast2]]"],
       ["Quem critica e quem defende","Segundo reportagem do Observador, o crime organizado das drogas, com destaque para o contrabando de cocaína, cresceu: o jornalista Peter R. de Vries foi assassinado em 2021, e o presidente de um sindicato de policiais chamou o país de \"narco Estado 2.0\". [[nl_obs]] O criminologista Hans Nelen discorda do rótulo. [[nl_eluniv]]"]],
  ad:[["Antes e depois","—","Não há um antes e depois da tolerância, que começou em 1976. No teste com maconha legal, a primeira medição oficial (set/2026) não viu mudança clara em crime, consumo ou mercado ilegal, e avisa que é cedo.",["nl_gov","nl_rand"]]],
  q:[{q:"A venda de maconha nos coffeeshops holandeses é...",o:["totalmente legal desde 1976","tolerada: é crime, mas o governo não pune","proibida desde 2025","permitida só para turistas"],a:1,e:"É a política de tolerância. [[nl_fast]]"},
     {q:"O que é o \"problema da porta dos fundos\"?",o:["Turistas entram pelos fundos","A venda é tolerada, mas o abastecimento dos coffeeshops é ilegal","Os coffeeshops vendem drogas pesadas escondido","A polícia fecha as lojas à noite"],a:1,e:"A loja pode vender, mas não tem de onde comprar legalmente. [[nl_vic]]"},
     {q:"O que a Holanda começou a testar em 2025?",o:["Proibir a venda a estrangeiros no país todo","Coffeeshops de 10 cidades vendendo só maconha de produtores licenciados","Fechar todos os coffeeshops","Legalizar a cocaína"],a:1,e:"O teste dura quatro anos. [[nl_gov]] [[nl_fast2]]"}]},
 {tab:"URUGUAI 2013 · CANADÁ 2018",t:"O caso da venda regulada",
  f:[["O que fizeram","O Uruguai foi o primeiro a legalizar a maconha, pela Lei 19.172, de dezembro de 2013, no governo José Mujica. [[uy_folhape]] Dá para plantar em casa, entrar num clube de cultivo ou comprar em farmácia, com cadastro e limite de 40 g por mês. [[uy_em]] O Canadá legalizou em 17 de outubro de 2018, com lojas licenciadas. [[ca_statcan]]"],
     ["Por quê","No Uruguai, a lei foi aprovada com o objetivo de conter o narcotráfico. [[uy_jc]]"]],
  bet:{q:"Em qual dos dois o mercado legal passou a dominar?",o:["Uruguai","Canadá","Nos dois","Em nenhum"],a:1},
  rev:[["O que aconteceu","No Canadá: no 1º semestre de 2023, mais de 70% do valor da maconha consumida vinha de fonte legal, contra 22% no fim de 2018, segundo a agência oficial de estatística. [[ca_statcan]] No Uruguai, o mercado ilegal ainda movimenta mais da metade, embora em queda; a venda em farmácia só começou em 2017. [[uy_folhape]]"],
       ["Quem critica e quem defende","Um estudo de 2025 em Ontário viu subir de 4% para 10% a parte dos novos casos de esquizofrenia associados ao uso problemático de maconha [[ca_jama]]; especialistas lembram que isso mostra associação, não prova causa. [[ca_jama2]] No Uruguai, a queixa mais comum dos usuários é a maconha de farmácia ter pouco THC. [[uy_jc]]"]],
  ad:[["Canadá: infrações com maconha registradas pela polícia","77 mil (2014, 4 anos antes da lei)","9 mil (2024)",["ca_ctv"]],["Canadá: usuários que compram ao menos parte de fonte legal","23% (2018)","68% (2020)",["ca_statcan"]],["Canadá: uso de maconha no último ano","14,8% (2017)","22% (2021)",["ca_statcan"]],["Uruguai: homicídios por 100 mil habitantes","7,6 (2013)","10,3 (2025), com pico de 11,8 em 2018",["uy_mi","uy_mp"]],["Uruguai: uso por estudantes de 13 a 17 anos","—","não aumentou desde a lei",["uy_teen"]]],
  mud:"No Canadá, parte da queda nas infrações é automática: o que deixou de ser crime sai da estatística [[ca_ctv]]; e o consumo já vinha subindo antes da lei. [[ca_statcan]] No Uruguai, o governo atribuiu a alta dos homicídios de 2018 a um novo código de processo penal [[uy_lanacion]], e um estudo da Junta Nacional de Drogas não achou evidência que ligue a alta à lei da maconha. [[uy_fsp]]",
  br:"Aqui vender maconha continua sendo tráfico. Segundo o Datafolha (set/2023), 72% dos brasileiros são contra legalizar a maconha para uso recreativo, e 76% apoiam o uso medicinal. [[dfolha23]]",
  q:[{q:"Qual foi o primeiro país a legalizar a produção e a venda de maconha?",o:["Holanda","Uruguai","Canadá","Portugal"],a:1,e:"Uruguai, em 2013. A Holanda só tolera a venda. [[uy_folhape]] [[nl_fast]]"},
     {q:"No Uruguai, quem pode comprar maconha na farmácia?",o:["Qualquer turista","Adultos cadastrados, com limite mensal","Só pacientes com receita","Menores com autorização dos pais"],a:1,e:"O limite é de 40 g por mês. [[uy_em]]"},
     {q:"No Canadá, quanto do valor da maconha consumida vinha de fonte legal no 1º semestre de 2023?",o:["Cerca de 10%","Cerca de 30%","Mais de 70%","Tudo"],a:2,e:"Mais de 70% no 1º semestre de 2023, segundo a Statistics Canada. [[ca_statcan]]"}]},
 {tab:"EUA · OREGON 2020",t:"O caso do Oregon",
  f:[["O que fizeram","Nos EUA, a lei federal ainda proíbe, mas cada estado faz sua regra: em 24 dos 50 a maconha é legal para qualquer uso, e em 40 para uso medicinal. [[us_folhape]] Em 2020, o Oregon foi além: a Medida 110, aprovada com 58% dos votos, descriminalizou pequenas quantidades de todas as drogas, incluindo heroína e metanfetamina. [[or_abc]] [[or_colo]]"],
     ["Por quê","Tratar a dependência como questão de saúde, e não de prisão. [[or_abc]]"]],
  bet:{q:"O que aconteceu com a descriminalização no Oregon?",o:["Virou modelo e foi copiada por outros estados","Continua igual até hoje","Voltou atrás em 2024","Foi derrubada pela Suprema Corte"],a:2},
  rev:[["O que aconteceu","Voltou atrás: desde 1º de setembro de 2024, portar pequenas quantidades é crime de novo. [[or_colo]] As mortes por overdose de opioides sintéticos cresceram 13 vezes entre 2019 e meados de 2023. [[or_aol]]"],
       ["Quem critica e quem defende","Pelos dados oficiais, só 85 pessoas multadas fizeram a triagem de dependência. [[or_colo]] Defensores, como a Drug Policy Alliance, culpam o fentanil, que chegou na mesma época [[or_dpa]], e um pesquisador que avaliava a lei disse ter só quatro meses de dados úteis. [[or_cato]]"]],
  ad:[["Mortes por opioides sintéticos","84 (2019)","mais de 1.100 (12 meses até jun/2023)",["or_aol"]],["Multas aplicadas pela Medida 110 (segundo reportagem de ago/2024)","—","7.227 multas; US$ 78 mil arrecadados de US$ 899 mil",["or_colo"]]],
  mud:"O fentanil se espalhou pelo oeste dos EUA justamente quando a lei entrou em vigor, em fevereiro de 2021. [[or_dpa]] [[or_cato]] É o exemplo mais claro de que antes e depois não prova causa.",
  q:[{q:"Nos EUA, a maconha é legal para qualquer uso...",o:["em todo o país desde 2026","em 24 dos 50 estados, mas a lei federal ainda proíbe","em nenhum estado","só na Califórnia"],a:1,e:"Os estados fazem suas regras. [[us_folhape]]"},
     {q:"O que a reclassificação de abril de 2026 fez nos EUA?",o:["Legalizou a maconha no país todo","Tratou a maconha medicinal licenciada como droga menos perigosa, sem legalizar","Proibiu a maconha medicinal","Liberou a importação do Canadá"],a:1,e:"A medida não legaliza a maconha nos EUA. [[us_info]]"},
     {q:"O que a Medida 110 do Oregon descriminalizou?",o:["Só a maconha","Pequenas quantidades de todas as drogas","A venda em farmácias","O uso só dentro de clínicas"],a:1,e:"Incluía heroína, cocaína, fentanil e metanfetamina. [[or_colo]]"}]},
 {tab:"FILIPINAS · SINGAPURA · SUÉCIA · TAILÂNDIA",t:"O caso de quem proíbe e de quem recuou",
  f:[["O que fizeram","Nas Filipinas, o presidente Rodrigo Duterte (2016–2022) lançou uma guerra às drogas com operações policiais letais. [[ph_aj]] Em Singapura, o tráfico acima de certas quantidades tem pena de morte obrigatória. [[sg_euro]] A Tailândia foi para o outro lado: em 2022 tirou a maconha da lista de drogas proibidas. [[th_lp]]"],
     ["E quem proíbe sem violência?","A Suécia tornou crime o próprio uso de drogas em 1988 e, desde 1993, prevê até 6 meses de prisão. [[se_can235]] Quem defende o modelo aponta o consumo baixo: em 2024, cerca de 2,5% dos adultos de 16 a 84 anos usaram maconha no último ano. [[se_canfakta]] Críticos apontam as mortes: foram 474 em 2023, embora em queda desde 2015, e o país registra muitas mortes por drogas para sua população; o próprio relatório sueco avisa que comparar países é difícil. [[se_can235]]"],
     ["Por quê","Os governos de punição severa dizem que a dureza protege a sociedade: Singapura afirma que a pena de morte a tornou uma das cidades mais seguras do mundo. [[sg_euro]]"]],
  bet:{q:"A Tailândia liberou a maconha em 2022. O que aconteceu três anos depois?",o:["Nada mudou","Passou a exigir receita médica para comprar","Liberou também a cocaína","Proibiu até o uso medicinal"],a:1},
  rev:[["O que aconteceu","Desde junho de 2025, só dá para comprar com receita, e em setembro de 2026 o governo mandou à Câmara um projeto de lei só para uso medicinal, com penas mais duras. [[th_lp]] [[th_nation]] A liberação tinha vindo sem uma lei que regulasse a venda, e surgiram cerca de 10 mil lojas. [[th_dw]] [[th_bloom]]"],
       ["Quem critica e quem defende","Nas Filipinas, os mortos vão de cerca de 6 mil, segundo a polícia, a 30 mil, segundo grupos de direitos humanos. Duterte foi preso em março de 2025; o Tribunal Penal Internacional confirmou as acusações por crimes contra a humanidade e marcou o julgamento para 30 de novembro de 2026. [[ph_aj]] [[ph_amn]] [[ph_cgtn]] Em Singapura, 15 das 17 execuções de 2025 foram por drogas, e o chefe de direitos humanos da ONU critica a prática. [[sg_un]] [[sg_euro]]"]],
  ad:[["Tailândia: uso de maconha no último ano","2,2% (2019)","4,2% (2021, após liberar as folhas)",["th_bmc"]]],
  mud:"A liberação veio em etapas (folhas em 2021, planta inteira em 2022) e no meio da pandemia, e o curso não encontrou série comparável depois de 2022. Outra pesquisa, com adultos de 12 regiões, achou 15% de uso atual, mas mede outra coisa. [[th_bmc]] [[th_peerj]]",
  br:"A Constituição brasileira proíbe pena de morte, salvo em guerra declarada. [[cf]]",
  q:[{q:"Quantas pessoas morreram na guerra às drogas de Duterte?",o:["Cerca de 500","Exatamente 78","De 6 mil (polícia) a 30 mil (grupos de direitos humanos)","Mais de 1 milhão"],a:2,e:"78 são os casos da acusação no TPI (76 assassinatos e 2 tentativas), não o total de mortos. [[ph_aj]]"},
     {q:"O que a Tailândia fez em 2025?",o:["Liberou a venda para turistas","Voltou a exigir receita médica para comprar maconha","Legalizou o cultivo em casa","Proibiu o uso medicinal"],a:1,e:"Passou a exigir receita; a maconha segue fora da lista de narcóticos. [[th_lp]]"},
     {q:"Em Singapura, qual a pena para tráfico acima de certas quantidades?",o:["Prisão perpétua","Pena de morte obrigatória","Multa e deportação","Serviço comunitário"],a:1,e:"É obrigatória por lei. [[sg_euro]]"}]},
 {tab:"ALEMANHA · 2024",t:"O caso alemão",
  f:[["O que fizeram","Desde 1º de abril de 2024, adultos na Alemanha podem portar e plantar maconha dentro de certos limites [[de_ekocan]], e há clubes de cultivo sem fins lucrativos. [[de_247]]"],
     ["Por quê","O governo da época, liderado pelos social-democratas, defendeu a lei para combater o mercado ilegal. [[de_isto]]"]],
  bet:{q:"Dois anos depois, o consumo de maconha na Alemanha...",o:["explodiu entre os jovens","ficou praticamente estável","caiu pela metade","dobrou entre adultos"],a:1},
  rev:[["O que aconteceu","Ficou em grande parte estável, segundo o instituto DIW Berlin. [[de_diw]] A avaliação oficial de abril de 2026 viu o mercado ilegal encolher e um aumento \"moderado\" do consumo, que atribuiu a outros fatores. [[de_isto]]"],
       ["Quem critica e quem defende","O partido do chanceler Friedrich Merz rejeitou as conclusões [[de_isto]], e os ministérios da Saúde e do Interior disseram ver \"urgente necessidade de agir\". [[de_bmg]] A avaliação também apontou alta atípica de receitas de maconha medicinal. [[de_isto]] O SPD, que divide o governo com Merz, defende a lei. [[de_isto]]"]],
  ad:[["Crimes ligados à maconha","2023","cerca de um terço do nível anterior (2024)",["de_diw2"]],["Total de crimes registrados","2023","caiu em 2024, puxado pela maconha",["de_blick"]],["Crimes violentos","2023","subiram 1,5% em 2024; o DIW diz que a alta não coincide no tempo com a reforma",["de_blick","de_diw2"]],["Consumo de maconha","antes da lei","praticamente estável",["de_diw"]]],
  mud:"Boa parte da queda nos crimes é automática: portar e plantar deixaram de ser crime. [[de_blick]] E a cocaína vem subindo há anos, segundo análises de esgoto. [[de_diw]] [[de_diw2]]",
  br:"No Brasil, plantar maconha para uso próprio continua proibido. O STF só presume usuário quem tem até 6 plantas fêmeas, sem liberar o cultivo. [[br_stf]]",
  q:[{q:"Quando a Alemanha liberou a maconha para adultos?",o:["1976","2013","Abril de 2024","Ainda não liberou"],a:2,e:"Em 1º de abril de 2024. [[de_ekocan]]"},
     {q:"Segundo o DIW Berlin, o que aconteceu com o consumo de maconha?",o:["Explodiu","Ficou em grande parte estável","Caiu pela metade","Não foi medido"],a:1,e:"E a cocaína é que vem subindo há anos. [[de_diw]]"},
     {q:"Como o governo Merz reagiu à avaliação de 2026?",o:["Revogou a lei no mesmo dia","Os conservadores rejeitaram as conclusões, e a coalizão está dividida","Elogiou a lei por unanimidade","Estendeu a lei à cocaína"],a:1,e:"CDU e CSU rejeitam; o SPD defende. [[de_isto]]"}]},
 {tab:"BRASIL · 2024–2026",t:"O caso Brasil hoje",

function confetti(){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;const cv=document.createElement("canvas");cv.className="confetti";cv.width=innerWidth;cv.height=innerHeight;document.body.appendChild(cv);const x=cv.getContext("2d");const P=Array.from({length:80},()=>({x:Math.random()*cv.width,y:-20-Math.random()*200,v:2+Math.random()*3,r:Math.random()*6.28,c:["#8A5A2B","#D8C9A8","#A3412A","#1B1B1B"][Math.random()*4|0]}));let t=0;(function f(){x.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.y+=p.v;p.r+=.1;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillRect(-4,-2,8,4);x.restore()});if(++t<130)requestAnimationFrame(f);else cv.remove()})();snd("win")}

 if(e.target.closest("#fnpop .x")||!e.target.closest("#fnpop"))pop.style.display="none"},true);
