<script>
/* Arte das cenas — estilo Cinema noturno. Tudo vetorial, original. */
let _u=0;const uid=p=>(p||"g")+(_u++);
const C={bg:"#0E1020",ink:"#120E26",deep:"#1A1430",gold:"#F3C08A",amber:"#F3A86F",rose:"#C2587A",lilac:"#B9A6F2",violet:"#7B5BC9",skin:"#E4A98C",skin2:"#C98F6B",skin3:"#8D5B43",rain:"#9FB3E8"};
const PAL={
 night:[[0,"#0F1230"],[.6,"#241D4A"],[1,"#3A2A5E"]],
 dusk:[[0,"#151538"],[.55,"#4B2E6B"],[.8,"#C2587A"],[1,"#F3A86F"]],
 dawn:[[0,"#2B2D5C"],[.5,"#7A5A9A"],[.85,"#F0A98A"],[1,"#FCD9A8"]],
 rain:[[0,"#12152C"],[1,"#2B3256"]],

};
function lg(id,stops,v){return `<linearGradient id="${id}" x1="0" y1="0" x2="${v?0:1}" y2="${v?1:0}">${stops.map(([o,c,a])=>`<stop offset="${o}" stop-color="${c}"${a!=null?` stop-opacity="${a}"`:""}/>`).join("")}</linearGradient>`}
function rg(id,c,a1,a0,cx,cy,r){return `<radialGradient id="${id}" cx="${cx||.5}" cy="${cy||.5}" r="${r||.5}"><stop offset="0" stop-color="${c}" stop-opacity="${a1==null?1:a1}"/><stop offset="1" stop-color="${c}" stop-opacity="${a0||0}"/></radialGradient>`}
function SV(h,body,defs){return `<svg viewBox="0 0 360 ${h}" width="100%" role="img" aria-hidden="true" preserveAspectRatio="xMidYMid meet"><defs>${defs||""}</defs>${body}</svg>`}
function sky(h,pal){const id=uid("s");return {d:lg(id,PAL[pal],1),b:`<rect width="360" height="${h}" fill="url(#${id})"/>`}}
function fadeB(h,from){const id=uid("f");return {d:lg(id,[[from||.7,C.bg,0],[1,C.bg,1]],1),b:`<rect width="360" height="${h}" fill="url(#${id})"/>`}}
function rnd(seed){let x=seed||7;return()=>{x=(x*9301+49297)%233280;return x/233280}}
function rain(h,n,seed,op){const r=rnd(seed);let s="";for(let i=0;i<n;i++){const x=r()*380-10,y=r()*h,l=10+r()*16;s+=`<path d="M${x.toFixed(1)} ${y.toFixed(1)}l-4 ${l.toFixed(1)}"/>`}return `<g stroke="${C.rain}" stroke-width="1.1" opacity="${op||.45}" stroke-linecap="round">${s}</g>`}
function stars(n,h,seed){const r=rnd(seed||3);let s="";for(let i=0;i<n;i++)s+=`<circle cx="${(r()*360).toFixed(0)}" cy="${(r()*h).toFixed(0)}" r="${(.5+r()*.9).toFixed(1)}"/>`;return `<g fill="#fff" opacity=".75">${s}</g>`}
function glow(cx,cy,r,c,a){const id=uid("gl");return {d:rg(id,c,a==null?.7:a),b:`<circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#${id})"/>`}}
function T(x,y,t,o){o=o||{};return `<text x="${x}" y="${y}" font-family="${o.f||"IBM Plex Mono,monospace"}" font-size="${o.s||10}" font-weight="${o.w||600}" fill="${o.c||C.gold}" text-anchor="${o.a||"middle"}" letter-spacing="${o.ls||.5}"${o.op?` opacity="${o.op}"`:""}>${t}</text>`}
/* pessoa de corpo inteiro; y = chão */
function P(x,y,s,o){o=o||{};const sk=o.skin||C.skin,top=o.top||C.violet,hc=o.hc||"#140F26",rim=o.rim||C.gold;
 let h=`<g transform="translate(${x} ${y}) scale(${s})">`;
 h+=`<path d="M-11 0 v-40 h22 v40 z" fill="${o.leg||C.deep}"/>`;
 h+=`<path d="M-18 -38 q0 -44 18 -46 q18 2 18 46 z" fill="${top}"/>`;
 if(o.bag)h+=`<path d="M10 -78 q14 2 12 30 l-4 4" fill="none" stroke="${C.deep}" stroke-width="4"/><rect x="12" y="-70" width="12" height="26" rx="4" fill="${o.bag}"/>`;
 if(o.tie)h+=`<path d="M0 -82 l-3 6 l3 22 l3 -22z" fill="${o.tie}"/>`;
 h+=`<rect x="-4" y="-92" width="8" height="10" fill="${sk}"/><circle cx="0" cy="-102" r="14" fill="${sk}"/>`;
 const hair={
  lia:`<path d="M-16 -100 q-2 -22 16 -22 q18 0 16 22 q0 14 -4 24 q-2 -12 -4 -20 q-10 2 -22 -6 q-2 10 -4 24 q-4 -10 2 -22z" fill="${hc}"/>`,
  bun:`<circle cx="0" cy="-120" r="7" fill="${hc}"/><path d="M-15 -100 q0 -18 15 -18 q15 0 15 18 q-6 -10 -15 -10 q-9 0 -15 10z" fill="${hc}"/>`,
  short:`<path d="M-14 -104 q0 -16 14 -16 q14 0 14 16 q-4 -8 -14 -8 q-10 0 -14 8z" fill="${hc}"/>`,
  bob:`<path d="M-16 -98 q-2 -24 16 -24 q18 0 16 24 v10 q-4 -2 -4 -12 q-12 -2 -22 -8 q-2 8 -2 20 q-4 0 -4 -10z" fill="${hc}"/>`,
  bald:`<path d="M-14 -106 q2 -8 6 -10" stroke="${hc}" stroke-width="3" fill="none"/>`
 }[o.hair||"short"];
 h+=hair;
 if(o.beard)h+=`<path d="M-11 -100 q0 14 11 15 q11 -1 11 -15 q-4 6 -11 6 q-7 0 -11 -6z" fill="${o.beard}"/>`;

 if(o.glasses)h+=`<g fill="none" stroke="${C.ink}" stroke-width="1.4"><circle cx="-5" cy="-101" r="4.2"/><circle cx="5" cy="-101" r="4.2"/><path d="M-1 -101h2"/></g>`;
 h+=o.sad?`<path d="M-4 -92 q4 -3 8 0" stroke="${C.ink}" stroke-width="1.6" fill="none"/>`:`<path d="M-4 -94 q4 3 8 0" stroke="${C.ink}" stroke-width="1.6" fill="none"/>`}
 h+=`<path d="M17 -38 q0 -40 -15 -46" fill="none" stroke="${rim}" stroke-width="1.6" opacity=".55"/>`;
 return h+`</g>`}
/* Lia em close de perfil iluminada */
function liaClose(x,y,s,light){light=light||"#B9A6F2";return `<g transform="translate(${x} ${y}) scale(${s})">
 <path d="M-60 130 q8 -70 70 -82 q50 -6 70 30 q14 26 10 52z" fill="${C.deep}"/>
 <path d="M-8 0 q30 -26 62 -6 q22 16 18 50 q-2 24 -18 34 q-10 8 -24 6 q-12 18 -30 12 q-20 -8 -18 -40 q-14 -26 10 -56z" fill="#2B2147"/>

 <path d="M50 10 q20 10 20 38" stroke="#FFE3D2" stroke-width="3" fill="none" opacity=".8"/>
 <circle cx="62" cy="36" r="2.6" fill="${C.ink}"/><path d="M58 30 q5 -3 9 0" stroke="${C.ink}" stroke-width="1.6" fill="none"/>
 <path d="M-8 0 q30 -30 70 -4 q-10 -2 -18 8 q-30 -14 -52 -4z" fill="#140F26"/>
 <path d="M70 50 L118 44 L126 110 L76 82Z" fill="${light}" opacity=".16"/></g>`}
function phone(x,y,w,h,rot,inner){const id=uid("ph");return {d:lg(id,[[0,"#D9CCFF"],[1,"#8F7AE6"]]),b:`<g transform="rotate(${rot||0} ${x+w/2} ${y+h/2})"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${w*.16}" fill="${C.ink}"/><rect x="${x+3}" y="${y+5}" width="${w-6}" height="${h-10}" rx="${w*.1}" fill="url(#${id})"/>${inner||""}</g>`}}
function congress(x,y,s,fill,lit){return `<g transform="translate(${x} ${y}) scale(${s})" fill="${fill||C.ink}">
 <rect x="-14" y="-128" width="11" height="128"/><rect x="3" y="-128" width="11" height="128"/><rect x="-14" y="-78" width="28" height="5"/>
 <rect x="-150" y="-2" width="300" height="12"/><path d="M-108 -2 a34 18 0 0 1 68 0z"/><path d="M42 -16 q34 26 68 0 l-4 14 h-60z"/>
 ${lit?`<g fill="${C.gold}" opacity=".85"><rect x="-12" y="-122" width="2" height="2"/><rect x="-8" y="-108" width="2" height="2"/><rect x="6" y="-116" width="2" height="2"/><rect x="10" y="-96" width="2" height="2"/><rect x="-12" y="-48" width="2" height="2"/><rect x="6" y="-34" width="2" height="2"/><rect x="-8" y="-22" width="2" height="2"/></g>`:""}</g>`}
function arcSeats(cx,cy,rows,r0,dr,n0,dn,col,lit,litCol){let s="",k=0;for(let i=0;i<rows;i++){const r=r0+i*dr,n=n0+i*dn;for(let j=0;j<n;j++){const a=Math.PI*(1-(j+.5)/n);const x=cx+r*Math.cos(a),y=cy-r*Math.sin(a)*.55;s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(2.6+i*.35).toFixed(1)}" fill="${lit&&((k*7)%10<lit)?litCol:col}"/>`;k++}}return s}
function street(h,y,wet){const id=uid("st");return {d:lg(id,[[0,"#3A2A5A"],[1,C.bg]],1),b:`<rect y="${y}" width="360" height="${h-y}" fill="url(#${id})"/>${wet?`<g stroke="${C.gold}" stroke-width="1" opacity=".5"><path d="M40 ${y+14}h50M150 ${y+26}h70M250 ${y+12}h60M80 ${y+40}h40M200 ${y+52}h90"/></g>`:""}`}}
function lamp(x,y,h){const g=glow(x+14,y-h+6,60,"#FFD8A6",.55);return {d:g.d,b:`${g.b}<path d="M${x} ${y}v-${h}q0 -6 8 -6h8" stroke="${C.ink}" stroke-width="3" fill="none"/><circle cx="${x+16}" cy="${y-h-2}" r="3.5" fill="#FFE2B8"/>`}}

function J(...parts){let d="",b="";for(const p of parts){if(typeof p==="string")b+=p;else{d+=p.d||"";b+=p.b||""}}return {d,b}}
function W(h,...parts){const j=J(...parts);return SV(h,j.b,j.d)}

/* ícones simples */
const IC={

 drain:(x,y,c)=>`<g transform="translate(${x} ${y})"><rect x="-16" y="-8" width="32" height="16" rx="3" fill="${c||C.gold}"/><path d="M-10 -8v16M-3 -8v16M4 -8v16M11 -8v16" stroke="${C.bg}" stroke-width="2.4"/></g>`,

const FONTES={
 cf2:{s:"Constituição, art. 2º e 18",t:"Constituição Federal, art. 2º: são Poderes da União, independentes e harmônicos, o Legislativo, o Executivo e o Judiciário; art. 18: a organização do país compreende União, estados, Distrito Federal e municípios, todos autônomos",u:CF},

 cf211:{s:"Constituição, art. 211",t:"Constituição, art. 211: a União organiza o sistema federal de ensino e financia as instituições federais; os municípios atuam prioritariamente no ensino fundamental e na educação infantil; os estados, no ensino fundamental e médio",u:CF},
 cf21:{s:"Constituição, art. 21",t:"Constituição, art. 21, VII: compete à União emitir moeda",u:CF},
 cf144:{s:"Constituição, art. 144",t:"Constituição, art. 144: a segurança pública é exercida pela Polícia Federal, pela Polícia Rodoviária Federal e pela Polícia Ferroviária Federal (União), e pelas polícias civis, militares, penais e corpos de bombeiros (estados); os municípios podem criar guardas municipais",u:CF},
 cf198:{s:"Constituição, art. 198",t:"Constituição, art. 198: as ações e serviços de saúde formam o SUS, uma rede única e regionalizada, financiada com recursos da União, dos estados e dos municípios",u:CF},
 cf92:{s:"Constituição, art. 92",t:"Constituição, art. 92: os órgãos do Poder Judiciário são o STF, o CNJ, o STJ, o TST, os tribunais e juízes federais, do trabalho, eleitorais, militares e dos estados; a lista não inclui juízes municipais, por isso não existe Judiciário municipal",u:CF},

 cf45:{s:"Constituição, art. 44 a 46",t:"Constituição, art. 44: cada legislatura dura 4 anos; art. 45: a Câmara dos Deputados é composta de representantes do povo, eleitos pelo sistema proporcional; art. 46: cada estado e o DF elegem 3 senadores, com mandato de 8 anos",u:CF},
 cam513:{s:"STF, 2025",t:"STF (29/set/2025): o Supremo manteve em 513 o número de deputados federais para as eleições de 2026",u:"https://noticias.stf.jus.br/postsnoticias/supremo-mantem-numero-de-deputados-federais-para-2026/"},
 sen_orc:{s:"Agência Senado, 2026",t:"Agência Senado (15/jan/2026): o Orçamento de 2026 foi sancionado (Lei 15.346) com previsão de aproximadamente R$ 61 bilhões em emendas parlamentares; cerca de R$ 400 milhões em emendas foram vetados",u:"https://www12.senado.leg.br/noticias/materias/2026/01/15/orcamento-2026-e-sancionado-com-previsao-de-superavit-de-rs-34-2-bi"},
 cf_el:{s:"Constituição, art. 28, 29 e 77",t:"Constituição, art. 28, 29 e 77: presidente e governadores são eleitos no primeiro domingo de outubro; prefeitos e vereadores têm eleição própria; mandatos de 4 anos (senador, 8)",u:CF},
 lei9504:{s:"Lei 9.504/1997, art. 1º",t:"Lei das Eleições (9.504/1997), art. 1º: as eleições para presidente, governador, senador e deputados ocorrem simultaneamente; as de prefeito e vereador também são simultâneas, em todo o país",u:"https://www.planalto.gov.br/ccivil_03/leis/l9504.htm"},
 cf61:{s:"Constituição, art. 61",t:"Constituição, art. 61: podem propor leis deputados, senadores, comissões, o presidente da República, o STF e tribunais superiores, o procurador-geral da República e os cidadãos; a iniciativa popular exige assinaturas de 1% do eleitorado nacional, em pelo menos 5 estados, com pelo menos 0,3% dos eleitores de cada um",u:CF},
 camtram:{s:"Câmara, Entenda o processo legislativo",t:"Câmara dos Deputados: os projetos de lei começam na Câmara, exceto os apresentados por senador ou comissão do Senado; o presidente da Câmara distribui o projeto a até três comissões temáticas; em cada uma, um relator analisa e pode mudar o texto",u:"https://www.camara.leg.br/entenda-o-processo-legislativo/"},
 camconc:{s:"Câmara, Guia para jornalistas",t:"Câmara dos Deputados: a Mesa define se o projeto vai ao Plenário ou se tem caráter conclusivo (decidido só pelas comissões); ele perde o caráter conclusivo se houver decisão divergente entre comissões ou recurso assinado por 52 deputados",u:"https://www2.camara.leg.br/comunicacao/assessoria-de-imprensa/guia-para-jornalistas/tramitacao-das-proposicoes"},
 camconc80:{s:"Câmara dos Deputados",t:"Câmara dos Deputados: mais de 80% das propostas não precisam ser votadas pelo Plenário, bastando o parecer das comissões (tramitação conclusiva)",u:"https://www.camara.leg.br/comissoes?ano=2019"},
 camvot:{s:"Câmara, Guia para jornalistas",t:"Câmara dos Deputados: para começar uma votação no Plenário, é preciso o quórum mínimo de 257 deputados presentes",u:"https://www2.camara.leg.br/comunicacao/assessoria-de-imprensa/guia-para-jornalistas/votacao"},
 cf47:{s:"Constituição, art. 47",t:"Constituição, art. 47: salvo disposição em contrário, as deliberações de cada Casa são tomadas por maioria dos votos, presente a maioria absoluta de seus membros",u:CF},
 cf65:{s:"Constituição, art. 65",t:"Constituição, art. 65: o projeto aprovado por uma Casa é revisto pela outra; se a Casa revisora o alterar, ele volta à Casa onde começou",u:CF},
 cf66:{s:"Constituição, art. 66",t:"Constituição, art. 66: o presidente sanciona ou veta, no todo ou em parte, em 15 dias úteis; se ficar em silêncio, a sanção é automática; o veto é analisado em sessão conjunta do Congresso e só cai com a maioria absoluta dos deputados (257) e dos senadores (41)",u:CF},
 cf62:{s:"Constituição, art. 62",t:"Constituição, art. 62: em caso de relevância e urgência, o presidente pode editar medida provisória, com força de lei imediata; ela perde a validade se o Congresso não a aprovar em 60 dias, prorrogáveis uma vez por mais 60",u:CF},
 cf60:{s:"Constituição, art. 60",t:"Constituição, art. 60: a emenda à Constituição é votada em dois turnos em cada Casa e precisa de 3/5 dos votos (308 deputados e 49 senadores); não passa por sanção do presidente; algumas cláusulas não podem ser abolidas, como o voto direto e os direitos individuais",u:CF},
 cf101:{s:"Constituição, art. 101 a 103",t:"Constituição, art. 101: o STF tem 11 ministros, nomeados pelo presidente depois de aprovados pela maioria absoluta do Senado; art. 102: cabe ao STF julgar se uma lei é inconstitucional; art. 103: podem pedir isso, entre outros, o presidente, governadores, as Mesas da Câmara, do Senado e das Assembleias, o procurador-geral, a OAB e partidos com representação no Congresso",u:CF},
 cf70:{s:"Constituição, art. 70 e 71",t:"Constituição, art. 70 e 71: a fiscalização do dinheiro da União é feita pelo Congresso, com auxílio do Tribunal de Contas da União, que julga as contas de quem usa recursos federais",u:CF},
 cf127:{s:"Constituição, art. 127 e 129",t:"Constituição, art. 127 e 129: o Ministério Público defende a ordem jurídica e o interesse público, e pode abrir investigações e ações para proteger o patrimônio público",u:CF},
 cf58:{s:"Constituição, art. 58",t:"Constituição, art. 58, § 3º: uma CPI é criada a pedido de um terço dos membros da Casa (171 deputados ou 27 senadores), para apurar fato determinado, por prazo certo",u:CF},
 cf51:{s:"Constituição, art. 51, 52 e 86",t:"Constituição: a Câmara autoriza, por 2/3 dos deputados (342), o processo de impeachment do presidente; o Senado julga, e a condenação exige 2/3 dos senadores (54)",u:CF},
 cf14:{s:"Constituição, art. 14",t:"Constituição, art. 14: o voto é obrigatório para maiores de 18 anos e facultativo para quem tem 16 ou 17 anos, para maiores de 70 e para analfabetos",u:CF},
 em26:{s:"Congresso em Foco, 2025",t:"Congresso em Foco (19/dez/2025): o Orçamento de 2026 aprovado pelo Congresso prevê R$ 61,4 bilhões em emendas parlamentares",u:"https://www.congressoemfoco.com.br/noticia/115071/congresso-aprova-orcamento-de-2026-com-superavit-de-r-34-5-bilhoes"},

const ROTEIRO=[
/* ===== ATO 1 · COMEÇO: os três andares ===== */
{a:1,art:"chuva-rua",cap:"Vila Serena, uma cidade inventada. Março, 7 da manhã. Pela terceira vez no mês, a rua da escola da Lia virou rio.",fala:[["Lia","De novo? Eu tenho prova hoje!"]]},
{a:1,art:"celular-post",cap:"Lia, 16 anos, faz o que todo mundo faz: grava um vídeo e marca o presidente, o governador e o prefeito.",fala:[["Lia","Alguém vai resolver isso ou não?"]],nota:null},
{a:1,art:"silencio",cap:"Três dias. Duzentas curtidas. Nenhuma resposta.",fala:[]},
{a:1,art:"sala-aula",cap:"Na aula de sociologia, o professor Davi vê o vídeo.",fala:[["Davi","Você marcou três pessoas. Sabe qual delas cuida da sua rua?"],["Lia","…O presidente? Ele manda em tudo, não manda?"],["Davi","Não manda. O Brasil funciona como um prédio de três andares."]]},
{a:1,art:"predio-3-andares",cap:"Andar de cima: a União. No meio: os estados. Embaixo: os municípios. Cada andar tem seu governo e suas tarefas. Nenhum é chefe do outro, mas todos seguem a Constituição e as leis nacionais.",nota:"O Brasil tem União, estados, Distrito Federal e municípios, todos com autonomia. [[cf2]]"},
{a:1,art:"andar-municipio",cap:"No térreo, a prefeitura cuida do que é da cidade: rua, ônibus municipal, coleta de lixo, creche e ensino fundamental (junto com o estado), posto de saúde.",nota:"Os municípios cuidam dos assuntos de interesse local, do transporte coletivo e, com ajuda da União e do estado, da educação infantil, do ensino fundamental e do atendimento à saúde. [[cf30]] [[cf211]]"},
{a:1,art:"andar-estado",cap:"No meio, o governo do estado: Polícia Militar e Polícia Civil, o ensino médio (a escola da Lia é estadual) e os hospitais da rede estadual.",nota:"A Polícia Militar e a Polícia Civil são dos estados; os estados cuidam prioritariamente do ensino fundamental e médio. [[cf144]] [[cf211]]"},
{a:1,art:"andar-uniao",cap:"No alto, o governo federal: Polícia Federal, Forças Armadas, universidades federais, a moeda e o dinheiro que ajuda os outros andares.",nota:"A Polícia Federal e a Polícia Rodoviária Federal são da União, que também mantém as instituições federais de ensino e emite a moeda. [[cf144]] [[cf211]] [[cf21]]"},
{a:1,art:"sus-escada",cap:"E a saúde? É a escada que liga os três andares: o SUS é um só, pago pela União, pelos estados e pelos municípios.",nota:"O SUS é uma rede única, financiada pelos três níveis de governo. [[cf198]]"},
{a:1,art:"lia-entende",fala:[["Lia","Então a rua alagada é com a prefeitura."],["Davi","Isso. Escoar a água da chuva na cidade é serviço municipal."]],nota:"A drenagem da água da chuva faz parte do saneamento básico, e os municípios são os titulares desse serviço. [[san]]"},
{a:1,art:"tres-poderes",cap:"E em cada andar o poder é dividido. Quem executa: prefeito, governador, presidente. Quem faz as leis e fiscaliza: vereadores, deputados estaduais, deputados federais e senadores. Quem julga são os juízes, que só existem nos estados e na União.",nota:"Os três Poderes são independentes e harmônicos. O município tem só Executivo e Legislativo: não existe Judiciário municipal. [[cf2]] [[cf29]] [[cf92]]"},
{a:1,art:"prefeitura-balcao",cap:"Na prefeitura, a resposta é curta.",fala:[["Secretário","A obra está no plano. Falta dinheiro. Talvez em 2030."]]},
{a:1,art:"camara-municipal",cap:"Lia tenta o andar de baixo do Legislativo: a Câmara Municipal. A vereadora Marta escuta.",fala:[["Marta","Posso cobrar a prefeitura, e vou. Mas obra grande de drenagem quase sempre depende de dinheiro de Brasília."],["Lia","Então eu preciso falar com quem faz lei lá em cima."]],nota:"A Câmara Municipal fiscaliza a prefeitura, com ajuda do Tribunal de Contas. [[cf29]]"},

/* ===== ATO 2 · MEIO: a viagem de uma lei ===== */
{a:2,art:"email-deputado",cap:"Lia escreve para Otávio, deputado federal eleito pelo estado dela. Ele lê, responde e propõe um projeto: Escolas sem Alagamento, que dá prioridade, nas verbas federais de drenagem, às ruas em volta de escolas públicas.",nota:"Podem propor leis federais: deputados, senadores, comissões, o presidente, alguns tribunais, o procurador-geral e até os cidadãos, com assinaturas de 1% do eleitorado. [[cf61]]"},
{a:2,art:"protocolo",cap:"O projeto ganha número. Como foi um deputado que propôs, a viagem começa pela Câmara.",nota:"Projetos começam na Câmara, exceto os de senadores ou comissões do Senado. [[camtram]]"},
{a:2,art:"comissoes",cap:"Primeira parada: as comissões. Desenvolvimento Urbano e Educação olham o mérito. Finanças pergunta quanto custa. Constituição e Justiça confere se a lei respeita a Constituição. Em cada uma, um relator pode mudar o texto.",nota:"O projeto é distribuído às comissões, e em cada uma um relator analisa e pode mudar o texto. [[camtram]]"},
{a:2,art:"atalho-comissoes",cap:"Surpresa da Lia: a maioria dos projetos nem chega ao plenário. As comissões decidem sozinhas. Mas 52 deputados assinaram um recurso, e o projeto foi a voto no plenário.",nota:"Mais de 80% das propostas são decididas só pelas comissões; um recurso de 52 deputados leva o projeto ao Plenário. [[camconc80]] [[camconc]]"},
{a:2,art:"brasilia-noite",cap:"Brasília, 19h. A ideia que nasceu numa rua alagada precisa agora passar por 594 pessoas: 513 deputados e 81 senadores.",nota:"[[cam513]] [[cf45]]"},
{a:2,art:"plenario-camara",cap:"No plenário, um projeto comum passa com a maioria dos deputados presentes, desde que pelo menos 257 estejam lá. O painel acende.",fala:[["Lia","Aprovado!"],["Otávio","Calma. Isso foi só metade."]],nota:"A votação exige 257 deputados presentes, e o projeto passa por maioria dos votos. [[camvot]] [[cf47]]"},
{a:2,art:"senado",cap:"No Senado, 81 senadores, três por estado, revisam o texto. Eles mudam um artigo: o prazo para as obras sobe de 2 para 3 anos. Com a mudança, o projeto volta à Câmara, que só vota o que foi alterado.",nota:"A Casa revisora pode mudar o texto; se mudar, ele volta à Casa onde começou. [[cf65]] [[cf45]]"},
{a:2,art:"sancao",cap:"O projeto chega ao presidente. Ele tem 15 dias úteis. Sanciona quase tudo, mas veta um artigo: o que obrigava a União a pagar 100% das obras. Motivo, segundo o veto: custo. Vetar é um instrumento normal do presidente.",nota:"O presidente pode sancionar ou vetar no todo ou em parte; se ficar em silêncio por 15 dias úteis, a lei é sancionada automaticamente. [[cf66]]"},
{a:2,art:"veto-derrubado",cap:"O veto volta ao Congresso, em sessão conjunta. Para derrubá-lo, não basta a maioria dos presentes: são precisos 257 deputados e 41 senadores. Por pouco, o veto cai. Derrubar vetos é um instrumento normal do Congresso.",nota:"Derrubar um veto exige a maioria absoluta das duas Casas. [[cf66]]"},
{a:2,art:"outras-estradas",cap:"Professor Davi, no grupo da turma: existem outras estradas. A medida provisória do presidente vale na hora, mas perde a validade se o Congresso não aprovar em 60 dias, prorrogáveis por mais 60. E mudar a Constituição exige 3/5 em dois turnos nas duas Casas, sem passar pelo presidente.",nota:"[[cf62]] [[cf60]]"},

{a:3,art:"stf-acao",cap:"Publicada a lei, um governador vai ao STF: diz que Brasília está se metendo no que é dos estados e municípios. É o caminho previsto para quem acha uma lei inconstitucional.",nota:"Governadores, o presidente, partidos, a OAB e outros podem pedir ao STF que diga se uma lei é inconstitucional. [[cf101]]"},
{a:3,art:"stf-plenario",cap:"Onze ministros, indicados por presidentes e aprovados pelo Senado. O STF não faz leis: diz se elas respeitam a Constituição. Por 8 a 3, a lei da Lia fica de pé.",nota:"O STF tem 11 ministros, nomeados pelo presidente depois de aprovados pelo Senado. [[cf101]]"},
{a:3,art:"debate-emendas",cap:"Enquanto isso, a vereadora Marta comenta outro caminho do dinheiro: as emendas parlamentares, a parte do Orçamento que deputados e senadores indicam para onde vai.",nota:"O Orçamento aprovado pelo Congresso previa R$ 61,4 bilhões em emendas para 2026; na sanção, cerca de R$ 400 milhões foram vetados. [[em26]] [[sen_orc]] O ministro Flávio Dino, do STF, vem determinando regras para rastrear esse dinheiro; numa decisão, falou em um \"mercado de terceirização\" de emendas. [[dino_est]] [[dino_terc]]",debate:{
  t:"O debate de verdade: emendas e o STF",

  con:"Quem critica, como as entidades Transparência Brasil e Contas Abertas, aponta profunda opacidade no uso desse dinheiro e pediu ao STF regras para rastrear esse dinheiro. [[dino_est]]"}},
{a:3,art:"obra",cap:"O dinheiro chega à prefeitura. Licitação, máquinas, buracos. Quem vigia? O Tribunal de Contas da União, porque o dinheiro dessa lei é federal. O Ministério Público. E a vereadora Marta, com a Lia do lado.",nota:"O dinheiro da União é fiscalizado pelo Congresso com ajuda do TCU; o Ministério Público pode investigar o uso do patrimônio público. [[cf70]] [[cf127]] [[cf29]]"},
{a:3,art:"freios",cap:"E se algo grave acontecer lá em cima? O Congresso pode abrir uma CPI, com a assinatura de um terço da Casa. E pode até afastar um presidente: a Câmara autoriza com 2/3, e o Senado julga.",nota:"[[cf58]] [[cf51]]"},
{a:3,art:"chuva-seca",cap:"Anos depois. Março, 7 da manhã. Chove forte. A rua da escola continua rua.",fala:[["Vó Cida","Olha só. Nem molhou o sapato."]]},
{a:3,art:"urna",cap:"Outubro, eleição geral. Lia vota para presidente, governador, senador e deputados, sabendo o que cada um faz. Dois anos depois, na eleição municipal, ela escolhe prefeito e vereador.",nota:"Presidente, governador, senadores e deputados são eleitos juntos; prefeitos e vereadores, numa eleição separada. Aos 16 e 17 anos o voto é opcional; a partir dos 18, obrigatório. [[cf_el]] [[lei9504]] [[cf14]]"},

/* Epílogo (tela final, sem pergunta): mapa "quem cuida de quê" + "a quem reclamar" + o debate + avaliação + fontes. */
const QUEM=[
 ["Rua, buraco e alagamento","Prefeitura","cf30 san"],
 ["Ônibus da cidade","Prefeitura","cf30"],
 ["Creche e ensino fundamental","Prefeitura (e estado, no fundamental)","cf211"],
 ["Ensino médio","Governo do estado","cf211"],
 ["Universidade federal","Governo federal","cf211"],
 ["Polícia Militar e Polícia Civil","Governo do estado","cf144"],
 ["Polícia Federal","Governo federal","cf144"],
 ["Posto de saúde","Prefeitura (com dinheiro dos três)","cf30 cf198"],
 ["Hospital do SUS","Depende de quem administra: prefeitura, estado ou União","cf198"]
];

const KEY="pmu-lia-v1";let S;try{S=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){S=null}if(!S)S={last:0,fb:{}};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const src=h=>String(h).replace(/\[\[([a-z0-9_]+)\]\]/g,(m,k)=>FONTES[k]?`<button type="button" class="fn" data-f="${k}" aria-label="Ver fonte: ${esc(FONTES[k].s)}">🔎 ${esc(FONTES[k].s)}</button>`:"");
const tx=h=>src(esc(h).replace(/&quot;/g,'"'));
const LEFT={Lia:1};
const ATOS={1:["1","Os três andares","Quem cuida da sua rua?"],2:["2","A viagem de uma lei","Do e-mail ao Diário Oficial"],3:["3","Da lei à rua","Quem decide, quem paga, quem vigia"]};
function build(){let h=`<section class="cover"><div class="art">${ART["chuva-rua"]()}</div>
 <div class="k">Pense Mais Uma · história em quadrinhos</div><h1>Quem resolve o quê no Brasil: prefeito, governador, Congresso ou STF?</h1>
 <p class="lead">A rua da escola da Lia alaga toda chuva. Para resolver, ela vai ter que entender como o país funciona.</p>
 <button class="go" id="start">${S.last>2?"CONTINUAR A HISTÓRIA":"COMEÇAR A LER"}</button>${S.last>2?`<button class="go ghost" id="restart">LER DO COMEÇO</button>`:""}
 <p class="small">Sem perguntas e sem pontos: é só rolar a tela. Cerca de 10 minutos. A cidade e as pessoas são inventadas; as regras e os números são reais, e cada um tem fonte em "Como é de verdade". Dados atualizados em novembro de 2026.</p></section>`;
 let la=0;ROTEIRO.forEach((c,i)=>{if(c.a!==la){la=c.a;const [n,t,s]=ATOS[la];h+=`<section class="act" data-i="${i}"><div class="n">${n}</div><div class="k">${la===1?"Começo":la===2?"Meio":"Fim"}</div><div class="t">${t}</div><div class="s">${s}</div></section>`}
  h+=`<section class="sc" id="c${i}" data-i="${i}"><div class="art">${ART[c.art]()}</div>${c.cap?`<p class="cap">${tx(c.cap)}</p>`:""}
  ${c.fala&&c.fala.length?`<div class="bls">${c.fala.map(([q,t])=>`<div class="bl ${LEFT[q]?"l":"r"}"><small>${esc(q)}</small>${esc(t)}</div>`).join("")}</div>`:""}
  ${c.debate?`<div class="deb"><div class="k">Não existe resposta certa</div><h3>${esc(c.debate.t)}</h3><div class="two"><div><b>QUEM DEFENDE</b>${tx(c.debate.pro)}</div><div><b>QUEM CRITICA</b>${tx(c.debate.con)}</div></div></div>`:""}
  ${c.nota?`<details class="nota"><summary>COMO É DE VERDADE</summary><p>${tx(c.nota)}</p></details>`:""}</section>`;
  if(i===0)h+=`<div class="hint">ROLE PARA CONTINUAR ↓</div>`});
 h+=`<section class="end" id="end"><div class="box"><h2>Quem cuida de quê</h2><p style="font-size:13.5px;color:var(--mut);margin:0 0 8px">Para saber a quem reclamar. Simplificado: muitas coisas são divididas entre os andares. Toque em 🔎 para ver a fonte.</p><div class="quem">${QUEM.map(([a,b,f])=>`<span>${esc(a)}<br>${f.split(" ").map(k=>src("[["+k+"]]")).join("")}</span><span>${esc(b)}</span>`).join("")}</div></div>
 <div class="box"><h2>Quer se aprofundar?</h2><p style="font-size:14px;line-height:1.55;margin:0"><b>Como se fazem as leis</b>, de Luciana Botelho Pacheco (Edições Câmara): o caminho de um projeto, explicado pela própria Câmara.<br><br><b>Presidencialismo de coalizão</b>, de Sérgio Abranches: por que o presidente precisa de alianças no Congresso para governar.<br><br><a href="https://www.youtube.com/results?search_query=como+nasce+uma+lei+C%C3%A2mara+dos+Deputados" target="_blank" rel="noopener">Vídeos sobre como nasce uma lei (busca no YouTube)</a><br><a href="https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm" target="_blank" rel="noopener">A Constituição, na íntegra</a></p></div>
 <div class="box"><h2>Avalie a história</h2><p style="font-size:14px">Que nota você dá?</p><div class="rate">${[1,2,3,4,5].map(x=>`<button data-n="${x}" class="${S.fb.nota===x?"on":""}">${x}</button>`).join("")}</div>
 <p style="font-size:14px">O que você aprendeu que não sabia?</p><textarea id="apr" rows="2">${esc(S.fb.apr||"")}</textarea>
 <p style="font-size:14px">Sentiu que a história favoreceu algum lado?</p><select id="lado"><option value="">Escolha</option>${["Não","Sim, favoreceu o governo","Sim, favoreceu o Congresso","Sim, favoreceu o STF","Não sei"].map(o=>`<option ${S.fb.lado===o?"selected":""}>${o}</option>`).join("")}</select>
 <p style="font-size:14px">Comentário</p><textarea id="com" rows="2">${esc(S.fb.com||"")}</textarea>
 <p style="font-size:14px">Que tema você quer que vire história?</p><textarea id="tema" rows="2">${esc(S.fb.tema||"")}</textarea>
 <button class="go" id="env" style="margin-top:12px">${S.fb.sent?"AVALIAÇÃO ENVIADA ✓":"ENVIAR AVALIAÇÃO"}</button></div>
 <div class="box"><h2>Fontes</h2><ul class="fontes">${Object.values(FONTES).map(f=>`<li>${esc(f.t)}${f.u?` · <a href="${f.u}" target="_blank" rel="noopener">abrir</a>`:""}</li>`).join("")}</ul></div>
 <button class="go ghost" id="top">VOLTAR AO INÍCIO</button></section>`;
 document.getElementById("app").innerHTML=h}
build();
const scs=[...document.querySelectorAll(".sc")];
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");const i=+e.target.dataset.i;if(i>S.last){S.last=i;save()}}}),{threshold:.18});
scs.forEach(s=>io.observe(s));
const bar=document.querySelector("#bar i");addEventListener("scroll",()=>{const m=document.documentElement.scrollHeight-innerHeight;bar.style.width=(m>0?scrollY/m*100:0)+"%"},{passive:true});
const go=i=>{const el=document.getElementById("c"+i);if(el)el.scrollIntoView({behavior:"smooth"})};
document.getElementById("start").onclick=()=>go(S.last>2?S.last:0);
const rs=document.getElementById("restart");if(rs)rs.onclick=()=>{S.last=0;save();go(0)};
document.getElementById("top").onclick=()=>scrollTo({top:0,behavior:"smooth"});
document.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{S.fb.nota=+b.dataset.n;save();document.querySelectorAll("[data-n]").forEach(x=>x.classList.toggle("on",x===b))});
["apr","com","tema"].forEach(k=>document.getElementById(k).oninput=e=>{S.fb[k]=e.target.value;save()});
document.getElementById("lado").onchange=e=>{S.fb.lado=e.target.value;save()};
document.getElementById("env").onclick=e=>{S.fb.sent=true;try{const q=JSON.parse(localStorage.getItem("pmu-fila")||"[]");q.push({curso:"quem-resolve-o-que",quando:new Date().toISOString(),...S.fb});localStorage.setItem("pmu-fila",JSON.stringify(q))}catch(x){}save();e.target.textContent="AVALIAÇÃO ENVIADA ✓"};
const pop=document.getElementById("fnpop");
document.addEventListener("click",e=>{const b=e.target.closest(".fn");if(b){e.preventDefault();e.stopPropagation();const f=FONTES[b.dataset.f];if(!f)return;document.getElementById("fnbody").innerHTML=`<b>Fonte</b><br>${esc(f.t)}${f.u?`<br><a href="${f.u}" target="_blank" rel="noopener">Abrir a fonte ↗</a>`:""}`;pop.style.display="block";return}
 if(e.target.closest("#fnpop .x")||!e.target.closest("#fnpop"))pop.style.display="none"},true);
</script>
</body></html>
