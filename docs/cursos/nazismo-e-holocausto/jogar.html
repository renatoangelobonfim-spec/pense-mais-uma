.step .y{font:700 1.05rem "Playfair Display",serif;color:var(--amb);min-width:84px}

.warn{border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:.9rem;color:#CFC7B8;background:rgba(255,255,255,.02)}
textarea,select{width:100%;font:inherit;border:1px solid var(--line);border-radius:12px;padding:10px;background:#111720;color:var(--ink)}

  app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>b.classList.toggle("open"));bind();break}
 case "decision":{h+=`<span class="date">${t.d}</span><h2>${t.h}</h2><p class="mute">${t.ctx}</p>`;
  h+=t.o.map((o,k)=>`<button class="opt ${A.v===k?'on':''}" data-k="${k}" ${A.v!=null?"disabled":""}>${o}${A.v===k?"<span>✓</span>":""}</button>`).join("");
  if(A.v!=null&&t.pq&&A.p==null){h+=`<div class="card"><b>${t.pq}</b>${t.po.map((o,k)=>`<button class="opt" data-p="${k}">${o}</button>`).join("")}</div>`}
  const done=A.v!=null&&(t.pq?A.p!=null:true);
  if(done){if(t.pq){h+=`<div class="card"><b>${t.pq}</b>${t.po.map((o,k)=>{const c=k===t.pa?"ok":k===A.p?"no":"";return `<button class="opt ${c}" disabled>${o}</button>`}).join("")}<div class="fb" style="margin-bottom:0"><b>${t.np?"A resposta está marcada em verde.":A.p===t.pa?"Boa previsão. +10 pontos":"A resposta certa está marcada em verde."}</b></div></div>`}
   if(t.byopt)h+=`<div class="fb"><b>Sobre a sua escolha</b>${src(t.byopt[A.v])}</div>`;
   h+=`<div class="card"><p class="kick" style="margin-top:0">O que aconteceu de verdade</p>${t.hemi?hemi():""}<p style="margin-bottom:0">${src(t.rev)}</p></div>`}
  h+=nav(done);frame(h);
  app.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{S.ans[t.id]={v:+b.dataset.k};save();render()});
  app.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{A.p=+b.dataset.p;S.ans[t.id]=A;if(!t.np){if(A.p===t.pa){addPts(10);snd("ok")}else snd("no")}save();render()});bind();break}
 case "stairs":{A.n=A.n||0;h+=`<h2>${t.h}</h2><div class="stairs">${t.it.map((s,k)=>k<A.n?`<div class="step"><span class="y">${s[0]}</span><span class="d">${src(s[1])}</span></div>`:k===A.n?`<button class="step" data-s="${k}"><span class="y">${s[0]}</span><span class="d" style="color:var(--amb2)">Toque para ver o que aconteceu →</span></button>`:`<div class="step lock"><span class="y">${s[0]}</span><span class="d">…</span></div>`).join("")}</div>`;
  if(A.n>=t.it.length)h+=`<div class="fb"><b>Cinco anos, cinco degraus</b>${src("Em 1938, os judeus alemães já tinham perdido a cidadania, os cargos no serviço público e o direito de ter negócios. [[nur]] [[laws]]")}</div>`;
  h+=nav(A.n>=t.it.length);frame(h);
  app.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{A.n++;S.ans[t.id]=A;save();const y=window.scrollY;render();window.scrollTo(0,y)});bind();break}
 case "debate":{h+=`<h2>${t.h}</h2><div class="two"><div><b>${t.a.t}</b><p>${src(t.a.b)}</p></div><div><b>${t.bb.t}</b><p>${src(t.bb.b)}</p></div></div><div class="fb"><p style="margin:0">${src(t.foot)}</p></div>`+nav(true);frame(h);bind();break}
 case "flash":{A.r=A.r||[];h+=`<h2>${t.h}</h2>`+t.it.map((it,k)=>{const r=A.r[k];return `<div class="card"><b>${it.t}</b><div class="pick">${t.ch.map((c,j)=>{let cl="";if(r!=null)cl=j===it.a?"ok":j===r?"no":"";return `<button class="${cl}" data-it="${k}" data-c="${j}" ${r!=null?"disabled":""}>${c}</button>`}).join("")}</div>${r!=null?`<p class="mute" style="margin:6px 0 0">${src(it.e)}</p>`:""}</div>`}).join("");
  h+=nav(t.it.every((_,k)=>A.r[k]!=null));frame(h);
  app.querySelectorAll("[data-it]").forEach(b=>b.onclick=()=>{A.r[+b.dataset.it]=+b.dataset.c;S.ans[t.id]=A;save();const y=window.scrollY;render();window.scrollTo(0,y)});bind();break}
 case "recap":{const rows=["d1","d2","d3","d4"].map(id=>{const d=T.find(x=>x.id===id);const a=S.ans[id]||{};return `<div class="cmp"><div><small>${d.d}: você</small>${a.v!=null?d.o[a.v]:"—"}</div><div><small>O que aconteceu</small>${({d1:"Hitler foi nomeado chanceler.",d2:"A lei passou por 444 a 94.",d3:"Muitos assistiram; poucos ajudaram.",d4:"Só a República Dominicana aceitou mais refugiados."})[id]}</div></div>`}).join('<div style="height:8px"></div>');
  h+=`<h2>${t.h}</h2>${rows}<div class="fb"><b>Pessoas comuns também ajudaram</b>Até 1º de janeiro de 2024, o Yad Vashem tinha reconhecido 28.707 pessoas de 51 países como Justos entre as Nações. Os números não mostram toda a ajuda que existiu: só os casos documentados. [[ushmmrj]]</div>`.replace(/\[\[([a-z0-9_]+)\]\]/g,m=>src(m))+nav(true);frame(h);bind();break}
 case "quiz":{A.r=A.r||[];h+=`<h2>${t.h}</h2>`+t.qs.map((q,k)=>{const r=A.r[k];return `<div class="card"><b>${k+1}. ${q.q}</b>${q.o.map((o,j)=>{let c="";if(r!=null)c=j===q.a?"ok":j===r?"no":"";return `<button class="opt ${c}" data-q="${k}" data-j="${j}" ${r!=null?"disabled":""}>${o}</button>`}).join("")}${r!=null?`<p class="mute" style="margin:6px 0 0">${r===q.a?"Certo. +10. ":""}${q.e}</p>`:""}</div>`}).join("");
  h+=nav(t.qs.every((_,k)=>A.r[k]!=null));frame(h);
  app.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{const k=+b.dataset.q,j=+b.dataset.j;A.r[k]=j;S.ans[t.id]=A;if(j===t.qs[k].a){addPts(10);snd("ok")}else snd("no");save();const y=window.scrollY;render();window.scrollTo(0,y)});bind();break}
 case "compare":{const p=S.ans.palpite?S.ans.palpite.v:null;const P=T[0].o;h+=`<h2>${t.h}</h2><div class="card">No começo, você respondeu: <b>${p!=null?P[p]:"—"}</b>.<br>A resposta: Hitler foi <b>nomeado, dentro das regras</b>. ${src("[[tl]]")}</div><div class="card"><b>A pergunta que fica:</b> em que momento da escada você acha que ainda dava para parar? <span class="mute">(opcional)</span><textarea id="why" rows="3">${esc(A.why||"")}</textarea></div>`+nav(true);frame(h);
  document.getElementById("why").oninput=e=>{A.why=e.target.value;S.ans.compare=A;save()};bind();break}
 case "end":{const F=S.fb||{};h+=`<h2>${t.h}</h2><div class="card" style="text-align:center"><p style="margin:0"><b>${S.pts} de ${MAX} pontos</b> em previsões e testes.</p></div>
  <div class="card"><p class="kick" style="margin-top:0">Avalie o curso</p><b>Que nota você dá?</b><div class="rate">${[1,2,3,4,5].map(n=>`<button class="${F.nota===n?'on':''}" data-n="${n}">${n}</button>`).join("")}</div>
  <p><b>Sentiu que o curso favoreceu algum lado?</b></p><select id="lado"><option value="">Escolha</option>${["Não","Sim, a esquerda","Sim, a direita","Não sei"].map(o=>`<option ${F.lado===o?"selected":""}>${o}</option>`).join("")}</select>
  <p><b>O que você aprendeu que não sabia?</b></p><textarea id="aprendi" rows="2">${esc(F.aprendi||"")}</textarea>
  <p><b>Que tema você quer que vire curso?</b></p><textarea id="tema" rows="2">${esc(F.tema||"")}</textarea>
  <button class="btn" id="env">${F.sent?"Avaliação enviada ✓":"Enviar avaliação"}</button></div>
  <div class="card"><p class="kick" style="margin-top:0">Para ir além</p><ul class="list"><li>"É isto um homem?", de Primo Levi: o relato de um sobrevivente de Auschwitz.</li><li>"O diário de Anne Frank".</li><li>"A chegada do Terceiro Reich", de Richard J. Evans (Planeta): como os nazistas chegaram ao poder.</li><li>"Os carrascos voluntários de Hitler", de Daniel Goldhagen (Companhia das Letras), e "Homens comuns", de Christopher Browning (Vide Editorial): os dois lados do debate.</li><li>"Quixote nas trevas", de Fábio Koifman (Record): o embaixador Souza Dantas.</li></ul><p class="mute">▶️ <a style="color:var(--amb2)" href="https://www.youtube.com/results?search_query=como+hitler+chegou+ao+poder+document%C3%A1rio" target="_blank" rel="noopener">Buscar documentários no YouTube</a></p></div>
  <div class="card"><p class="kick" style="margin-top:0">Fontes deste curso</p><ul class="fontes">${Object.values(FONTES).map(f=>`<li>${esc(f.t)}${f.u?` · <a href="${f.u}" target="_blank" rel="noopener">abrir</a>`:""}</li>`).join("")}</ul></div>
  <button class="btn ghost" id="again">Recomeçar</button>`;frame(h);
  app.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{S.fb.nota=+b.dataset.n;save();render()});
  document.getElementById("lado").onchange=e=>{S.fb.lado=e.target.value;save()};
  document.getElementById("aprendi").oninput=e=>{S.fb.aprendi=e.target.value;save()};
  document.getElementById("tema").oninput=e=>{S.fb.tema=e.target.value;save()};
  document.getElementById("env").onclick=()=>{S.fb.sent=true;try{const q=JSON.parse(localStorage.getItem("pmu-fila")||"[]");q.push({curso:"nazismo",quando:new Date().toISOString(),...S.fb});localStorage.setItem("pmu-fila",JSON.stringify(q))}catch(e){}save();render()};
  document.getElementById("again").onclick=()=>{S={i:0,pts:0,ans:{},mute:S.mute,fb:{},started:true};save();render()};break}
 }}
const pop=document.getElementById("fnpop");
document.addEventListener("click",e=>{const b=e.target.closest(".fn");if(b){e.preventDefault();e.stopPropagation();const f=FONTES[b.dataset.f];if(!f)return;document.getElementById("fnbody").innerHTML=`<b>Fonte</b><br>${esc(f.t)}${f.u?`<br><a href="${f.u}" target="_blank" rel="noopener">Abrir a fonte ↗</a>`:""}`;pop.style.display="block";return}
 if(e.target.closest("#fnpop .x")||!e.target.closest("#fnpop"))pop.style.display="none"},true);
render();
</script>
</body></html>
