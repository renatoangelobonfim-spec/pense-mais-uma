 const X=x=>L+(x-x0)/(x1-x0)*(W-L-R),Y=y=>T+(1-y/ymax)*(H-T-B);
 const d=b.pts.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)).join(" ");
 let len=0;for(let i=1;i<b.pts.length;i++){len+=Math.hypot(X(b.pts[i][0])-X(b.pts[i-1][0]),Y(b.pts[i][1])-Y(b.pts[i-1][1]))}len=Math.ceil(len)+4;

 const dots=b.pts.map((p,i)=>`<circle class="dot" cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="4"/>`+(show[i]?`<text class="vl" x="${X(p[0]).toFixed(1)}" y="${(Y(p[1])-9).toFixed(1)}" text-anchor="${X(p[0])>W-40?"end":X(p[0])<L+20?"start":"middle"}">${fmt(p[1])}</text><text class="ax" x="${X(p[0]).toFixed(1)}" y="${H-6}" text-anchor="${X(p[0])>W-40?"end":X(p[0])<L+20?"start":"middle"}">${p[0]}</text>`:"")).join("");

 <section class="box"><h3>Avalie o curso</h3><p>Que nota você dá?</p><div class="rate">${[1,2,3,4,5].map(x=>`<button data-n="${x}" class="${S.fb.nota===x?"on":""}">${x}</button>`).join("")}</div>
 <p>O que você aprendeu que não sabia?</p><textarea id="apr" rows="2">${esc(S.fb.apr||"")}</textarea>
 <p>Sentiu que o curso favoreceu algum lado?</p><select id="lado"><option value="">Escolha</option>${["Não","Sim, a favor da mão dura","Sim, contra a mão dura","Não sei"].map(o=>`<option ${S.fb.lado===o?"selected":""}>${o}</option>`).join("")}</select>
 <p>Comentário</p><textarea id="com" rows="2">${esc(S.fb.com||"")}</textarea>
 <p>Que tema você quer que vire curso?</p><textarea id="tema" rows="2">${esc(S.fb.tema||"")}</textarea>
 <button class="go" id="env">${S.fb.sent?"AVALIAÇÃO ENVIADA ✓":"ENVIAR AVALIAÇÃO"}</button></section>
 <section class="box"><h3>Fontes</h3><ul class="fontes">${Object.values(FONTES).map(f=>`<li>${esc(f.t)}${f.u?` · <a href="${f.u}" target="_blank" rel="noopener">abrir</a>`:""}</li>`).join("")}</ul>
 <button class="go ghost" id="top">VOLTAR AO INÍCIO</button></section>`;
 document.getElementById("app").innerHTML=h}
build();
function showVote(){const v=S.vote,el=document.getElementById("vcd");if(v==null){el.innerHTML="";return}const o=VOTO[v];el.innerHTML=`<div class="cd"><i>QUEM DEFENDE DIZ</i>${tx(o.pro)}<i>QUEM CRITICA DIZ</i>${tx(o.con)}</div>`}
showVote();
const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const t=e.target;t.classList.add("in");
 t.querySelectorAll(".ln").forEach(p=>p.style.strokeDashoffset="0");t.querySelectorAll(".bars i").forEach(i=>i.style.width=i.dataset.w+"%");
 const cap=t.closest(".cap");if(cap){const i=+cap.dataset.i;if(i>S.last){S.last=i;save()}}io.unobserve(t)}),{threshold:.2});
document.querySelectorAll(".b").forEach(b=>io.observe(b));
const bar=document.querySelector("#bar i");addEventListener("scroll",()=>{const m=document.documentElement.scrollHeight-innerHeight;bar.style.width=(m>0?scrollY/m*100:0)+"%"},{passive:true});
const go=i=>{const el=document.getElementById("cap"+i);if(el)el.scrollIntoView({behavior:"smooth"})};
document.getElementById("start").onclick=()=>go(S.last>1?S.last:0);
const rs=document.getElementById("restart");if(rs)rs.onclick=()=>{S.last=0;save();go(0)};
document.getElementById("top").onclick=()=>scrollTo({top:0,behavior:"smooth"});
document.querySelectorAll(".vt").forEach(b=>b.onclick=()=>{S.vote=+b.dataset.k;save();document.querySelectorAll(".vt").forEach(x=>x.classList.toggle("on",x===b));showVote()});
document.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{S.fb.nota=+b.dataset.n;save();document.querySelectorAll("[data-n]").forEach(x=>x.classList.toggle("on",x===b))});
["apr","com","tema"].forEach(k=>document.getElementById(k).oninput=e=>{S.fb[k]=e.target.value;save()});
document.getElementById("lado").onchange=e=>{S.fb.lado=e.target.value;save()};
document.getElementById("env").onclick=e=>{S.fb.sent=true;try{const q=JSON.parse(localStorage.getItem("pmu-fila")||"[]");q.push({curso:"seguranca-publica",quando:new Date().toISOString(),voto:S.vote,...S.fb});localStorage.setItem("pmu-fila",JSON.stringify(q))}catch(x){}save();e.target.textContent="AVALIAÇÃO ENVIADA ✓"};
const pop=document.getElementById("fnpop");
document.addEventListener("click",e=>{const b=e.target.closest(".fn");if(b){e.preventDefault();e.stopPropagation();const f=FONTES[b.dataset.f];if(!f)return;document.getElementById("fnbody").innerHTML=`<b>Fonte</b><br>${esc(f.t)}${f.u?`<br><a href="${f.u}" target="_blank" rel="noopener">Abrir a fonte ↗</a>`:""}`;pop.style.display="block";return}
 if(e.target.closest("#fnpop .x")||!e.target.closest("#fnpop"))pop.style.display="none"},true);
</script>
</body></html>
