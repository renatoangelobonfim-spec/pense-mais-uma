const KEY="pmu-maioridade-v1";let S;try{S=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){S=null}if(!S)S={open:0,vote:null,fb:{}};

function bars(p){const mx=p.bunit==="%"?100:Math.max(...p.bars.map(r=>r[1]));return `<div class="bars b">${p.bars.map(([l,v])=>`<div class="r"><span>${esc(l)}</span><div class="t"><i data-w="${(v/mx*100).toFixed(1)}"></i><em>${fmt(v)} ${esc(p.bunit)}</em>${p.limit?`<span class="lim" style="left:${(p.limit/mx*100*.999).toFixed(1)}%"><b>METADE</b></span>`:""}</div></div>`).join("")}${p.limit?`<div class="small" style="margin-top:14px">A linha tracejada marca metade dos votos.</div>`:""}</div>`}
function table(p){return `<table class="tbl b"><tr>${p.thead.map(h=>`<th>${esc(h)}</th>`).join("")}</tr>${p.table.map(r=>`<tr class="${r[0]==="Brasil"?"br":""}">${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</table>`}
function pista(p,i){const last=i===PISTAS.length-1;
 return `<section class="pista ${i<S.open?"":"lock"}" id="p${i}" data-i="${i}"><div class="k">${esc(p.k)}</div><h2>${esc(p.t)}</h2>
 ${p.docs.map(d=>`<div class="doc b"><p>${tx(d,p.mark)}</p></div>`).join("")}
 ${p.bars?bars(p):""}${p.table?table(p):""}
 <div class="note b">${esc(p.nota)}</div>
 <div class="vai b">${Object.keys(p.vai).map(c=>`<span>→ ${COL[c]}</span>`).join("")}</div>
 <button class="go next" data-next="${i+1}">${last?"MONTAR O QUADRO DO CASO":"ABRIR A PISTA "+(i+2)}</button></section>`}

 return `<section class="board ${S.open>PISTAS.length?"":"lock"}" id="quadro"><div class="k">O QUADRO DO CASO</div><h2>O que a investigação encontrou</h2>

 ${["p","d","n"].map(c=>`<div class="col ${c}"><div class="h"><span>${COL[c]}</span><span>${L[c].length}</span></div><ul>${L[c].map(([t,n])=>`<li>${esc(t)} <small>PISTA ${n}</small></li>`).join("")}</ul></div>`).join("")}
 <section class="box" id="voto"><div class="k">E você?</div><h3>Se a decisão fosse sua</h3><p style="color:var(--mut);margin-top:0">Não existe resposta certa e não vale nota. Toque numa opção para ver os dois lados.</p>
 ${VOTO.map((o,k)=>`<button class="vt ${S.vote===k?"on":""}" data-k="${k}"><b>${esc(o.t)}</b><small>${esc(o.s)}</small></button>`).join("")}<div id="vcd"></div></section>
 <section class="box"><h3>Quer se aprofundar?</h3><p><b>Freakonomics</b>, de Steven Levitt e Stephen Dubner: como incentivos e punições mudam o comportamento, inclusive no crime.<br><br><b>A nova segregação</b>, de Michelle Alexander: a crítica ao encarceramento em massa nos EUA.<br><br><b>Bandidolatria e democídio</b>, de Diego Pessi e Leonardo Giardin de Souza: os autores criticam o que chamam de "bandidolatria", a tendência que veem no sistema penal brasileiro de tratar o criminoso como vítima.<br><br><a href="https://www.youtube.com/results?search_query=plebiscito+Uruguai+2014+baja+edad+imputabilidad" target="_blank" rel="noopener">Vídeos sobre o plebiscito do Uruguai (busca no YouTube)</a><br><a href="https://www.youtube.com/results?search_query=debate+redu%C3%A7%C3%A3o+maioridade+penal" target="_blank" rel="noopener">Debates sobre a redução no Brasil (busca no YouTube)</a></p></section>
 <section class="box"><h3>Avalie o curso</h3><p>Que nota você dá?</p><div class="rate">${[1,2,3,4,5].map(x=>`<button data-n="${x}" class="${S.fb.nota===x?"on":""}">${x}</button>`).join("")}</div>

 <button class="go ghost" id="top">VOLTAR AO INÍCIO</button></section></section>`}
function build(){let h=`<section class="cover"><div class="k">Pense Mais Uma · Investigação</div><h1>Maioridade penal: punir aos 16 reduz o crime?</h1>
 <p class="lead">80% dos brasileiros querem reduzir a maioridade penal, segundo o Datafolha (out/2026), e o Congresso voltou ao tema em 2026. Você vai abrir oito pistas, uma de cada vez, e montar o quadro do caso: o que está provado, o que está em disputa e o que ninguém sabe.</p>

 h+=PISTAS.map(pista).join("")+board();document.getElementById("app").innerHTML=h;

const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const t=e.target;t.classList.add("in");t.querySelectorAll(".bars i").forEach(i=>i.style.width=i.dataset.w+"%");io.unobserve(t)}),{threshold:.15});
