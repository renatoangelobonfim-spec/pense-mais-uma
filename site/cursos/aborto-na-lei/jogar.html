  con:"Uns dizem que a lei já vai longe demais, sem prazo máximo [[cnn_pl]] [[pl_autor]]; outros, que ela não evita cerca de 500 mil abortos por ano. [[pna]]",
  onde:"Brasil, desde 1940 (anencefalia desde 2012). [[cp]] [[stf54]]"},
 {t:"Ampliar as exceções",s:"por exemplo, defeitos graves no feto",
  pro:"Na Polônia, o Parlamento aprovou voltar a permitir nesses casos, com apoio da maioria da população. [[oko]] [[pol_poll]] No Brasil, 15% querem ampliar os casos permitidos (Datafolha, 2024). [[df24]]",
  con:"Críticos, como o presidente polonês Karol Nawrocki, dizem que permitir o aborto por doenças como a síndrome de Down seria eugenia. [[lpj]]",
  onde:"Polônia até 2020; Colômbia, após 24 semanas. [[pol_n]] [[col_elp]]"},
 {t:"Descriminalizar até 12 semanas",s:"o caminho da ADPF 442",
  pro:"No Uruguai, a parcela das mortes maternas causada por aborto caiu muito, embora a queda tenha começado antes da lei. [[uy_chq]] [[uy_rn]] Barroso disse que ninguém é a favor do aborto em si, e que a questão é se a mulher deve ser presa. [[stf_rw]]",
  con:"Na Irlanda, os abortos no país chegaram a recorde [[irl_spuc]]; e críticos dizem que só o Congresso pode decidir isso. [[mig_cn]]",

];

const KEY="pmu-aborto-v1";let S;try{S=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){S=null}
const fresh=()=>({scr:"intro",max:0,cur:0,vote:null,fb:{}});if(!S)S=fresh();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const src=h=>String(h).replace(/\[\[([a-z0-9_]+)\]\]/g,(m,k)=>FONTES[k]?`<button type="button" class="fn" data-f="${k}" aria-label="Ver fonte: ${esc(FONTES[k].s)}">🔎 ${esc(FONTES[k].s)}</button>`:"");
const tx=h=>src(esc(h).replace(/&quot;/g,'"'));
const app=document.getElementById("app");const N=EV.length;const Y0=1940,Y1=2026;
function statusAt(code,i){const e=EV[i],P=PAISES[code];let st=null;
 for(const [yr,s] of P.h){if(yr<e.y){st=s;continue}if(yr===e.y){const ix=EV.findIndex(v=>v.c===code&&v.y===yr);if(ix<0||ix<=i)st=s}}return st}
function mapSVG(i,hl){const L="#1E2437";let s=`<svg class="map" viewBox="0 0 240 172" role="img" aria-label="Mapa com a lei de cada país em ${EV[i].y}">`;
 s+=`<path fill="${L}" d="M18 34 Q40 16 74 22 Q96 26 98 42 Q92 60 80 66 Q72 76 66 88 Q58 82 54 70 Q30 62 18 34Z M74 92 Q96 84 116 96 Q128 108 122 126 Q110 150 98 166 Q88 150 84 128 Q76 110 74 92Z M140 26 Q160 16 190 20 Q206 28 200 44 Q186 56 168 58 Q148 54 140 26Z M150 66 Q178 60 196 74 Q202 104 186 128 Q172 140 166 120 Q158 96 150 66Z M206 22 Q232 24 238 46 Q232 68 214 70 Q204 52 206 22Z"/>`;
 for(const code in PAISES){const P=PAISES[code],st=statusAt(code,i),col=st?ST[st][1]:"#2A3047",on=code===hl;
  s+=`<circle class="d" cx="${P.x}" cy="${P.y}" r="${on?7:4.6}" fill="${col}" ${on?'stroke="#ECE9F5" stroke-width="1.6"':""}/>`;
  if(on||code==="BRA")s+=`<text x="${P.x+(P.x>200?-8:9)}" y="${P.y+3}" font-size="7.5" font-weight="700" fill="${on?"#ECE9F5":"#BFC4D6"}" font-family="IBM Plex Mono" ${P.x>200?'text-anchor="end"':""}>${esc(P.n.toUpperCase())}</text>`}
 return s+`</svg>`}
const leg=()=>`<div class="leg">${Object.values(ST).map(([n,c])=>`<span><i style="background:${c}"></i>${n}</span>`).join("")}<span><i style="background:#2A3047"></i>sem dado</span></div>`;
function pos(i){const e=EV[i];let x=(e.y-Y0)/(Y1-Y0)*100;const same=EV.filter((v,k)=>k<i&&v.y===e.y&&v.l===e.l).length;return Math.min(100,x+same*2.2)}
function timeline(){return `<div class="tl"><span class="lane" style="top:6px">MUNDO</span><span class="lane" style="top:32px">BRASIL</span><div class="ln" style="top:15px"></div><div class="ln" style="top:41px"></div>
 ${EV.map((e,i)=>`<button class="ev ${i<=S.max?"on":""} ${i===S.cur?"cur":""}" data-i="${i}" ${i<=S.max?"":"disabled"} aria-label="${e.y}: ${esc(e.t)}${i<=S.max?"":" (bloqueado)"}" style="left:calc(52px + (100% - 58px) * ${pos(i)/100});top:${e.l==="m"?16:42}px"><i></i></button>`).join("")}
 <span class="tk" style="left:52px">1940</span><span class="tk" style="left:calc(52px + (100% - 58px) * ${(1973-Y0)/(Y1-Y0)});transform:translateX(-50%)">1973</span><span class="tk" style="left:calc(52px + (100% - 58px) * ${(2000-Y0)/(Y1-Y0)});transform:translateX(-50%)">2000</span><span class="tk" style="right:6px">2026</span></div>`}
function adTable(e){if(!e.ad&&!e.mud)return"";return `<div class="ad"><div class="h">${e.adh||"ANTES × DEPOIS"}</div>${(e.ad||[]).map(([m,a,d,fs])=>`<div class="row"><div class="m">${esc(m)}</div>${a===null?`<div><span style="display:block;background:rgba(255,255,255,.09);border-radius:6px;padding:5px 7px;font-weight:600;font-size:13px">${esc(d)}</span></div>`:`<div class="ba"><span>${esc(a)}</span><em>→</em><span>${esc(d)}</span></div>`}<div style="margin-top:4px">${fs.map(f=>src("[["+f+"]]")).join("")}</div></div>`).join("")}${e.mud?`<div class="row note"><b>${e.ad?"O QUE MAIS MUDOU NA MESMA ÉPOCA":"PARA LER ESSE NÚMERO"}</b>${tx(e.mud)}</div>`:""}</div>`}
function render(){window.scrollTo(0,0);({intro,tl:play,end})[S.scr]()}
function intro(){app.innerHTML=`<div class="top"><span>PENSE MAIS UMA · MUNDO × BRASIL</span><span>LINHA DO TEMPO</span></div>
 ${mapSVG(N-1,"BRA")}${leg()}
 <div class="k" style="margin-top:14px">1940 → 2026 · 18 momentos</div><h1>Aborto na lei: como o mundo decidiu e onde o Brasil está?</h1>
 <p class="l">Avance pela linha do tempo e veja o mapa mudar: cada país acende com a cor da lei daquele ano. A linha de cima é o Mundo; a de baixo, o Brasil.</p>
 <div class="how"><b>Como funciona</b><br>Não tem pergunta nem ponto. Você destrava os 18 momentos, um por vez, e pode voltar a qualquer um tocando na linha. Em cada momento: o que mudou, os números de antes e depois e os dois lados, com fonte em cada dado (toque em 🔎). Antes e depois mostra o que mudou, não prova o que causou. No fim, o mapa de hoje, o debate e o seu voto.</div>
 <div class="how" style="font-size:13px;color:var(--mut)">O mapa é simplificado: cada país tem detalhes que o cartão explica. El Salvador não tinha exceção escrita na lei até 1973, e a Irlanda só permitia em risco de vida de 2014 a 2018. Este curso trata de leis e números, sem imagens nem relatos de casos.</div>
 <button class="btn solid" id="go" style="margin-top:16px;width:100%">${S.max>0?"CONTINUAR DE "+EV[S.cur].y:"COMEÇAR EM 1940"}</button>
 <p style="text-align:center;font:600 11px 'IBM Plex Mono';color:var(--mut)">DADOS ATUALIZADOS EM NOVEMBRO DE 2026</p>`;
 document.getElementById("go").onclick=()=>{S.scr="tl";save();render()}}
function play(){const i=S.cur,e=EV[i],P=PAISES[e.c],last=i===N-1;
 app.innerHTML=`<div class="top"><span>1940 → 2026</span><span>${S.max+1}/${N} DESTRAVADOS</span></div>
 ${mapSVG(i,e.c)}${leg()}
 <div class="yr"><b>${e.y}</b><span>${e.l==="m"?"MUNDO":"BRASIL"} · MOMENTO ${i+1} DE ${N}</span></div>${timeline()}
 <div class="card" key="${i}"><div class="k">${esc(P.n)} · ${esc(e.k)}</div><h2>${esc(e.t)}</h2><p class="x">${tx(e.x)}</p>
 ${adTable(e)}${e.pro||e.con?`<div class="two">${e.pro?`<div><b>QUEM APOIA DIZ</b>${tx(e.pro)}</div>`:""}${e.con?`<div><b>QUEM CRITICA DIZ</b>${tx(e.con)}</div>`:""}</div>`:""}</div>
 <div class="nav"><button class="btn ghost" id="prev" ${i===0?"disabled":""} aria-label="Momento anterior">←</button>
 <button class="btn solid" id="next">${last?"VER O MAPA DE HOJE":i<S.max?"PRÓXIMO MOMENTO →":"DESTRAVAR "+EV[i+1].y+" →"}</button></div>
 <button class="btn ghost" id="home" style="margin-top:8px;flex:none;width:100%;min-height:40px">VOLTAR AO INÍCIO</button>`;
 app.querySelectorAll(".tl .ev").forEach(b=>b.onclick=()=>{S.cur=+b.dataset.i;save();render()});
 document.getElementById("prev").onclick=()=>{S.cur=Math.max(0,i-1);save();render()};
 document.getElementById("next").onclick=()=>{if(last){S.scr="end"}else{S.cur=i+1;S.max=Math.max(S.max,i+1)}save();render()};
 document.getElementById("home").onclick=()=>{S.scr="intro";save();render()}}
function end(){const F=S.fb,v=S.vote;const order=["BRA","SLV","POL","EUA","IRL","FRA","URU","ARG","COL"];
 app.innerHTML=`<div class="top"><span>2026</span><span>${N}/${N} DESTRAVADOS</span></div>${mapSVG(N-1,"BRA")}${leg()}
 <div class="k" style="margin-top:12px">O mapa de hoje</div><h2>Onde cada país está em 2026</h2>
 <div class="now">${order.map(c=>`<span class="${c==="BRA"?"br":""}">${esc(PAISES[c].n)}</span><span class="${c==="BRA"?"br":""}">${ST[statusAt(c,N-1)][0]}</span>`).join("")}</div>
 <p class="l" style="font-size:14px;color:var(--mut)">${tx("O Brasil está entre os países que só permitem em exceções. No STF, a ação das 12 semanas está em 2 a 0 e parada [[cef442]]; na Câmara, o PL 1904 iria na direção contrária. [[camara_pl]]")}</p>
 <div class="how"><b>O debate de verdade</b><p style="font-size:14px;line-height:1.5;margin:.4em 0">${tx("O que é fato: as leis mudaram nos dois sentidos, e os números de antes e depois são os que os dados mostram até agora. O que é opinião: qual lei é a melhor. Os dois lados partem de valores que levam a sério.")}</p>
 <div class="two"><div><b>QUEM DEFENDE PROTEGER A VIDA DESDE A CONCEPÇÃO</b>${tx("A vida deve ser protegida desde a concepção: o Pacto de San José, que o Brasil assinou, diz que a vida deve ser protegida \"em geral, desde o momento da concepção\" [[sjose]], e o Código Civil põe a salvo os direitos do nascituro desde a concepção. [[cc2]] No Brasil, 35% querem proibir em qualquer situação, e só 6% aceitam o aborto em qualquer caso (Datafolha, 2024). [[df24]] [[df24b]]")}</div>
 <div><b>QUEM DEFENDE A ESCOLHA DA MULHER</b>${tx("Proibir não impede o aborto, só o torna inseguro: no Brasil, estima-se meio milhão por ano. [[pna]] No Uruguai, a parcela das mortes maternas causada por aborto caiu, embora a queda tenha começado antes da lei. [[uy_chq]] [[uy_rn]] E 87% dos brasileiros apoiam o direito em caso de estupro (Datafolha, 2022). [[df22]]")}</div></div>
 <p style="font-size:13px;color:var(--mut);margin:.6em 0 0">O curso não toma partido: você decide qual argumento pesa mais.</p></div>
 <div class="how"><b>Se você fosse deputado(a), qual lei proporia?</b><p style="font-size:13px;color:var(--mut);margin:.3em 0">Não existe resposta certa e o voto não vale ponto. Toque em cada opção para ver os argumentos.</p>
 ${VOTO.map((o,k)=>`<button class="vt ${v===k?"on":""}" data-k="${k}"><b>${esc(o.t)}</b><small>${esc(o.s)}</small></button>`).join("")}
 ${v!==null?`<div class="cd"><p><i>QUEM DEFENDE DIZ</i><br>${tx(VOTO[v].pro)}</p><p><i>QUEM CRITICA DIZ</i><br>${tx(VOTO[v].con)}</p><p><i>ONDE FOI TENTADO</i><br>${tx(VOTO[v].onde)}</p></div>`:""}</div>
 <div class="how"><b>Avalie o curso</b><p style="font-size:14px">Que nota você dá?</p><div class="rate">${[1,2,3,4,5].map(x=>`<button data-n="${x}" class="${F.nota===x?"on":""}">${x}</button>`).join("")}</div>
 <p style="font-size:14px">O que você aprendeu que não sabia?</p><textarea id="apr" rows="2">${esc(F.apr||"")}</textarea>
 <p style="font-size:14px">Sentiu que o curso favoreceu algum lado?</p><select id="lado"><option value="">Escolha</option>${["Não","Sim, a favor de proibir","Sim, a favor de liberar","Não sei"].map(o=>`<option ${F.lado===o?"selected":""}>${o}</option>`).join("")}</select>
 <p style="font-size:14px">Comentário</p><textarea id="com" rows="2">${esc(F.com||"")}</textarea>
 <p style="font-size:14px">Que tema você quer que vire curso?</p><textarea id="tema" rows="2">${esc(F.tema||"")}</textarea>
 <button class="btn solid" id="env" style="width:100%;margin-top:10px">${F.sent?"AVALIAÇÃO ENVIADA ✓":"ENVIAR AVALIAÇÃO"}</button></div>
 <div class="how"><b>Quer se aprofundar?</b><br><a href="https://www.youtube.com/results?search_query=debate+aborto+STF+ADPF+442" target="_blank" rel="noopener">Vídeos sobre o debate no STF (busca no YouTube)</a></div>
 <div class="how"><b>Fontes</b><ul class="fontes">${Object.values(FONTES).map(f=>`<li>${esc(f.t)}${f.u?` · <a href="${f.u}" target="_blank" rel="noopener">abrir</a>`:""}</li>`).join("")}</ul></div>
 <div class="nav"><button class="btn" id="back">← VOLTAR À LINHA</button><button class="btn" id="again">RECOMEÇAR</button></div>`;
 app.querySelectorAll(".vt").forEach(b=>b.onclick=()=>{S.vote=+b.dataset.k;save();const y=b.getBoundingClientRect().top;render();const nb=app.querySelector('.vt[data-k="'+S.vote+'"]');if(nb)window.scrollTo(0,nb.getBoundingClientRect().top+scrollY-y)});
 app.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{S.fb.nota=+b.dataset.n;save();app.querySelectorAll("[data-n]").forEach(x=>x.classList.toggle("on",x===b))});
 ["apr","com","tema"].forEach(k=>document.getElementById(k).oninput=e=>{S.fb[k]=e.target.value;save()});
 document.getElementById("lado").onchange=e=>{S.fb.lado=e.target.value;save()};
 document.getElementById("env").onclick=e=>{S.fb.sent=true;try{const q=JSON.parse(localStorage.getItem("pmu-fila")||"[]");q.push({curso:"aborto-mundo-brasil",quando:new Date().toISOString(),voto:S.vote,...S.fb});localStorage.setItem("pmu-fila",JSON.stringify(q))}catch(x){}save();e.target.textContent="AVALIAÇÃO ENVIADA ✓"};
 document.getElementById("back").onclick=()=>{S.scr="tl";save();render()};
 document.getElementById("again").onclick=()=>{S=fresh();save();render()}}
const pop=document.getElementById("fnpop");
document.addEventListener("click",e=>{const b=e.target.closest(".fn");if(b){e.preventDefault();e.stopPropagation();const f=FONTES[b.dataset.f];if(!f)return;document.getElementById("fnbody").innerHTML=`<b>Fonte</b><br>${esc(f.t)}${f.u?`<br><a href="${f.u}" target="_blank" rel="noopener">Abrir a fonte ↗</a>`:""}`;pop.style.display="block";return}
 if(e.target.closest("#fnpop .x")||!e.target.closest("#fnpop"))pop.style.display="none"},true);
render();
</script>
